<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 · 文件管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 24px 0;
        }
        .pw-card {
            width: 380px; max-width: 92vw;
            background: #fff; border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            padding: 36px 32px;
        }
        .pw-card .title { font-size: 1.25rem; font-weight: 600; color: #1a202c; text-align: center; margin-bottom: 4px; }
        .pw-card .subtitle { font-size: 0.85rem; color: #94a3b8; text-align: center; margin-bottom: 20px; }
        .force-tip {
            background: #fffbeb; color: #b45309; border: 1px solid #fde68a;
            border-radius: 8px; padding: 10px 12px; font-size: 0.82rem; margin-bottom: 18px; line-height: 1.6;
        }
        .error-banner {
            background: #fef2f2; color: #dc2626; border: 1px solid #fecaca;
            border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; margin-bottom: 16px;
        }
        .form-label { font-size: 0.85rem; color: #475569; }
        .form-text { font-size: 0.75rem; }
        .btn-submit { width: 100%; }
        .foot-link { text-align: center; font-size: 0.82rem; color: #64748b; margin-top: 16px; }
        .foot-link a { color: #2563eb; text-decoration: none; }
        .foot-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="pw-card">
        <div class="title">🔐 修改密码</div>
        <div class="subtitle">{{ username }} · 请设置新的登录密码</div>

        {% if forced %}
        <div class="force-tip">
            这是项目首次运行的初始密码，出于安全考虑，<b>修改密码后才能继续使用</b>。<br>
            修改完成会自动进入系统。
        </div>
        {% endif %}

        {% if error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('auth.change_password') }}" autocomplete="off">
            <div class="mb-3">
                <label class="form-label">原密码</label>
                <input type="password" class="form-control" name="old_password"
                       autocomplete="current-password" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">新密码</label>
                <input type="password" class="form-control" name="new_password"
                       autocomplete="new-password" required>
                <div class="form-text text-muted">至少 6 位，且不能与原密码相同</div>
            </div>
            <div class="mb-4">
                <label class="form-label">确认新密码</label>
                <input type="password" class="form-control" name="confirm"
                       autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-submit">确认修改</button>
        </form>

        {% if forced %}
        <div class="foot-link">
            <a href="{{ url_for('auth.logout') }}">退出登录</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
