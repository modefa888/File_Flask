<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>协作编辑 · 文件管理</title>
<script>/* 尽早应用上次选择的主题，避免首屏先闪一下深色 */try { if (localStorage.getItem("collab.theme") === "light") document.documentElement.classList.add("theme-light"); } catch (e) {}</script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="/static/vendor/codemirror/material-darker.min.css">
<script src="/static/vendor/codemirror/codemirror.min.js"></script>
<script src="/static/vendor/codemirror/addon/selection/active-line.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  /* ---------- 全局自定义滚动条（与 IDE 视觉一致） ---------- */
  * {
    scrollbar-width: thin;                          /* Firefox */
    scrollbar-color: #3a3a3a transparent;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: #3a3a3a; border-radius: 4px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background-color: #555; }
  ::-webkit-scrollbar-corner { background: transparent; }
  body {
    display: flex; flex-direction: column;
    background: #1e1e1e; color: #d4d4d4; font-size: 13px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: #181818; border-bottom: 1px solid #2c2c2c; flex: none;
  }
  header .t { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  header .t i { color: #6cb6ff; }
  /* 头部只显示文件夹名：放大加粗；文件名与完整路径见悬浮提示 */
  header .room { color: inherit; font-size: 15px; font-weight: 700; word-break: break-all; }
  .spacer { flex: 1; }
  .st { font-size: 12px; white-space: nowrap; }
  .st.on { color: #7fd88f; }
  .st.off { color: #c98; }
  .peers { display: flex; gap: 6px; flex-wrap: wrap; }
  .peer {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 3px;
    border-radius: 20px; font-size: 12px; background: #2d2d33;
  }
  .peer .dot {
    width: 18px; height: 18px; border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center; font-size: 10px; color: #1b1b1e; font-weight: 700;
  }
  .c-view-badge { color: #9aa0a6; font-weight: 400; font-size: 11px; }
  html.theme-light .c-view-badge { color: #6a6a6a; }
  header input, header button {
    background: #252528; border: 1px solid #3c3c3c; color: #d4d4d4;
    border-radius: 5px; padding: 5px 8px; font-size: 12px; outline: none;
  }
  header input:focus { border-color: #0a6aa8; }
  header button { cursor: pointer; }
  header button:hover { background: #333338; }
  header button.primary { background: #0d7ec4; border-color: #0d7ec4; color: #fff; }
  header button.primary:hover { background: #0a6aa8; }
  header button.danger { background: #5a2b2b; border-color: #5a2b2b; color: #ffb4b4; }
  main { flex: 1; display: flex; min-height: 0; }
  /* 文件树 */
  #tree {
    width: 250px; flex: none; overflow: auto; background: #181818;
    border-right: 1px solid #2c2c2c; padding: 8px 0; user-select: none;
  }
  #tree .head {
    padding: 4px 12px 8px; color: #8a8a8a; font-size: 11px; letter-spacing: .05em;
    display: flex; align-items: center; gap: 6px;
  }
  #tree .head .crumb { flex: 1; word-break: break-all; }
  #tree .head button {
    background: none; border: none; color: #8a8a8a; cursor: pointer; padding: 2px 4px;
  }
  #tree .tree-row {
    display: flex; align-items: center; gap: 6px; min-height: 22px; padding: 1px 8px 1px 4px;
    font-size: 13px; line-height: 1.5; color: #cccccc; cursor: pointer; white-space: nowrap;
  }
  #tree .tree-row:hover { background: #2a2d2e; }
  #tree .tree-row .twist { width: 16px; text-align: center; color: #9aa0a6; font-size: 10px; flex: none; }
  #tree .tree-row .ic { width: 16px; flex: none; display: flex; align-items: center; justify-content: center; }
  #tree .tree-row .ic .bi, #tree .tree-row .ic .seti-ic { font-size: 1.4em; line-height: 1; }
  #tree .tree-row .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #tree .tree-row.file { cursor: pointer; }
  /* 批量分享模式：当前正在共同编辑的文件高亮 */
  #tree .tree-row.active { background: #0d7ec4; color: #fff; }
  #tree .tree-row.active .nm { color: #fff; }
  #tree .tree-row.active .ic { color: #fff; }
  #tree .tree-children { display: none; padding-left: 14px; }
  #tree .tree-children.open { display: block; }
  /* SETI 官方文件图标字体（与 IDE 资源管理器同源） */
  @font-face { font-family: "seti"; src: url("/static/vendor/seti/seti.woff") format("woff"); font-display: block; }
  .seti-ic { font-family: "seti"; font-style: normal; font-weight: normal; font-size: 1.4em; line-height: 1; display: inline-block; vertical-align: baseline; transform: translateY(.11em); }
  /* 编辑器 */
  #edwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #edbar {
    padding: 6px 12px; background: #181818; border-bottom: 1px solid #2c2c2c;
    color: #9aa0a6; font-size: 12px; display: none;
  }
  #ed { flex: 1; min-height: 0; }
  /* 编辑区上方标签页：批量分享时在共享文件间快速切换（与左侧树联动） */
  #tabs {
    display: none; background: #181818; border-bottom: 1px solid #2c2c2c;
    padding: 4px 8px 0; overflow-x: auto; white-space: nowrap;
  }
  #tabs .tb {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; margin-right: 2px;
    font-size: 12.5px; color: #9aa0a6; border: 1px solid transparent; border-bottom: none;
    border-radius: 8px 8px 0 0; cursor: pointer; user-select: none; white-space: nowrap;
  }
  #tabs .tb:hover { background: #232323; color: #cccccc; }
  #tabs .tb.on { background: #2a2d2e; color: #fff; border-color: #2c2c2c; }
  #tabs .tb .seti-ic { font-size: 1.2em; transform: translateY(.08em); }
  #tabs .tb .tb-nm { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  #tabs .tb .tb-eye { color: #8a8a8a; font-size: 11px; }
  /* 仅查看文件的预览区：图片/PDF/音视频内联展示，压缩包等提供下载 */
  #viewer { flex: 1; min-height: 0; display: flex; flex-direction: column; background: #1e1e1e; }
  #viewer .vw-bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: #181818; border-bottom: 1px solid #2c2c2c;
    color: #9aa0a6; font-size: 12px;
  }
  #viewer .vw-bar .sp { flex: 1; }
  #viewer .vw-body {
    flex: 1; min-height: 0; overflow: auto; padding: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  #viewer .vw-body img, #viewer .vw-body video { max-width: 100%; max-height: 100%; border-radius: 6px; }
  #viewer .vw-body iframe { width: 100%; height: 100%; border: 0; background: #fff; border-radius: 6px; }
  #viewer .vw-dl {
    text-align: center; color: #9aa0a6; font-size: 13px; line-height: 2;
    padding: 26px 36px; border: 1px dashed #3a3a3a; border-radius: 10px;
  }
  #viewer .vw-dl .bi { font-size: 34px; display: block; margin-bottom: 4px; color: #dcb67a; }
  #viewer a {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
    background: #2a2d2e; color: #e6e6e6; border: 1px solid #3a3a3a; border-radius: 6px;
    text-decoration: none; font-size: 12.5px; cursor: pointer;
  }
  #viewer a:hover { background: #33373a; }
  /* 视频播放器（参考 IDE 标签页内嵌播放器）：底部悬浮控制条 + 自动隐藏 */
  #viewer .vw-body.vw-full { padding: 0; }
  #viewer .vpv-wrap { position: relative; width: 100%; height: 100%; background: #000; border-radius: 6px; overflow: hidden; }
  #viewer .vpv-wrap video { width: 100%; height: 100%; object-fit: contain; }
  #viewer .vpv-controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 4px 14px 8px; background: linear-gradient(transparent, rgba(0, 0, 0, .78));
    transition: opacity .2s ease;
  }
  #viewer .vpv-wrap.idle { cursor: none; }
  #viewer .vpv-wrap.idle .vpv-controls { opacity: 0; pointer-events: none; }
  #viewer .vpv-timerow { display: flex; align-items: center; gap: 10px; }
  #viewer .vpv-time { flex: none; color: #e6e6e6; font-size: 11.5px; font-variant-numeric: tabular-nums; }
  #viewer .vpv-progress { flex: 1; padding: 7px 0; cursor: pointer; touch-action: none; }
  #viewer .vpv-track { position: relative; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .22); }
  #viewer .vpv-buffered { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: rgba(255, 255, 255, .32); }
  #viewer .vpv-played { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: #4a9eff; }
  #viewer .vpv-knob {
    position: absolute; top: 50%; left: 0; width: 11px; height: 11px; border-radius: 50%;
    background: #4a9eff; transform: translate(-50%, -50%); box-shadow: 0 0 4px rgba(0, 0, 0, .5);
  }
  #viewer .vpv-row { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
  #viewer .vpv-btn {
    background: none; border: 0; color: #dcdcdc; font-size: 15px; line-height: 1;
    padding: 3px 7px; cursor: pointer; border-radius: 5px;
  }
  #viewer .vpv-btn:hover { color: #fff; background: rgba(255, 255, 255, .12); }
  #viewer .vpv-btn.active { color: #4a9eff; }
  #viewer .vpv-vol { display: flex; align-items: center; gap: 2px; }
  #viewer .vpv-vol-range { width: 72px; accent-color: #4a9eff; height: 3px; cursor: pointer; }
  #viewer .vpv-spacer { flex: 1; }
  #viewer .vpv-speed { position: relative; }
  #viewer .vpv-speed-cur { font-size: 12px; }
  #viewer .vpv-speed-menu {
    display: none; position: absolute; bottom: 28px; right: 0; z-index: 6;
    background: #222; border: 1px solid #3a3a3a; border-radius: 8px; padding: 4px; min-width: 72px;
  }
  #viewer .vpv-speed.open .vpv-speed-menu { display: block; }
  #viewer .vpv-speed-item {
    display: block; width: 100%; text-align: center; background: none; border: 0;
    color: #ccc; font-size: 12px; padding: 4px 10px; border-radius: 5px; cursor: pointer;
  }
  #viewer .vpv-speed-item:hover { background: #333; color: #fff; }
  #viewer .vpv-speed-item.active { color: #4a9eff; }
  /* 下载二次确认悬浮框 */
  #dl-confirm {
    position: fixed; inset: 0; z-index: 300; display: flex;
    align-items: center; justify-content: center; background: rgba(0, 0, 0, .45);
  }
  #dl-confirm .dc-box {
    width: 330px; max-width: calc(100vw - 48px); background: #252526; color: #ddd;
    border: 1px solid #3a3a3a; border-radius: 10px; padding: 16px 18px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, .5); font-size: 13px;
  }
  #dl-confirm .dc-title {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    font-size: 14px; font-weight: 600; color: #fff;
  }
  #dl-confirm .dc-name { word-break: break-all; color: #e6e6e6; margin-bottom: 4px; }
  #dl-confirm .dc-size { color: #9aa0a6; font-size: 12px; min-height: 16px; }
  #dl-confirm .dc-note { color: #8a8a8a; font-size: 12px; margin-top: 8px; line-height: 1.5; }
  #dl-confirm .dc-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #dl-confirm button { border-radius: 6px; font-size: 12.5px; padding: 5px 14px; cursor: pointer; }
  #dl-confirm .dc-cancel { background: none; border: 1px solid #444; color: #ccc; }
  #dl-confirm .dc-cancel:hover { background: #333; color: #fff; }
  #dl-confirm .dc-ok { background: #2f6feb; border: 1px solid #2f6feb; color: #fff; }
  #dl-confirm .dc-ok:hover { background: #3b7bf5; }
  html.theme-light #dl-confirm .dc-box { background: #fff; color: #1f2328; border-color: #d8d8d8; }
  html.theme-light #dl-confirm .dc-title { color: #1f2328; }
  html.theme-light #dl-confirm .dc-name { color: #1f2328; }
  html.theme-light #dl-confirm .dc-size,
  html.theme-light #dl-confirm .dc-note { color: #6a6a6a; }
  html.theme-light #dl-confirm .dc-cancel { border-color: #d0d0d0; color: #57606a; }
  html.theme-light #dl-confirm .dc-cancel:hover { background: #f2f2f2; color: #1f2328; }
  #ed .CodeMirror { height: 100%; font-size: 13px; }
  /* 远端光标 */
  .cc { position: relative; width: 0; border-left: 2px solid var(--cc, #6cb6ff); margin-left: -1px; pointer-events: none; }
  .cc > span {
    position: absolute; top: -1.05em; left: -2px; white-space: nowrap;
    background: var(--cc, #6cb6ff); color: #fff; font-size: 10px; line-height: 1.4;
    padding: 0 4px; border-radius: 3px 3px 3px 0; transform: translateY(-2px);
  }
  .sel { background: var(--cc, #6cb6ff); opacity: .22; }
  /* 提示浮层 */
  #tip {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 99;
    display: flex; align-items: center; justify-content: center;
  }
  #tip .box {
    background: #252526; border: 1px solid #333; border-radius: 10px;
    padding: 22px 28px; max-width: 380px; text-align: center; line-height: 1.7;
  }
  #tip .box .big { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  #tip a { color: #6cb6ff; }

  /* ============ 「谁改的」标注（与 IDE 同一套观感） ============ */
  /* ① 改动行：整行淡色底（色值由 JS 按作者动态生成规则） */
  .CodeMirror-linebackground[class^="collab-tint-"] { border-radius: 2px; }
  /* ② 实际被改动的那几个字：加粗 + 作者色（--ca 由标记内联写入） */
  .collab-ink, .collab-ink span[class*="cm-"] {
    color: var(--ca) !important; font-weight: 700 !important;
  }
  /* ③ 行末作者标签 */
  .collab-tag {
    display: inline-block; margin-left: 10px; padding: 0 7px;
    height: 14px; line-height: 14px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.18); background: rgba(30,36,46,.92);
    color: #c9d1d9; font-weight: 400; font-size: 10px;
    vertical-align: middle; white-space: nowrap; user-select: none; pointer-events: none;
  }
  .collab-tag .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-right: 4px; vertical-align: middle;
  }

  /* ============ 浅色主题（html.theme-light，与 IDE 浅色主题同色系） ============ */
  html.theme-light * { scrollbar-color: #c0c0c0 transparent; }
  html.theme-light ::-webkit-scrollbar-thumb { background: #c0c0c0; }
  html.theme-light ::-webkit-scrollbar-thumb:hover { background-color: #a0a0a0; }
  html.theme-light body { background: #ffffff; color: #1f2328; }
  html.theme-light header { background: #f6f6f6; border-bottom-color: #d8d8d8; }
  html.theme-light header .room { color: #1f2328; }
  html.theme-light header input, html.theme-light header button {
    background: #ffffff; border-color: #d0d0d0; color: #1f2328;
  }
  html.theme-light header input:focus { border-color: #005fb8; }
  html.theme-light header button:hover { background: #e8e8e8; }
  html.theme-light header button.primary { background: #005fb8; border-color: #004c94; color: #fff; }
  html.theme-light header button.primary:hover { background: #004c94; }
  html.theme-light header button.danger { background: #ffeceb; border-color: #f0b6b2; color: #b42318; }
  html.theme-light header a { color: #6a6a6a !important; }
  html.theme-light .peer { background: #ececec; }
  html.theme-light .st.on { color: #1a7f37; }
  html.theme-light #tree { background: #f6f6f6; border-right-color: #d8d8d8; }
  html.theme-light #tree .head { color: #6a6a6a; }
  html.theme-light #tree .head button { color: #6a6a6a; }
  html.theme-light #tree .tree-row { color: #1f2328; }
  html.theme-light #tree .tree-row:hover { background: #e6e6e6; }
  html.theme-light #tree .tree-row.active { background: #005fb8; color: #fff; }
  html.theme-light #tree .tree-row.active .nm,
  html.theme-light #tree .tree-row.active .ic { color: #fff; }
  html.theme-light #tree .tree-row .twist { color: #6a6a6a; }
  html.theme-light #edbar { background: #f6f6f6; border-bottom-color: #d8d8d8; color: #6a6a6a; }
  html.theme-light #tabs { background: #f6f6f6; border-bottom-color: #d8d8d8; }
  html.theme-light #tabs .tb { color: #6a6a6a; }
  html.theme-light #tabs .tb:hover { background: #ececec; color: #1f2328; }
  html.theme-light #tabs .tb.on { background: #e0e0e0; color: #1f2328; border-color: #d8d8d8; }
  html.theme-light #viewer { background: #ffffff; }
  html.theme-light #viewer .vw-bar { background: #f6f6f6; border-bottom-color: #d8d8d8; color: #6a6a6a; }
  html.theme-light #viewer .vw-dl { border-color: #d0d0d0; color: #6a6a6a; }
  html.theme-light #viewer a { background: #fff; color: #1f2328; border-color: #d0d0d0; }
  html.theme-light #tip { background: rgba(0, 0, 0, .28); }
  html.theme-light #tip .box { background: #ffffff; border-color: #d0d0d0; color: #1f2328; }
  html.theme-light #tip a { color: #005fb8; }
  html.theme-light .collab-tag {
    background: #ffffff; border-color: #d0d0d0; color: #4a5560;
  }
  /* 浅色底上把作者色略微加深，避免黄/浅绿在白底上看不清（只作用于改动字符，不含行背景） */
  html.theme-light .collab-ink { filter: brightness(.72) saturate(1.15); }
</style>
</head>
<body>
<header>
  <span class="t" title="协作编辑"><i class="bi bi-people-fill"></i></span>
  <b class="room" id="roomName">连接中…</b>
  <span class="spacer"></span>
  <span class="peers" id="peers"></span>
  <button id="themeBtn" title="切换主题（深色/浅色）"><i class="bi bi-sun"></i></button>
  <input id="myName" style="width:110px" placeholder="你的昵称" maxlength="20">
  <button id="renameBtn" title="修改在协作中显示的名字"><i class="bi bi-pencil"></i></button>
  <button id="reloadBtn" title="重新载入房主的最新内容（解决内容不一致）"><i class="bi bi-arrow-clockwise"></i> 载入</button>
  <span class="st off" id="st">○ 未连接</span>
  <a href="/logout" title="退出登录" style="color:#9aa0a6;margin-left:4px"><i class="bi bi-box-arrow-right"></i></a>
</header>
<main>
  <div id="tree">
    <div class="head">
      <span class="crumb" id="crumb">/</span>
      <button id="rootBtn" title="收起全部并回到共享目录"><i class="bi bi-house"></i></button>
    </div>
    <div id="treeList"></div>
  </div>
  <div id="edwrap">
    <div id="tabs"></div>
    <div id="edbar"></div>
    <div id="ed"></div>
    <div id="viewer" style="display:none"></div>
  </div>
</main>
<div id="tip" style="display:none"><div class="box" id="tipBox"></div></div>
<!-- 下载二次确认悬浮框：点「下载」后先确认，再真正发起下载 -->
<div id="dl-confirm" style="display:none">
  <div class="dc-box">
    <div class="dc-title"><i class="bi bi-download"></i> 确认下载</div>
    <div class="dc-name"></div>
    <div class="dc-size"></div>
    <div class="dc-note">即将下载房主共享的文件，请确认来源可信后再继续</div>
    <div class="dc-btns">
      <button class="dc-cancel" type="button">取消</button>
      <button class="dc-ok" type="button">确认下载</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  var shareId = new URLSearchParams(location.search).get("collab") || "";
  var isAdmin = {{ 'true' if is_admin else 'false' }};

  cm.on("changes", function (_, changes) {

    // 与连接状态无关——本地标注要即时可见，不能等 WebSocket 就绪。
    try {
      changes.forEach(function (c) {
        var span = Math.max(c.to.line - c.from.line, (c.text || []).length - 1);

        var ins = (c.text || []).join("\n");

      var from = cm.indexFromPos(c.from);

      var to = from + removed;

    md: ["markdown", "markdown.min.js"], c: ["clike", "clike.min.js"], cpp: ["clike", "clike.min.js"], h: ["clike", "clike.min.js"],
    hpp: ["clike", "clike.min.js"], java: ["clike", "clike.min.js"], cs: ["clike", "clike.min.js"], go: ["go", "go.min.js"],
    rs: ["clike", "clike.min.js"], php: ["php", "php.min.js"], rb: ["ruby", "ruby.min.js"], sh: ["shell", "shell.min.js"],
    bash: ["shell", "shell.min.js"], yml: ["yaml", "yaml.min.js"], yaml: ["yaml", "yaml.min.js"],

  /* ---------------- WebSocket ---------------- */

    var qs = "token=" + encodeURIComponent(S.token) +

             "&color=" + encodeURIComponent(colorFor(S.myName));
    var ws;
    try { ws = new WebSocket(proto + "://" + location.host + "/ws/collab?" + qs); }
    catch (e) { showTip("无法建立连接", "协作服务不可用，请联系管理员。"); return; }
    S.ws = ws;
    ws.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (_) { return; }

          S.closed = false;

          if (!S.root && m.path) {
            var _cur = (S.rooms || []).filter(function (r) { return r.token === S.token; })[0] || {};
            S.root = m.path;

            } else {

            }

          var rpath = m.path || "";

          var rn = $("roomName");

          seed(m.text || "");

          break;
        case "op":

            for (var pi = 0; pi < S.pending.length; pi++) {

  function seed(text) {

    cm.clearHistory();

  /* 客户端 OT 变换：与服务端 _transform 同一套语义（含 delta 修正） */
  function _otT(inc, other) {
    var of = other.from, ot = other.to, otext = other.text || "";
    var delta = otext.length - (ot - of);
    var f = inc.from, t = inc.to, txt = inc.text || "";
    if (f <= of) {
      if (t <= of) return { from: f, to: t, text: txt };          // 完全在前
      return { from: f, to: Math.max(t, ot) + delta, text: txt }; // 左重叠
    }
    if (f >= ot) return { from: f + delta, to: t + delta, text: txt }; // 完全在后
    return { from: of + otext.length, to: Math.max(t, ot) + delta, text: txt }; // 起点被吞
  }

  function applyRemote(m) {

    // 绝不能丢 op，否则删除/插入会凭空消失
    var op = { from: m.from, to: m.to, text: m.text || "" };

    var pi = S.peerInfo[m.by] || {};
    var who = (m.by === S.myId) ? ME

    markLines(start, start + nl, who);
    markChars(op.from, op.from + String(op.text || "").length, who);

  function renderCursor(m) {

    el.className = "cc"; el.style.setProperty("--cc", m.color || "#6cb6ff");

    if (from.line !== to.line || from.ch !== to.ch)

  /* ================= 「谁改的」标注 =================
     ① 改动行整行淡色底  ② 行末作者名字标签  ③ 实际被改动的那几个字加粗 + 作者色
     刷新页面后由 /api/collab/<token>/authors 重建，所以刷新也不会丢。 */
  var ME = { key: "me", name: "你", color: "#8ab4f8" };

    CLSWHO[cls] = who;

      var st = document.getElementById("collabTintStyles");
      if (!st) {
        st = document.createElement("style"); st.id = "collabTintStyles";
        document.head.appendChild(st);

    var h = null;
    try { h = cm.getLineHandle(line); } catch (e) {}
    var cur = (h && h.bgClass) || "";

    Object.keys(TINTSEEN).forEach(function (cls) {

  function markChars(from, to, who) {
    if (!who || to <= from) return;
    var style = "--ca:" + (who.color || "#6cb6ff");
    var a = from, b = to;
    INKS = INKS.filter(function (mk) {
      var r = mk.find();
      if (!r) return false;

      node.innerHTML = '<i class="dot" style="background:' + esc(who.color) + '"></i>' + esc(who.name);
      var mk = cm.setBookmark({ line: line, ch: cm.getLine(line).length },
                              { widget: node, insertLeft: true });
      if (mk) TAGS.push(mk);
    } catch (e) {}

    for (var k = 0; k < arr.length; k++) if (arr[k].indexOf("collab-tint-") === 0) return arr[k];
    return null;

  /* 重建 [a, b] 所在「连续改动区间」内的行末标签（连续同一作者只挂一个） */
  function refreshTags(a, b) {
    var n = cm.lineCount();
    var ra = Math.max(0, a), rb = Math.min(n - 1, b);
    while (ra > 0 && _lineCls(ra - 1)) ra--;
    while (rb + 1 < n && _lineCls(rb + 1)) rb++;

      return true;

    while (i <= rb) {

      var j = i;

  function markLines(a, b, who) {

  function fetchDir(path) {
    // 专用接口：只允许浏览「被分享的文件目录」；其它路径由服务端 403 拒绝
    var u = "/api/shared/files?share=" + encodeURIComponent(shareId) +
            "&path=" + encodeURIComponent(path);
    return fetch(u)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) throw new Error(d.error);
        return (d.items || []).sort(function (a, b) {
          return (b.is_dir - a.is_dir) || a.name.localeCompare(b.name, "zh");
        });
      });
  }

  function buildRows(items, container, dirPath) {
    if (!container || !container.isConnected) return;   // 容器已被重绘移除：丢弃过期写入
    container.innerHTML = "";
    if (!items.length) {
      container.innerHTML = '<div class="tree-row file"><span class="twist"></span>' +
        '<span class="nm" style="color:#666">空目录</span></div>';
      return;
    }
    var base = (dirPath || "").replace(/\/+$/, "");
    items.forEach(function (it) {
      // 不使用 API 返回的相对 path：一律用「父目录绝对路径 + 名称」，
      // 否则二级目录会被服务端按进程 CWD 解析、不存在时回退成根目录列表（表现为重复内容）
      var full = base + "/" + it.name;
      var row = document.createElement("div");
      row.className = "tree-row" + (it.is_dir ? " dir" : " file");
      row.innerHTML =
        '<span class="twist">' + (it.is_dir ? "▸" : "") + "</span>" +
        '<span class="ic">' + iconFor(it.name, it.is_dir) + "</span>" +
        '<span class="nm" title="协作者仅可浏览目录结构">' + esc(it.name) + "</span>";
      container.appendChild(row);
      if (!it.is_dir) return;
      var kids = document.createElement("div");
      kids.className = "tree-children";
      container.appendChild(kids);
      var open = false, loaded = false;
      row.onclick = function () {
        open = !open;
        kids.classList.toggle("open", open);
        row.querySelector(".twist").textContent = open ? "▾" : "▸";
        if (open && !loaded) {
          loaded = true;
          kids.innerHTML = '<div class="tree-row file"><span class="twist"></span>' +
            '<span class="nm" style="color:#666">加载中…</span></div>';
          fetchDir(full).then(function (list) { buildRows(list, kids, full); })
            .catch(function () { kids.innerHTML = ""; });
        }
      };
    });
  }

  /* 协作页视频播放器：参考 IDE 标签页内嵌播放器的底部控制条
     （播放/暂停、时间+进度+缓冲、音量、倍速、循环、全屏、控制条自动隐藏）。
     音量/静音/倍速偏好记在 localStorage["collab.vpv"]，与 IDE 播放器互不影响。 */
  var _vpvKeysInstalled = false;   // 播放器全局快捷键只装一次
  function _collabVpvLoad() {
    try { return Object.assign({ volume: 1, muted: false, rate: 1 },
      JSON.parse(localStorage.getItem("collab.vpv") || "{}")); }
    catch (e) { return { volume: 1, muted: false, rate: 1 }; }
  }
  function mountCollabVideo(wrap) {
    if (!wrap) return;
    var video = wrap.querySelector("video");
    var store = _collabVpvLoad();
    var save = function () { try { localStorage.setItem("collab.vpv", JSON.stringify(store)); } catch (e) {} };
    var $ = function (s) { return wrap.querySelector(s); };
    var playBtn = $(".vpv-play"), muteBtn = $(".vpv-mute"), volRange = $(".vpv-vol-range");
    var speedWrap = $(".vpv-speed"), speedCur = $(".vpv-speed-cur"), loopBtn = $(".vpv-loop"), fullBtn = $(".vpv-full");
    var progress = $(".vpv-progress"), played = $(".vpv-played"), buffered = $(".vpv-buffered"), knob = $(".vpv-knob");
    var timeCur = $(".vpv-time-cur"), timeDur = $(".vpv-time-dur");
    var fmt = function (s) {
      if (!isFinite(s)) return "--:--";
      s = Math.max(0, Math.floor(s));
      var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      var mm = String(m).padStart(2, "0"), s2 = String(sec).padStart(2, "0");
      return h ? h + ":" + mm + ":" + s2 : mm + ":" + s2;
    };
    var setPlayIcon = function () { playBtn.innerHTML = '<i class="bi ' + (video.paused ? "bi-play-fill" : "bi-pause-fill") + '"></i>'; };
    var togglePlay = function () { if (video.paused) video.play().catch(function () {}); else video.pause(); };
    playBtn.onclick = togglePlay;
    video.onclick = togglePlay;
    video.ondblclick = function () { fullBtn.click(); };
    video.onplay = video.onpause = setPlayIcon;
    setPlayIcon();

    var updateProgress = function () {
      var dur = video.duration || 0, cur = video.currentTime;
      var pct = dur ? cur / dur * 100 : 0;
      played.style.width = pct + "%"; knob.style.left = pct + "%";
      timeCur.textContent = fmt(cur);
      timeDur.textContent = dur ? fmt(dur) : "--:--";
      if (video.buffered.length && dur) {
        buffered.style.width = Math.min(100, video.buffered.end(video.buffered.length - 1) / dur * 100) + "%";
      }
    };
    video.addEventListener("timeupdate", updateProgress);
    video.addEventListener("progress", updateProgress);
    video.addEventListener("loadedmetadata", function () {
      video.playbackRate = Math.min(4, Math.max(0.25, +store.rate || 1));
      updateProgress();
    });

    var dragging = false;
    var seekTo = function (x) {
      if (!isFinite(video.duration) || !video.duration) return;
      var rect = progress.getBoundingClientRect();
      video.currentTime = Math.min(1, Math.max(0, (x - rect.left) / rect.width)) * video.duration;
      updateProgress();
    };
    progress.addEventListener("pointerdown", function (e) {
      dragging = true;
      try { progress.setPointerCapture(e.pointerId); } catch (err) {}
      seekTo(e.clientX);
    });
    progress.addEventListener("pointermove", function (e) { if (dragging) seekTo(e.clientX); });
    progress.addEventListener("pointerup", function () { dragging = false; });
    progress.addEventListener("pointercancel", function () { dragging = false; });

    var volIcon = function () {
      var v = video.muted ? 0 : video.volume;
      muteBtn.innerHTML = '<i class="bi ' + (v === 0 ? "bi-volume-mute-fill" : v < 0.5 ? "bi-volume-down-fill" : "bi-volume-up-fill") + '"></i>';
    };
    volRange.addEventListener("input", function () {
      video.volume = +volRange.value; video.muted = false;
      store.volume = video.volume; store.muted = false; save();
    });
    muteBtn.onclick = function () { video.muted = !video.muted; };
    video.addEventListener("volumechange", function () {
      store.volume = video.volume; store.muted = video.muted; save();
      volRange.value = video.muted ? 0 : video.volume;
      volIcon();
    });
    video.volume = Math.min(1, Math.max(0, +store.volume || 1));
    video.muted = !!store.muted;
    volRange.value = video.muted ? 0 : video.volume;
    volIcon();

    $(".vpv-speed-btn").onclick = function (e) { e.stopPropagation(); speedWrap.classList.toggle("open"); };
    wrap.querySelectorAll(".vpv-speed-item").forEach(function (el) {
      el.onclick = function (e) {
        e.stopPropagation();
        video.playbackRate = +el.dataset.rate;
        store.rate = +el.dataset.rate; save();
        speedCur.textContent = el.textContent;
        wrap.querySelectorAll(".vpv-speed-item").forEach(function (x) { x.classList.toggle("active", x === el); });
        speedWrap.classList.remove("open");
      };
    });
    var initRate = Math.min(4, Math.max(0.25, +store.rate || 1));
    speedCur.textContent = initRate + "x";
    var ri = wrap.querySelector('.vpv-speed-item[data-rate="' + initRate + '"]');
    if (ri) ri.classList.add("active");
    loopBtn.onclick = function () {
      video.loop = !video.loop;
      loopBtn.classList.toggle("active", video.loop);
      loopBtn.title = video.loop ? "循环播放：开" : "循环播放：关";
    };

    fullBtn.onclick = function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (wrap.requestFullscreen) wrap.requestFullscreen();
    };

    /* 控制条自动隐藏：播放中鼠标静止 2.5s 淡出 */
    var idleTimer = null;
    var wake = function () {
      wrap.classList.remove("idle");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () { if (!video.paused) wrap.classList.add("idle"); }, 2500);
    };
    wrap.addEventListener("mousemove", wake);
    wrap.addEventListener("mouseleave", function () { if (!video.paused) wrap.classList.add("idle"); });
    video.addEventListener("pause", function () { wrap.classList.remove("idle"); });
    wake();
  }
  /* 播放器快捷键（空格/M/F/←→）：只在预览区可见且有视频时接管，全局只装一次 */
  if (!_vpvKeysInstalled) {
    _vpvKeysInstalled = true;
    document.addEventListener("keydown", function (e) {
      var vw = $("viewer");
      if (!vw || vw.style.display === "none") return;
      var v = vw.querySelector("video");
      if (!v) return;
      var tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || (e.target && e.target.isContentEditable)) return;
      var k = (e.key || "").toLowerCase();
      if (e.key === " ") {
        e.preventDefault(); e.stopPropagation();
        if (v.paused) v.play().catch(function () {}); else v.pause();
      } else if (k === "m") {
        e.preventDefault(); e.stopPropagation();
        v.muted = !v.muted;
      } else if (k === "f") {
        e.preventDefault(); e.stopPropagation();
        var w = v.closest(".vpv-wrap");
        if (w) { var fb = w.querySelector(".vpv-full"); if (fb) fb.click(); }
      } else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault(); e.stopPropagation();
        v.currentTime = Math.max(0, Math.min(v.duration || 0, v.currentTime + (e.key === "ArrowRight" ? 5 : -5)));
      }
    }, true);
    document.addEventListener("click", function () {   // 点空白处收起倍速菜单
      var vw = $("viewer");
      if (vw) { var m = vw.querySelector(".vpv-speed.open"); if (m) m.classList.remove("open"); }
    });
  }
  /* 下载二次确认悬浮框：所有 .vw-dlgo 下载按钮统一走这里。
     弹窗里显示文件名 + 大小（HEAD 请求取 Content-Length），
     点「确认下载」才真正发起下载；取消 / 点遮罩 / Esc 关闭。 */
  function askDownload(tok, name) {
    var box = $("dl-confirm");
    if (!box) {   // 兜底：结构缺失时直接下载
      var a = document.createElement("a");
      a.href = "/api/collab/" + encodeURIComponent(tok) + "/raw?dl=1";
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    var src = "/api/collab/" + encodeURIComponent(tok) + "/raw";
    box.querySelector(".dc-name").textContent = name;
    box.querySelector(".dc-size").textContent = "";
    box.style.display = "flex";
    var settled = false;
    var close = function () { box.style.display = "none"; };
    box.querySelector(".dc-ok").onclick = function () {
      settled = true;
      close();
      var d = document.createElement("a");
      d.href = src + "?dl=1";
      d.download = name;
      document.body.appendChild(d); d.click(); d.remove();
    };
    box.querySelector(".dc-cancel").onclick = close;
    box.onclick = function (e) { if (e.target === box) close(); };
    fetch(src, { method: "HEAD" }).then(function (r) {
      if (settled) return;
      if (!r.ok) return;   // 404/403 等错误响应也有 Content-Length，但那是错误体大小，不能当文件大小展示
      var n = +r.headers.get("Content-Length") || 0;
      if (n) box.querySelector(".dc-size").textContent =
        "文件大小：" + (n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(2) + " MB");
    }).catch(function () {});
  }
  /* 委托拦截所有下载按钮（预览顶栏 / 下载卡片通用），只装一次 */
  document.addEventListener("click", function (e) {
    var t = e.target && e.target.closest ? e.target.closest(".vw-dlgo") : null;
    if (!t) return;
    e.preventDefault();   // 阻止 <a href="?dl=1"> 直接下载，先弹确认
    askDownload(t.getAttribute("data-tok") || "", t.getAttribute("data-nm") || "未命名");
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var box = $("dl-confirm");
    if (box && box.style.display !== "none") box.style.display = "none";
  });
  function openView(tok) {
    var r = roomByTok(tok);
    if (!r) return;
    if (S.ws) { var old = S.ws; S.ws = null; try { old.onclose = null; old.close(); } catch (e) {} }
    S.token = tok; S.closed = false; S.version = 0; S.pending = [];
    S.myId = null; S.amViewer = true; S.peerInfo = {};
    Object.keys(S.marks).forEach(clearCursor);
    $("peers").innerHTML = "";
    $("st").style.display = "";            // 仅查看也连 WS（出现在房主在线列表），状态照常显示
    setSt(false);
    $("ed").style.display = "none";
    $("edbar").style.display = "none";
    var nm = (r.path || "").split("/").filter(Boolean).pop() || "未命名";
    var rn = $("roomName"); rn.textContent = nm; rn.title = (r.path || "") + "（仅查看）";
    var src = "/api/collab/" + encodeURIComponent(tok) + "/raw";
    var ext = (nm.split(".").pop() || "").toLowerCase();
    var IMG = ["png", "jpg", "jpeg", "gif", "bmp", "webp", "svg", "ico", "avif"];
    var VID = ["mp4", "webm", "mov", "mkv"];
    var AUD = ["mp3", "wav", "ogg", "flac"];
    var body, isVid = false;
    if (IMG.indexOf(ext) >= 0) body = '<img src="' + src + '" alt="' + esc(nm) + '">';
    else if (ext === "pdf") body = '<iframe src="' + src + '"></iframe>';
    else if (VID.indexOf(ext) >= 0) {
      isVid = true;
      body = '<div class="vpv-wrap">' +
        '<video playsinline preload="metadata" src="' + src + '"></video>' +
        '<div class="vpv-controls">' +
          '<div class="vpv-timerow">' +
            '<span class="vpv-time vpv-time-cur">00:00</span>' +
            '<div class="vpv-progress"><div class="vpv-track">' +
              '<div class="vpv-buffered"></div><div class="vpv-played"></div><div class="vpv-knob"></div>' +
            '</div></div>' +
            '<span class="vpv-time vpv-time-dur">--:--</span>' +
          '</div>' +
          '<div class="vpv-row">' +
            '<button class="vpv-btn vpv-play" title="播放/暂停 (空格)"><i class="bi bi-play-fill"></i></button>' +
            '<div class="vpv-vol">' +
              '<button class="vpv-btn vpv-mute" title="静音 (M)"><i class="bi bi-volume-up-fill"></i></button>' +
              '<input type="range" class="vpv-vol-range" min="0" max="1" step="0.01" value="1" title="音量">' +
            '</div>' +
            '<div class="vpv-spacer"></div>' +
            '<div class="vpv-speed">' +
              '<button class="vpv-btn vpv-speed-btn" title="倍速播放"><span class="vpv-speed-cur">1.0x</span></button>' +
              '<div class="vpv-speed-menu">' +
                '<button class="vpv-speed-item" data-rate="0.5">0.5x</button>' +
                '<button class="vpv-speed-item" data-rate="0.75">0.75x</button>' +
                '<button class="vpv-speed-item active" data-rate="1">1.0x</button>' +
                '<button class="vpv-speed-item" data-rate="1.25">1.25x</button>' +
                '<button class="vpv-speed-item" data-rate="1.5">1.5x</button>' +
                '<button class="vpv-speed-item" data-rate="2">2.0x</button>' +
              '</div></div>' +
            '<button class="vpv-btn vpv-loop" title="循环播放"><i class="bi bi-arrow-repeat"></i></button>' +
            '<button class="vpv-btn vpv-full" title="全屏 (F)"><i class="bi bi-fullscreen"></i></button>' +
          '</div></div></div>';
    }
    else if (AUD.indexOf(ext) >= 0) body = '<audio controls src="' + src + '"></audio>';
    else body = '<div class="vw-dl"><i class="bi bi-file-earmark-zip"></i>' + esc(nm) +
      '<br>该文件不参与共同编辑，可下载后在本机打开' +
      '<br><a class="vw-dlgo" href="' + src + '?dl=1" data-tok="' + esc(tok) + '" data-nm="' + esc(nm) + '"><i class="bi bi-download"></i> 下载文件</a></div>';
    $("viewer").innerHTML =
      '<div class="vw-bar"><i class="bi bi-eye"></i> 仅查看模式：该文件不参与共同编辑' +
        '<span class="sp"></span>' +
        '<a class="vw-dlgo" href="' + src + '?dl=1" data-tok="' + esc(tok) + '" data-nm="' + esc(nm) + '"><i class="bi bi-download"></i> 下载</a></div>' +
      '<div class="vw-body' + (isVid ? " vw-full" : "") + '">' + body + '</div>';
    $("viewer").style.display = "flex";
    if (isVid) mountCollabVideo($("viewer").querySelector(".vpv-wrap"));
    renderTabs();
    connectView();
  }

  /* 仅查看房间的轻量 WS 连接：不进编辑器、不收发 op，只为挂进房间——
     房主的「在线」列表能看到观看者，观看者也能看到房主/其他人在线。 */
  function connectView() {
    if (!S.token) return;
    $("myName").value = S.myName;
    var proto = location.protocol === "https:" ? "wss" : "ws";
    var qs = "token=" + encodeURIComponent(S.token) +
             "&name=" + encodeURIComponent(S.myName) +
             "&color=" + encodeURIComponent(colorFor(S.myName));
    var ws;
    try { ws = new WebSocket(proto + "://" + location.host + "/ws/collab?" + qs); }
    catch (e) { return; }
    S.ws = ws;
    ws.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (_) { return; }
      switch (m.type) {
        case "welcome":
          S.myId = m.yourId;
          S.closed = false;
          setSt(true);
          renderPeers(m.peers || []);
          break;
        case "presence":
          renderPeers(m.peers || []);
          break;
        case "closed":
          S.closed = true;
          try { ws.close(); } catch (e2) {}
          setSt(false);
          if (S.shareType === "group") {
            // 组分享里该文件被房主停止：切到组里其它还在共享的文件
            toastBar(m.message || "该文件的协作已结束");
            removeShareItem(S.token);
            autoSwitchRoom(S.token);
          } else {
            showTip("协作已结束", esc(m.message || "房主已退出，邀请链接已失效。"));
          }
          break;
        case "error":
          S.closed = true;   // 连接时房间已不存在：不再自动重连
          setSt(false);
          if (S.shareType === "group") {
            toastBar(m.message || "该文件的协作已结束");
            removeShareItem(S.token);
            autoSwitchRoom(S.token);
          }
          break;
      }
    };
    ws.onclose = function () {
      setSt(false);
      if (S.closed) return;
      setTimeout(connectView, 2000);   // 掉线自动重连，保持出现在在线列表
    };
  }

  /* 进入某个共享文件的共同编辑（组分享模式下点击左侧文件时调用） */
  function startRoom(tok) {
    if (!tok) return;
    var target = roomByTok(tok);
    if (target && target.view) { openView(tok); return; }   // 仅查看：走预览
    if (S.token === tok) { if (!connected()) connect(); return; }
    S.token = tok;
    S.closed = false;
    // 切换文件：断开旧房间连接（抑制其自动重连），清掉上一份的标注状态
    if (S.ws) {
      var old = S.ws; S.ws = null;
      try { old.onclose = null; old.close(); } catch (e) {}
    }
    S.version = 0; S.pending = []; S.applying = false;
    S.myId = null; S.amViewer = false;
    S.peerInfo = {};
    Object.keys(S.marks).forEach(clearCursor);
    clearTags(); clearAllInk();
    setSt(false);
    $("viewer").style.display = "none";    // 离开预览：恢复编辑器区域
    $("viewer").innerHTML = "";            // 清空预览内容，顺带停掉正在播的视频
    $("ed").style.display = "block";
    $("st").style.display = "";
    $("edbar").style.display = "none";
    $("roomName").textContent = "连接中…";
    renderTabs();
    connect();
  }

  /* 编辑区上方标签页：每个共享文件一个标签，点击切换（与左侧树联动）。
     单文件分享只有一个目标，不显示标签栏。 */
  function renderTabs() {
    var bar = $("tabs");
    if (!bar) return;
    if (S.shareType !== "group" || !(S.rooms || []).length) {
      bar.style.display = "none"; bar.innerHTML = ""; return;
    }
    var items = S.rooms.slice().sort(function (a, b) {
      return String(a.path || "").localeCompare(String(b.path || ""));
    });
    bar.innerHTML = items.map(function (r) {
      var p = r.path || "";
      var nm = p.split("/").filter(Boolean).pop() || "未命名";
      var eye = r.view ? '<i class="bi bi-eye tb-eye" title="仅查看（不可编辑）"></i>' : "";
      return '<span class="tb' + (r.token === S.token ? " on" : "") +
        '" data-tok="' + esc(r.token) + '" title="' + esc(p) + (r.view ? "（仅查看）" : "") + '">' +
        iconFor(nm, false) + eye +
        '<span class="tb-nm">' + esc(nm) + '</span></span>';
    }).join("");
    bar.style.display = "block";
    Array.prototype.forEach.call(bar.querySelectorAll(".tb"), function (t) {
      t.onclick = function () { startRoom(t.getAttribute("data-tok")); };
    });
  }

  /* 批量分享模式：按被勾选的房间路径渲染左侧列表（只显示共享内容，点击即进入） */
  function renderShareTree() {
    var items = (S.rooms || []).slice().sort(function (a, b) {
      return String(a.path || "").localeCompare(String(b.path || ""));
    });
    if (!items.length) return;
    // 求所有共享路径的最长公共目录前缀，作为树的根
    var root = (items[0].path || "").replace(/\/[^/]*$/, "") || "/";
    var again = true;
    while (again) {
      again = false;
      for (var i = 0; i < items.length; i++) {
        var p = items[i].path || "";
        if (p !== root && p.indexOf(root + "/") !== 0) {
          root = root.replace(/\/[^/]*$/, "") || "/";
          again = true;
          break;
        }
      }
    }
    var rootNode = { dirs: {}, files: [] };
    items.forEach(function (it) {
      var p = it.path || "";
      if (root === "/") p = p.replace(/^\//, "");
      else if (p.indexOf(root + "/") === 0) p = p.slice(root.length + 1);
      var segs = p.split("/").filter(Boolean);
      if (!segs.length) return;
      var node = rootNode;
      for (var i = 0; i < segs.length - 1; i++) {
        if (!node.dirs[segs[i]]) node.dirs[segs[i]] = { dirs: {}, files: [] };
        node = node.dirs[segs[i]];
      }
      node.files.push({ name: segs[segs.length - 1], token: it.token, path: it.path, view: it.view });
    });

    var listEl = $("treeList");
    listEl.innerHTML = "";
    var crumb = $("crumb");
    crumb.textContent = root.split("/").filter(Boolean).pop() || root;
    crumb.title = root;

    var markActive = markActiveRow;   // 与自动切换共用同一份高亮逻辑
    (function render(node, box) {
      Object.keys(node.dirs).sort(function (a, b) { return a.localeCompare(b, "zh"); }).forEach(function (dn) {
        var row = document.createElement("div");
        row.className = "tree-row dir";
        row.innerHTML = '<span class="twist">▸</span><span class="ic">' + iconFor(dn, true) +
          '</span><span class="nm">' + esc(dn) + "</span>";
        var kids = document.createElement("div");
        kids.className = "tree-children open";
        row.onclick = function () {
          var open = kids.style.display !== "none";
          kids.style.display = open ? "none" : "block";
        };
        box.appendChild(row);
        box.appendChild(kids);
        render(node.dirs[dn], kids);
      });
      node.files.sort(function (a, b) { return a.name.localeCompare(b.name, "zh"); }).forEach(function (f) {
        var row = document.createElement("div");
        row.className = "tree-row file";
        row.setAttribute("data-token", f.token);
        row.title = f.path || "";
        row.innerHTML = '<span class="twist"></span><span class="ic">' + iconFor(f.name, false) +
          '</span><span class="nm">' + esc(f.name) +
          (f.view ? ' <i class="bi bi-eye" style="color:#8a8a8a;font-size:11px" title="仅查看（不可编辑）"></i>' : "") +
          "</span>";
        row.title = (f.path || "") + (f.view ? "（仅查看）" : "");
        row.onclick = function () { startRoom(f.token); markActive(); };
        box.appendChild(row);
      });
    })(rootNode, listEl);
    markActive();
    renderTabs();
  }

  /* 左侧列表按当前房间 token 高亮（renderShareTree 与自动切换共用） */
  function markActiveRow() {
    var listEl = $("treeList");
    if (!listEl) return;
    Array.prototype.forEach.call(listEl.querySelectorAll(".tree-row[data-token]"), function (r) {
      r.classList.toggle("active", r.getAttribute("data-token") === S.token);
    });
  }

  /* 房主停止了某个文件的协作：从批量分享列表里移除它 */
  function removeShareItem(tok) {
    S.rooms = (S.rooms || []).filter(function (r) { return r.token !== tok; });
    if (S.shareType === "group") renderShareTree();
  }

  /* 当前查看（或正要进入）的文件被停止后：组里还有其它文件就自动切过去，
     一个都不剩才给出终结提示 */
  function autoSwitchRoom(endedTok) {
    if (S.shareType !== "group") return;
    var left = (S.rooms || []).filter(function (r) { return r.token && r.token !== endedTok; });
    if (!left.length) {
      $("roomName").textContent = "协作已结束";
      showTip("协作已结束", "该批量分享中的文件都已停止共享，邀请链接已失效。");
      return;
    }
    if (S.token !== endedTok) return;    // 结束的不是当前房间：留在原地
    startRoom(left[0].token);
    markActiveRow();
  }

  /* 启动：解析分享 id（单个房间 token，或一次批量分享的组 id） */
  function boot() {
    fetch("/api/collab/share/" + encodeURIComponent(shareId))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error || !(d.items || []).length) {
          showTip("无法加入协作", esc(d.error || "分享不存在或已结束。"));
          return;
        }
        S.shareType = d.type;
        S.rooms = d.items || [];
        if (d.type === "group") {
          renderShareTree();                         // 先列出被勾选的文件/文件夹
        } else {
          $("tree").style.display = "none";          // 单文件分享：没有可切换的列表，隐藏侧边栏
        }
        startRoom(S.rooms[0].token);                 // 默认进入第一个共享文件
      })
      .catch(function (e) { showTip("无法加入协作", esc(e.message || "网络错误，请稍后重试。")); });
  }

  boot();
})();
</script>
</body>
