<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ task_name or "定时任务通知" }}</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f16;
    --bg-2: #101826;
    --card: rgba(23, 31, 45, .78);
    --card-brd: rgba(120, 160, 220, .16);
    --text: #e6edf7;
    --text-dim: #93a3b8;
    --text-mute: #6b7b90;
    --accent: #4ea1ff;
    --accent-2: #7c6cff;
    --ok: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
    --code-bg: rgba(10, 15, 24, .9);
    --mono: "SF Mono", Menlo, Consolas, "JetBrains Mono", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f5f8fd;
      --bg-2: #eaf1fb;
      --card: rgba(255, 255, 255, .86);
      --card-brd: rgba(20, 60, 120, .12);
      --text: #17202e;
      --text-dim: #5a6b82;
      --text-mute: #8494a8;
      --code-bg: #f2f5f9;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 12% -10%, rgba(78, 161, 255, .22), transparent 60%),
                radial-gradient(900px 500px at 92% 0%, rgba(124, 108, 255, .18), transparent 55%),
                linear-gradient(180deg, var(--bg), var(--bg-2));
    background-attachment: fixed;
    color: var(--text);
    font: 15px/1.78 -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 54px 20px 80px; }

  /* ---------- 顶部 ---------- */
  .hero { margin-bottom: 26px; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; letter-spacing: .04em; color: var(--accent);
    background: rgba(78, 161, 255, .12);
    border: 1px solid rgba(78, 161, 255, .3);
    border-radius: 999px; padding: 3px 12px;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 3px rgba(78, 161, 255, .18); }
  h1.title {
    margin: 14px 0 8px; font-size: 30px; line-height: 1.28; font-weight: 700;
    letter-spacing: -.01em;
    background: linear-gradient(92deg, var(--text), var(--accent) 85%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    word-break: break-word;
  }
  .sub { color: var(--text-dim); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .sub .sep { color: var(--text-mute); }

  /* ---------- 通知卡片 ---------- */
  .list { display: flex; flex-direction: column; gap: 16px; }
  .card {
    position: relative; border-radius: 16px; padding: 20px 22px 22px;
    background: var(--card); border: 1px solid var(--card-brd);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    opacity: .85;
  }
  .card.fail::before, .card.timeout::before { background: linear-gradient(180deg, var(--bad), #b91c1c); }
  .card.killed::before { background: linear-gradient(180deg, var(--text-mute), #475569); }
  .card.test::before { background: linear-gradient(180deg, var(--ok), #0ea5e9); }
  .card-head { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; cursor: pointer; user-select: none; }
  .card-title { font-size: 17px; font-weight: 650; line-height: 1.45; margin: 0; flex: 1 1 240px; word-break: break-word; }
  /* 折叠箭头：最新一条默认展开，更早的默认收起（点标题行切换） */
  .fold-ico {
    flex: none; align-self: center; font-size: 10px; line-height: 1;
    color: var(--text-mute); transition: transform .15s;
  }
  .card.folded .fold-ico { transform: rotate(-90deg); }
  .card.folded .body { display: none; }
  .card.folded { padding-bottom: 18px; }
  .st {
    flex: none; font-size: 11.5px; border-radius: 999px; padding: 1px 10px; white-space: nowrap;
    border: 1px solid currentColor;
  }
  .st.ok { color: var(--ok); background: rgba(74, 222, 128, .1); }
  .st.bad { color: var(--bad); background: rgba(248, 113, 113, .1); }
  .st.warn { color: var(--warn); background: rgba(251, 191, 36, .1); }
  .st.mute { color: var(--text-mute); background: rgba(148, 163, 184, .1); }
  .meta { margin-top: 6px; font-size: 12px; color: var(--text-mute); display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .body { margin-top: 14px; border-top: 1px dashed var(--card-brd); padding-top: 14px; }

  /* ---------- Markdown 正文 ---------- */
  .md { word-break: break-word; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
    margin: 1.35em 0 .55em; line-height: 1.35; font-weight: 650; color: var(--text);
  }
  .md h1 { font-size: 1.45em; }
  .md h2 { font-size: 1.26em; }
  .md h3 { font-size: 1.1em; }
  .md h4, .md h5, .md h6 { font-size: 1em; color: var(--text-dim); }
  .md p { margin: .75em 0; }
  .md a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(78, 161, 255, .35); }
  .md a:hover { border-bottom-color: var(--accent); }
  .md strong { color: var(--text); font-weight: 650; }
  .md em { color: var(--text-dim); }
  .md del { color: var(--text-mute); }
  .md code {
    background: var(--code-bg); border: 1px solid var(--card-brd); border-radius: 5px;
    padding: .12em .42em; font-family: var(--mono); font-size: .88em; color: #ff9ba8;
  }
  .md pre {
    background: var(--code-bg); border: 1px solid var(--card-brd); border-radius: 10px;
    padding: 13px 15px; overflow-x: auto; margin: .9em 0; line-height: 1.6;
  }
  .md pre code { background: none; border: none; padding: 0; color: var(--text); font-size: 12.5px; }
  .md blockquote {
    margin: .9em 0; padding: 2px 16px; color: var(--text-dim);
    border-left: 3px solid rgba(78, 161, 255, .45); background: rgba(78, 161, 255, .06);
    border-radius: 0 8px 8px 0;
  }
  .md ul, .md ol { margin: .7em 0; padding-left: 1.5em; }
  .md li { margin: .3em 0; }
  .md li::marker { color: var(--accent); }
  .md hr { border: none; border-top: 1px solid var(--card-brd); margin: 1.5em 0; }
  .md img { max-width: 100%; border-radius: 10px; margin: .6em 0; }
  .md table { border-collapse: collapse; margin: 1em 0; width: 100%; font-size: 13.5px; }
  .md th, .md td { border: 1px solid var(--card-brd); padding: 7px 12px; text-align: left; }
  .md th { background: rgba(78, 161, 255, .1); font-weight: 600; }
  .md tr:nth-child(even) td { background: rgba(148, 163, 184, .04); }

  /* ---------- 空态 / 底部 ---------- */
  .empty {
    text-align: center; padding: 64px 20px; border-radius: 16px;
    border: 1px dashed var(--card-brd); color: var(--text-dim);
  }
  .empty .ico { font-size: 34px; opacity: .5; margin-bottom: 10px; }
  footer {
    margin-top: 34px; padding-top: 18px; border-top: 1px solid var(--card-brd);
    color: var(--text-mute); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px;
  }
  footer .k { color: var(--text-dim); }
  @media (max-width: 640px) {
    .wrap { padding: 34px 14px 60px; }
    h1.title { font-size: 23px; }
    .card { padding: 16px 16px 18px; border-radius: 14px; }
    .md table { font-size: 12.5px; }
    .md th, .md td { padding: 6px 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="badge"><span class="dot"></span>定时任务通知</span>
    <h1 class="title" id="pageTitle">{{ task_name or "定时任务通知" }}</h1>
    <div class="sub" id="pageSub"></div>
  </div>
  <div class="list" id="list"></div>
  <footer>
    <span><span class="k">保留策略</span> 每条通知保留 {{ retention_days }} 天，到期自动失效</span>
    <span><span class="k">地址</span> 本页地址按任务唯一，可直接收藏</span>
    <span><span class="k">渲染</span> Markdown · 自动适配深色 / 浅色</span>
  </footer>
</div>
<script>
{% include "partials/markdown_render.js" %}
  const NOTES = {{ notes_json | safe }};
  const NOW = {{ server_now }};

  const STATUS = {
    success: ["成功", "ok"], fail: ["失败", "bad"], timeout: ["超时", "warn"],
    killed: ["已停止", "mute"], retry: ["重试", "warn"], test: ["测试", "ok"],
  };

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtTime(ts) {
    const d = new Date(ts * 1000);
    const sameYear = d.getFullYear() === new Date(NOW * 1000).getFullYear();
    const y = sameYear ? "" : d.getFullYear() + "-";
    return y + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmtLeft(ts) {
    const left = ts - NOW;
    if (left <= 0) return "已过期";
    const days = Math.floor(left / 86400);
    if (days >= 1) return days + " 天后过期";
    const hours = Math.floor(left / 3600);
    if (hours >= 1) return hours + " 小时后过期";
    return Math.max(1, Math.floor(left / 60)) + " 分钟后过期";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* 标题开头的图标（emoji）：网页图标直接复用它，找不到就保持浏览器默认 */
  function leadEmoji(text) {
    const s = String(text || "").trim();
    try {
      const re = new RegExp("^(?:\\p{Extended_Pictographic}|\\p{Emoji_Presentation})" +
        "(?:\\uFE0F|\\u200D(?:\\p{Extended_Pictographic}|\\p{Emoji_Presentation}))*", "u");
      const m = s.match(re);
      return m ? m[0] : "";
    } catch (e) {                                   // 老引擎不支持 \p{}：退化成「首字符是代理对」
      const c = s.charCodeAt(0);
      return (c >= 0xD800 && c <= 0xDBFF) ? s.slice(0, 2) : "";
    }
  }
  function setFavicon(emoji) {
    if (!emoji) return;
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<text x="50" y="52" font-size="82" text-anchor="middle" dominant-baseline="central">' +
      emoji + '</text></svg>';
    let link = document.querySelector('link[rel="icon"]');
    if (!link) {
      link = document.createElement("link");
      link.rel = "icon";
      document.head.appendChild(link);
    }
    link.type = "image/svg+xml";
    link.href = "data:image/svg+xml," + encodeURIComponent(svg);
  }

  /* 链接自动渲染：<a href="…">文字</a>（AI 输出 / Telegram parse_mode 写法）与裸 URL
     统一转成 Markdown 链接，再交给 renderMarkdown；已有 Markdown 链接不重复处理。 */
  function mdSource(text) {
    let s = String(text || "");
    s = s.replace(/<a\s+[^>]*href=["']?(https?:\/\/[^"'\s>]+)["']?[^>]*>([\s\S]*?)<\/a>/gi,
      (m, url, txt) => "[" + (String(txt).replace(/<[^>]*>/g, "").trim() || url) + "](" + url + ")");
    const stash = [];
    s = s.replace(/\[([^\]\n]{1,120})\]\((https?:\/\/[^\s)]+)\)/g, m => {
      stash.push(m); return "\u0002" + (stash.length - 1) + "\u0002";
    });
    s = s.replace(/(^|[^A-Za-z0-9"'=\/(])(https?:\/\/[^\s<)]+)/g, (m, pre, url) =>
      pre + "[" + url + "](" + url + ")");
    return s.replace(/\u0002(\d+)\u0002/g, (m, i) => stash[+i] || "");
  }

  (function render() {
    const list = document.getElementById("list");
    const sub = document.getElementById("pageSub");
    if (!NOTES.length) {
      list.innerHTML = '<div class="empty"><div class="ico">🗒️</div>' +
        '<div>这个地址下暂时没有通知</div>' +
        '<div style="margin-top:6px;font-size:12px;">任务执行并触发通知后，这里会自动出现内容</div></div>';
      sub.innerHTML = '<span>暂无内容</span>';
      return;
    }
    const latest = NOTES[0];
    setFavicon(leadEmoji(latest.title) || leadEmoji(latest.task_name));
    sub.innerHTML = '<span>' + NOTES.length + ' 条通知</span><span class="sep">·</span>' +
      '<span>最新 ' + esc(fmtTime(latest.created_at)) + '</span><span class="sep">·</span>' +
      '<span>' + esc(fmtLeft(latest.expires_at)) + '</span>';

    list.innerHTML = NOTES.map(function (n, i) {
      const st = STATUS[n.status] || ["通知", "mute"];
      const title = n.title || (n.task_name ? n.task_name + " 通知" : "任务通知");
      /* 最新一条展开；更早的全部默认折叠，点标题行展开 / 收起 */
      const folded = i > 0 ? " folded" : "";
      return '<article class="card ' + esc(n.status || "") + folded + '">' +
        '<div class="card-head" title="点击折叠 / 展开正文">' +
          '<span class="fold-ico" aria-hidden="true">▾</span>' +
          '<h2 class="card-title">' + esc(title) + '</h2>' +
          '<span class="st ' + st[1] + '">' + esc(st[0]) + '</span>' +
        '</div>' +
        '<div class="meta">' +
          '<span>' + esc(fmtTime(n.created_at)) + '</span>' +
          '<span>' + esc(fmtLeft(n.expires_at)) + '</span>' +
          (i === 0 ? '<span>最新</span>' : '') +
        '</div>' +
        '<div class="body md">' + renderMarkdown(mdSource(n.body || "")) + '</div>' +
      '</article>';
    }).join("");
    // 点标题行折叠 / 展开（最新一条默认展开，其余默认收起）
    list.querySelectorAll(".card-head").forEach(function (h) {
      h.addEventListener("click", function () {
        h.parentElement.classList.toggle("folded");
      });
    });
    // 正文里的链接一律新标签打开，别把通知页顶掉
    list.querySelectorAll(".md a").forEach(a => {
      a.target = "_blank";
      a.rel = "noopener noreferrer";
    });
  })();
</script>
</body>
</html>
