<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{{ code }} · {{ title }}</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
    <style>
        * { box-sizing: border-box; }

        :root {
            --cyan: #22d3ee;
            --indigo: #6366f1;
            --violet: #a855f7;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background: radial-gradient(circle at 50% 20%, #101a33 0%, #070b16 55%, #04060d 100%);
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            position: relative;
        }

        /* ---------- 背景：透视网格 ---------- */
        .bg-grid {
            position: fixed;
            left: -50%;
            right: -50%;
            top: -10%;
            bottom: -60%;
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.18) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.18) 1px, transparent 1px);
            background-size: 54px 54px;
            transform: perspective(340px) rotateX(52deg);
            transform-origin: 50% 0;
            animation: gridMove 10s linear infinite;
            -webkit-mask-image: radial-gradient(ellipse at 50% 35%, #000 25%, transparent 72%);
            mask-image: radial-gradient(ellipse at 50% 35%, #000 25%, transparent 72%);
            pointer-events: none;
        }

        @keyframes gridMove {
            to { background-position: 0 54px, 54px 0; }
        }

        /* ---------- 背景：光晕 ---------- */
        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            pointer-events: none;
        }

        .glow.g1 {
            width: 440px;
            height: 440px;
            left: -120px;
            top: -140px;
            background: rgba(99, 102, 241, 0.6);
            animation: float 9s ease-in-out infinite;
        }

        .glow.g2 {
            width: 400px;
            height: 400px;
            right: -140px;
            bottom: -160px;
            background: rgba(34, 211, 238, 0.42);
            animation: float 12s ease-in-out infinite reverse;
        }

        @keyframes float {
            50% { transform: translate3d(30px, 24px, 0) scale(1.08); }
        }

        /* ---------- 背景：扫描线 ---------- */
        body::after {
            content: "";
            position: fixed;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(180deg, transparent, rgba(34, 211, 238, 0.07), transparent);
            animation: scan 7s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            from { top: -200px; }
            to { top: 100%; }
        }

        /* ---------- 内容 ---------- */
        .wrap {
            position: relative;
            z-index: 2;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 22px 48px;
        }

        .code {
            font-size: clamp(86px, 20vw, 176px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: 8px;
            background: linear-gradient(115deg, var(--cyan) 0%, var(--indigo) 48%, var(--violet) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 26px rgba(99, 102, 241, 0.55));
            animation: codePulse 3.6s ease-in-out infinite;
            user-select: none;
        }

        @keyframes codePulse {
            50% { filter: drop-shadow(0 0 48px rgba(34, 211, 238, 0.75)); }
        }

        .title {
            margin: 10px 0 0;
            font-size: clamp(1.1rem, 3.2vw, 1.5rem);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .desc {
            margin: 12px 0 0;
            max-width: 460px;
            font-size: 0.88rem;
            line-height: 1.75;
            color: #94a3b8;
        }

        .path {
            margin: 18px 0 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            max-width: 92vw;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid rgba(99, 102, 241, 0.35);
            background: rgba(99, 102, 241, 0.1);
            font-size: 0.76rem;
            color: #a5b4fc;
        }

        .path code {
            font-family: "SF Mono", Menlo, Consolas, monospace;
            color: #e2e8f0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 58vw;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 11px 24px;
            border-radius: 12px;
            border: 1px solid transparent;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s, background .2s, color .2s;
        }

        .btn.primary {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: #fff;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.35);
        }

        .btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 42px rgba(59, 130, 246, 0.52);
        }

        .btn.ghost {
            background: rgba(148, 163, 184, 0.1);
            border-color: rgba(148, 163, 184, 0.28);
            color: #cbd5e1;
        }

        .btn.ghost:hover {
            background: rgba(148, 163, 184, 0.2);
            color: #fff;
        }

        .foot {
            margin-top: 38px;
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            color: #475569;
        }

        @media (max-width: 560px) {
            .code { letter-spacing: 3px; }
            .actions { flex-direction: column; width: 100%; max-width: 320px; }
            .btn { width: 100%; justify-content: center; }
            .path code { max-width: 44vw; }
        }
    </style>
</head>

<body>
    <div class="bg-grid"></div>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <main class="wrap">
        <div class="code">{{ code }}</div>
        <h1 class="title">{{ title }}</h1>
        <p class="desc">{{ message }}</p>
        {% if path %}<div class="path"><span>请求路径</span><code>{{ path }}</code></div>{% endif %}

        <div class="actions">
            <a class="btn primary" href="/">返回首页</a>
            <button class="btn ghost" type="button"
                onclick="history.length > 1 ? history.back() : (location.href = '/')">返回上一页</button>
        </div>

        <div class="foot">FILE FLASK · 文件管理可视化</div>
    </main>
</body>

</html>
