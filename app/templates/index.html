        function toggleSelectMode() {
            selectMode = !selectMode;
            localStorage.setItem('fileManager_selectMode', selectMode.toString());
            document.body.classList.toggle('select-mode', selectMode);
            document.getElementById('selectModeBtn').classList.toggle('active', selectMode);
            const selBar = document.getElementById('selBar');
            if (selBar) selBar.classList.toggle('show', selectMode);
            // 选择模式关闭时清空已选
            if (!selectMode) {
                selectedPaths.clear();
                document.querySelectorAll('.item-checkbox, .icon-check, .tree-checkbox').forEach(el => {

                });
                document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
                document.getElementById('selectAll').checked = false;
                document.getElementById('selectAll').indeterminate = false;
                updateSelectedCount();
                updateBatchDeleteBtn();
            }
        }

        // 全选/取消全选（兼容列表/图标/树型视图）
        function _setAllSelected(checked) {
            document.querySelectorAll('.item-checkbox:not(.parent-cb), .tree-checkbox:not(.parent-cb)').forEach(el => {
                el.checked = checked;
                const path = el.dataset.path;
                if (path == null) return;
                if (checked) selectedPaths.add(path); else selectedPaths.delete(path);
                const row = el.closest('tr') || el.closest('.icon-item') || el.closest('.tree-line');
                if (row) row.classList.toggle('selected', checked);
            });
            const sa = document.getElementById('selectAll');
            if (sa) { sa.checked = checked; sa.indeterminate = false; }
            updateSelectedCount();
            updateBatchDeleteBtn();
        }

        // ========== 待执行的移动/复制（参考移动版流程） ==========
        function setPendingOp(mode, paths) {
            if (!paths || !paths.length) return;
            pendingOp = { mode, paths };
            document.getElementById('pasteFabText').textContent =
                (mode === 'move' ? '移动' : '复制') + ' ' + paths.length + ' 项到当前目录';
            document.getElementById('pasteFab').classList.add('show');
            showToast('提示', (mode === 'move' ? '移动' : '复制') + '已记录 ' + paths.length +
                ' 项，打开目标文件夹后点击右下角按钮完成（右键按钮可取消）', 'info');
        }

        async function executePendingOp() {
            if (!pendingOp) return;
            const isMove = pendingOp.mode === 'move';
            const paths = pendingOp.paths.slice();
            const dest = currentPath || '/';
            _clearPendingOp();
            const name = paths.length === 1 ? (paths[0].split('/').pop() || '') : (paths.length + ' 项');
            _bgStart(isMove ? 'mv' : 'cp', isMove ? '/api/move/start' : '/api/copy/start',
                { paths: paths, dest_dir: dest }, {
                title: (isMove ? '正在移动：' : '正在复制：') + name,
                legacy: () => _legacyMoveCopy(isMove, paths, dest),
                onDone: (ok, d) => {
                    const result = (d && d.result) || {};
                    const doneN = result.done != null ? result.done : paths.length;
                    if (ok) showToast('成功', (isMove ? '移动' : '复制') + '完成 ' + doneN + ' 项', 'success');
                    // 移动：源条目从当前目录消失；复制：目标出现在当前目录
                    if (isMove) localRemoveItems(paths);
                    else for (const p of paths) {
                        const base = p.split('/').pop();
                        localAddItem({ name: base, path: base, is_dir: false, size: 0, size_str: '', ext: '', type: '', mtime: _nowStr() });
                    }
                    loadFiles(currentPath);
                }
            });
        }

        // 后端未升级兜底：退回旧的逐文件同步接口
        async function _legacyMoveCopy(isMove, paths, dest) {
            let ok = 0, fail = 0, firstErr = '';
            for (const p of paths) {
                try {
                    const resp = await fetch(isMove ? '/api/move' : '/api/copy', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path: p, dest_dir: dest })
                    });
                    const d = await resp.json();
                    if (d.success || !d.error) ok++;
                    else { fail++; if (!firstErr) firstErr = d.error; }
                } catch (err) { fail++; if (!firstErr) firstErr = err.message; }
            }
            if (fail === 0) showToast('成功', (isMove ? '移动' : '复制') + '完成 ' + ok + ' 项', 'success');
            else showToast(ok ? '警告' : '错误',
                (isMove ? '移动' : '复制') + '完成 ' + ok + ' 项，失败 ' + fail + ' 项' + (firstErr ? '：' + firstErr : ''),
                ok ? 'warning' : 'danger');
            loadFiles(currentPath);
        }

        function _clearPendingOp() {
            pendingOp = null;
            document.getElementById('pasteFab').classList.remove('show');
        }

        // 切换某个复选框的勾选状态（复用 change 事件逻辑）
        function _toggleItemCheckbox(cb) {
            if (!cb) return;
            cb.checked = !cb.checked;
            cb.dispatchEvent(new Event('change', { bubbles: true }));
        }

        // 双击文件时，确保处于多选模式并勾选该文件
        function _selectItemByPath(absPath) {
            if (!selectMode) toggleSelectMode();
            const esc = (s) => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            const sel = '.item-checkbox[data-path=\'' + esc(absPath) + '\'], .tree-checkbox[data-path=\'' + esc(absPath) + '\']';
            const cb = document.querySelector(sel);
            if (cb && !cb.checked) {
                cb.checked = true;
                cb.dispatchEvent(new Event('change', { bubbles: true }));
            }
        }

        // ========== 列表视图 ==========
        function renderTable(items) {
            const tbody = document.getElementById('fileBody');
            if (!items || items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${selectMode ? 6 : 5}"><div class="empty-state"><i class="bi bi-inbox"></i><p class="mb-0">此目录为空</p></div></td></tr>`;
                return;
            }
            const html = _buildTableHtml(items);
            if (items.length < 200) {
                tbody.innerHTML = html;
                _bindTableEvents(tbody);
                return;
            }
            // 大列表：用临时 <table><tbody> 解析 HTML，首屏 200 行立即渲染，剩余分片追加
            // 不能用 <div>.innerHTML 解析 <tr>（浏览器会套一层 <table>，childNodes 拿不到行）
            const tmpTable = document.createElement('table');
            tmpTable.innerHTML = `<tbody>${html}</tbody>`;
            const tmpTbody = tmpTable.querySelector('tbody');
            const nodes = Array.from(tmpTbody ? tmpTbody.childNodes : []);
            tbody.innerHTML = '';
            const first = 200;
            for (let i = 0; i < first && i < nodes.length; i++) tbody.appendChild(nodes[i]);
            const rest = nodes.slice(first);
            if (rest.length === 0) { _bindTableEvents(tbody); return; }
            const chunk = 200;
            let j = 0;
            function step() {
                const end = Math.min(j + chunk, rest.length);
                for (; j < end; j++) tbody.appendChild(rest[j]);
                if (j < rest.length) setTimeout(step, 0);
                else _bindTableEvents(tbody);
            }
            setTimeout(step, 0);
        }

        let _currentFetchController = null;
        let _isNavigating = false;

        function _abortPendingFetch() {
            if (_currentFetchController) {
                try { _currentFetchController.abort(); } catch (e) { /* ignore */ }
                _currentFetchController = null;
            }
        }

        function _setLoading(loading, path) {
            _isNavigating = loading;
            // 全局加载遮罩：列表/图标/树型视图统一切换文件夹时的等待锁，
            // 加载中拦截点击，避免并发切换目录导致请求被中断(ERR_ABORTED)
            const overlay = document.getElementById('fmLoadingOverlay');
            if (overlay) {
                overlay.style.display = loading ? 'flex' : 'none';
                const txt = document.getElementById('fmLoadingText');
                if (txt) {
                    txt.textContent = loading
                        ? `正在加载目录…${path ? ' 「' + path.substring(0, 80) + (path.length > 80 ? '…' : '') + '」' : ''}`
                        : '正在加载目录…';
                }
            }
            const tbl = document.getElementById('fileBody');
            if (tbl) {
                tbl.classList.toggle('is-loading', loading);
                const existing = tbl.querySelector('.fm-loading-bar');
                if (loading && !existing) {
                    const rows = selectMode ? 6 : 5;
                    tbl.insertAdjacentHTML('afterbegin',
                        `<tr class="fm-loading-bar" data-fm-loading="true"><td colspan="${rows}">
                        <div style="display:flex;align-items:center;gap:8px;padding:10px 8px;color:#475569;font-size:0.85rem;">
                            <div class="spinner-border spinner-border-sm text-primary" role="status" style="width:1rem;height:1rem;"></div>
                            <span>正在加载目录…${path ? (' 「' + path.substring(0, 80) + (path.length > 80 ? '…' : '') + '」') : ''}</span>
                        </div>
                    </td></tr>`);
                } else if (!loading && existing) {
                    existing.remove();
                }
            }
        }

        // ========== 数据加载 ==========
        async function loadFiles(path) {
            _closeMenus();
            _abortPendingFetch();
            const ctrl = new AbortController();
            _currentFetchController = ctrl;
            _setLoading(true, path);
            try {
                const url = path
                    ? `/api/files?path=${encodeURIComponent(path)}&limit=0&offset=0`
                    : '/api/files?limit=0&offset=0';
                const resp = await fetch(url, { signal: ctrl.signal });
                if (!resp.ok && resp.status !== 400) {
                    throw new Error(`请求失败 (HTTP ${resp.status})`);
                }
                const data = await resp.json();
                _currentFetchController = null;
                _setLoading(false, '');
                if (data.error) {
                    showToast('错误', data.error, 'danger');
                    // 显示错误行到表格
                    const tbody = document.getElementById('fileBody');
                    if (tbody) {
                        tbody.innerHTML = `<tr><td colspan="${selectMode ? 6 : 5}" style="padding:20px;text-align:center;color:#dc2626;">${_escHtml(data.error)}</td></tr>`;
                    }
                    return;
                }
                if (data.items == null) {
                    showToast('错误', '服务器返回数据异常', 'danger');
                    return;
                }
                currentPath = data.current_path_abs || '';
                sessionStorage.removeItem('_fmAutoReloaded');   // 服务正常，重置自动刷新标记
                fileItems = data.items || [];
                selectedPaths.clear();
                // 保存当前类型筛选值，更新下拉框后恢复
                const prevTypeVal = document.getElementById('typeFilter') ? document.getElementById('typeFilter').value : '';
                _updateTypeFilter(fileItems);
                if (prevTypeVal && document.getElementById('typeFilter')) {
                    const opt = document.getElementById('typeFilter').querySelector(`option[value="${prevTypeVal}"]`);
                    if (opt) document.getElementById('typeFilter').value = prevTypeVal;
                }
                document.getElementById('totalFiles').textContent = data.stats.total_files;
                document.getElementById('totalDirs').textContent = data.stats.total_dirs;
                document.getElementById('totalSize').textContent = data.stats.total_size_str;
                document.getElementById('fileCountBadge').textContent = `${data.total_items != null ? data.total_items : data.items.length} 项`;
                document.getElementById('pathInput').value = currentPath;
                updateBreadcrumb(currentPath);
                // 上级目录按钮
                const parentBtn = document.getElementById('parentDirBtn');
                if (parentBtn) {
                    const pData = data.parent_path || '';
                    parentPath = pData;
                    if (pData) {
                        parentBtn.disabled = false;
                        parentBtn.dataset.target = pData;
                        parentBtn.title = '返回上级目录: ' + pData;
                    } else {
                        parentBtn.disabled = true;
                        parentBtn.title = '已是根目录';
                    }
                }
                localStorage.setItem(STORAGE_KEY, currentPath);
                applyFiltersAndSort();
                document.getElementById('selectAll').checked = false;
                document.getElementById('selectAll').indeterminate = false;
            } catch (e) {
                _currentFetchController = null;
                _setLoading(false, '');
                if (e && e.name === 'AbortError') {
                    // 已切换路径，忽略旧的加载结果
                    return;
                }
                const msg = (e && e.message) || String(e);
                // 网络级失败（服务重启/断开）：调试模式下自动刷新一次恢复页面
                if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) {
                    if (!sessionStorage.getItem('_fmAutoReloaded')) {
                        sessionStorage.setItem('_fmAutoReloaded', '1');
                        showToast('提示', '服务已重启，页面即将自动刷新…', 'warning');
                        setTimeout(() => location.reload(), 1500);
                        return;
                    }
                }
                showToast('错误', '加载文件列表失败: ' + msg, 'danger');
            }
        }

        function updateBreadcrumb(absPath) {
            const breadcrumb = document.getElementById('breadcrumb');
            const sysRoot = systemInfo.root || (navigator.platform.toLowerCase().includes('win') ? 'C:\\\\' : '/');
            let parts = (absPath || '').split(/[\\/]/).filter(p => p);
            // 根目录项使用真实系统根路径
            let html = `<li class="breadcrumb-item"><a href="#" data-path="${_escAttr(sysRoot)}" title="${_escAttr(sysRoot)}"><i class="bi bi-hdd"></i></a></li>`;
            if (parts.length > 0) {
                let cumulative = '';
                if (navigator.platform.toLowerCase().includes('win')) {
                    cumulative = parts[0] + '\\\\';
                    html += `<li class="breadcrumb-item"><a href="#" data-path="${_escAttr(cumulative)}">${_escHtml(parts[0])}</a></li>`;
                    parts = parts.slice(1);
                } else {
                    cumulative = '/';
                }
                for (let i = 0; i < parts.length; i++) {
                    cumulative += (i === 0 && cumulative === '/') ? '' : '/';
                    cumulative += parts[i];
                    const isLast = i === parts.length - 1;
                    if (isLast) html += `<li class="breadcrumb-item active">${_escHtml(parts[i])}</li>`;
                    else html += `<li class="breadcrumb-item"><a href="#" data-path="${_escAttr(cumulative)}">${_escHtml(parts[i])}</a></li>`;
                }
            }
            breadcrumb.innerHTML = html;
            breadcrumb.querySelectorAll('a[data-path]').forEach(el => {
                el.addEventListener('click', (e) => { e.preventDefault(); navigateTo(el.dataset.path); });
            });
        }

        function navigateTo(path) {
            if (path === 'loading' || path === 'undefined' || path === 'null' || path == null) return;
            // 已经在同一路径加载中：忽略重复点击，保留进行中的请求
            // （不能取消后又不重发，否则请求“已取消”且界面卡在旧目录）
            if (path === currentPath && _isNavigating) return;
            _abortPendingFetch();
            loadFiles(path || '');
        }

        // ========== 图标/树型视图排序工具栏 ==========
        const SORT_FIELDS = [
            { key: 'name', label: '名称' },
            { key: 'size', label: '大小' },
            { key: 'type', label: '类型' },
            { key: 'mtime', label: '修改时间' }
        ];

        function renderSortBar() {
            // 图标视图与树型视图各自显示对应的排序栏，列表视图隐藏
            ['iconSortBar', 'treeSortBar'].forEach(id => {
                const bar = document.getElementById(id);
                if (!bar) return;
                bar.style.display = (viewMode === 'list') ? 'none' : 'flex';
            });
            if (viewMode !== 'icon' && viewMode !== 'tree') return;
            const bar = document.getElementById(viewMode === 'tree' ? 'treeSortBar' : 'iconSortBar');
            if (!bar) return;
            let html = '<span class="sortbar-label"><i class="bi bi-sort-down"></i> 排序</span>';
            html += '<span class="sortbar-arrow">目录优先 ·</span>';
            SORT_FIELDS.forEach(f => {
                const on = sortField === f.key;
                html += `<button type="button" class="sortbar-btn${on ? ' active' : ''}" data-sort-field="${f.key}">${f.label}<span class="sortbar-dir">${on ? (sortAsc ? '↑' : '↓') : '⇅'}</span></button>`;
            });
            html += `<span class="sortbar-count">共 ${fileItems.length} 项</span>`;
            bar.innerHTML = html;
            bar.querySelectorAll('.sortbar-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const field = btn.dataset.sortField;
                    if (field === sortField) sortAsc = !sortAsc;
                    else { sortField = field; sortAsc = true; }
                    applyFiltersAndSort();
                });
            });
        }

        // ========== 排序与筛选 ==========
        // 通用排序：目录始终在前，其余按 sortField/sortAsc 排序
        function _sortItems(list) {
            const items = [...(list || [])];
            items.sort((a, b) => {
                // 第一层分组：目录始终在前
                if (a.is_dir !== b.is_dir) return a.is_dir ? -1 : 1;
                let valA, valB;
                switch (sortField) {
                    case 'name': valA = a.name.toLowerCase(); valB = b.name.toLowerCase(); break;
                    case 'size': valA = Number(a.size || 0); valB = Number(b.size || 0); break;
                    case 'type': valA = (a.type || 'zzz').toLowerCase(); valB = (b.type || 'zzz').toLowerCase(); break;
                    case 'mtime': valA = a.mtime || ''; valB = b.mtime || ''; break;
                    default: valA = a.name.toLowerCase(); valB = b.name.toLowerCase();
                }
                if (valA < valB) return sortAsc ? -1 : 1;
                if (valA > valB) return sortAsc ? 1 : -1;
                // 同值按名称次排序保证稳定
                if (sortField !== 'name') {
                    if (a.name.toLowerCase() < b.name.toLowerCase()) return sortAsc ? -1 : 1;
                    if (a.name.toLowerCase() > b.name.toLowerCase()) return sortAsc ? 1 : -1;
                }
                return 0;
            });
            return items;
        }

        function applyFiltersAndSort() {
            let items = [...fileItems];
            const filterText = document.getElementById('filterInput').value.toLowerCase().trim();
            const typeFilter = document.getElementById('typeFilter').value;
            if (filterText) items = items.filter(item => item.name.toLowerCase().includes(filterText));
            if (typeFilter === '目录') items = items.filter(item => item.is_dir);
            else if (typeFilter) items = items.filter(item => !item.is_dir && (item.type || '').toLowerCase() === typeFilter.toLowerCase());
            items = _sortItems(items);
            document.querySelectorAll('.sort-indicator').forEach(el => el.classList.remove('active'));
            const indicator = document.getElementById(`sort-${sortField}`);
            if (indicator) { indicator.textContent = sortAsc ? '↑' : '↓'; indicator.classList.add('active'); }
            renderSortBar();
            if (viewMode === 'icon') { renderIconView(items); }
            else if (viewMode === 'tree') { renderTreeView(items); }
            else { renderTable(items); }
        }

        // ========== 本地增删条目（不重新请求服务器，避免大目录超时） ==========
        function _nowStr() {
            const d = new Date();
            const p = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }

        function _recomputeStats() {
            let f = 0, dirs = 0, size = 0;
            for (const it of fileItems) {
                if (it.is_dir) dirs++; else f++;
                size += Number(it.size || 0);
            }
            const tf = document.getElementById('totalFiles');
            const td = document.getElementById('totalDirs');
            const ts = document.getElementById('totalSize');
            const badge = document.getElementById('fileCountBadge');
            if (tf) tf.textContent = f;
            if (td) td.textContent = dirs;
            if (ts) ts.textContent = formatSize(size);
            if (badge) badge.textContent = `${fileItems.length} 项`;
        }

        function localAddItem(item) {
            const idx = fileItems.findIndex(it => it.path === item.path);
            if (idx >= 0) fileItems[idx] = Object.assign(fileItems[idx], item);
            else fileItems.push(item);
            applyFiltersAndSort();
            _recomputeStats();
            updateBatchDeleteBtn();
        }

        function localRemoveItems(paths) {
            const names = new Set(paths.map(p => p.split('/').pop()).filter(Boolean));
            if (names.size === 0) return;
            fileItems = fileItems.filter(it => !names.has(it.path));
            // 同步清理选中集合
            for (const p of paths) selectedPaths.delete(p);
            applyFiltersAndSort();
            _recomputeStats();
            updateSelectedCount();
            updateBatchDeleteBtn();
        }

        // ========== 动态类型筛选 ==========
        function _updateTypeFilter(items) {
            const select = document.getElementById('typeFilter');
            if (!select) return;
            // 收集当前目录下的文件扩展名及数量（排除目录）
            const extCounts = {};
            for (const item of items) {
                if (item.is_dir) continue;
                const ext = (item.type || '').toLowerCase();
                if (!ext || ext === '未知') continue;
                extCounts[ext] = (extCounts[ext] || 0) + 1;
            }
            // 按字母排序
            const exts = Object.keys(extCounts).sort();
            // 构建下拉选项
            let html = '<option value="">所有类型</option>';
            // 目录选项
            const dirCount = items.filter(i => i.is_dir).length;
            if (dirCount > 0) {
                html += `<option value="目录">📁 目录 (${dirCount})</option>`;
            }
            // 文件扩展名选项
            for (const ext of exts) {
                const label = ext;
                const count = extCounts[ext];
                html += `<option value="${ext}">.${label} (${count})</option>`;
            }
            select.innerHTML = html;
            // 在 loadFiles 中恢复之前选中的值
        }

        // ========== 删除 ==========
        async function deleteFiles(paths) {
            if (!paths || paths.length === 0) return;
            const count = paths.length;
            let dirItems = [];
            let fileItems_ = [];
            for (const p of paths) {
                const item = fileItems.find(f => (f.abs_path || '') === p);
                if (item && item.is_dir) {
                    dirItems.push(item);
                } else {
                    fileItems_.push(p);
                }
            }
            let confirmMsg = '';
            if (dirItems.length > 0) {
                let msg = '[Warning] 以下项目包含文件夹，删除后所有子文件将移入回收站（5秒内可撤销）:\n\n';
                for (const d of dirItems) {
                    msg += '[Folder] ' + d.name + (d.size > 0 ? ' (' + formatSize(d.size) + ')' : '') + '\n';
                }
                if (fileItems_.length > 0) msg += '\n[File] 另 ' + fileItems_.length + ' 个文件\n';
                msg += '\n可点击「撤销」恢复，或等待 5 秒后过期。继续？';
                confirmMsg = msg;
            } else {
                confirmMsg = count === 1
                    ? '确定要删除 "' + paths[0] + '" 吗？已移入回收站，5秒内可撤销。'
                    : '确定要删除选中的 ' + count + ' 个文件吗？已移入回收站，5秒内可撤销。';
            }
            const confirmed = await showConfirm(confirmMsg);
            if (!confirmed) return;
            try {
                // 启动异步删除任务（同移动版），带进度条 + 后台胶囊
                const progName = count === 1 ? (paths[0].split('/').pop() || '') : (count + ' 项');
                _bgStart('del', '/api/delete/start', { paths }, {
                    title: '正在删除：' + progName,
                    onDone: (ok, d) => {
                        const result = (d && d.result) || {};
                        const deletedCount = (result.deleted || []).length;
                        if (deletedCount > 0) {
                            // 本地从列表移除已删条目，不重新请求 /api/files（大目录会超时）
                            localRemoveItems(paths);
                            if (ok) showToast('成功', '已删除 ' + deletedCount + ' 个（移入回收站）', 'success');
                            // 显示撤销 Toast（带倒计时）
                            if (ok && (result.trash_items || []).length > 0) showUndoToast(result.trash_items);
                        }
                        selectedPaths.clear();
                    }
                });
            } catch (e) {
                showToast('错误', '删除失败: ' + e.message, 'danger');
            }
        }

        // ========== 5秒回退 Toast ==========
        let _undoTimeouts = [];

        function showUndoToast(trashItems) {
            const container = document.getElementById('undoToastContainer');
            const count = trashItems.length;
            let displayName = '';
            if (count === 1) {
                displayName = trashItems[0].name;
            } else if (count <= 3) {
                displayName = trashItems.map(t => t.name).join('、');
            } else {
                displayName = trashItems[0].name + ' 等 ' + count + ' 项';
            }

            const toast = document.createElement('div');
            toast.className = 'undo-toast';
            toast.innerHTML = `
            <span class="undo-icon">🗑️</span>
            <div class="undo-content">
                <div class="undo-title"><span class="undo-countdown" id="udc_${trashItems[0].id}">5s</span></div>
                <div class="undo-msg">已删除 ${count} 项: ${displayName}</div>
            </div>
            <button class="undo-btn" id="undobtn_${trashItems[0].id}">
                <i class="bi bi-arrow-counterclockwise"></i> 撤销
            </button>
            <div class="undo-progress" style="width:100%"></div>
        `;
            container.appendChild(toast);

            const trashIds = trashItems.map(t => t.id);
            let remaining = 5;
            const countdownEl = toast.querySelector('.undo-countdown');
            const progressEl = toast.querySelector('.undo-progress');
            const undoBtn = toast.querySelector('.undo-btn');

            const undoAction = async () => {
                let allSuccess = true;
                for (const tid of trashIds) {
                    try {
                        const r = await fetch('/api/undo-delete', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ trash_id: tid })
                        });
                        const data = await r.json();
                        if (!data.success) { allSuccess = false; }
                    } catch (e) { allSuccess = false; }
                }
                if (allSuccess) {
                    showToast('恢复成功', '已恢复 ' + count + ' 项到原位置', 'success');
                    loadFiles(currentPath);
                    loadDeleteHistoryCount();
                } else {
                    showToast('恢复失败', '部分项目恢复失败', 'warning');
                }
                toast.remove();
                clearInterval(intervalId);
            };

            undoBtn.addEventListener('click', () => {
                undoAction();
            });

            const intervalId = setInterval(() => {
                remaining -= 0.1;
                if (remaining <= 0) {
                    clearInterval(intervalId);
                    toast.remove();
                    return;
                }
                const pct = (remaining / 5) * 100;
                progressEl.style.width = pct + '%';
                const sec = Math.ceil(remaining);
                countdownEl.textContent = sec + 's';
                countdownEl.style.background = sec <= 2 ? '#dc2626' : '#fee2e2';
                countdownEl.style.color = sec <= 2 ? 'white' : '#dc2626';
            }, 100);

            // 限制最多显示 3 个 toast
            while (container.children.length > 3) {
                container.firstChild.remove();
            }
        }

        // ========== 文件编辑器 ==========
        let _editorInstance = null;
        let _simpleMDE = null;
        let _editorFilePath = '';
        let _editorIsMarkdown = false;
        let _editorPreviewTimer = null;

        // ===== 编辑器外观（主题/字号），默认浅色与主页一致，选择持久化 =====
        const _ED_THEMES = [
            { key: 'default', label: '默认（浅色 · 同主页）' },
            { key: 'eclipse', label: 'Eclipse（浅色）' },
            { key: 'idea', label: 'IDEA（浅色）' },
            { key: 'material-darker', label: 'Material 深色' },
            { key: 'dracula', label: 'Dracula' },
            { key: 'monokai', label: 'Monokai' },
        ];
        function _editorTheme() { return localStorage.getItem('edTheme') || 'default'; }
        function _editorFontSize() { return parseInt(localStorage.getItem('edFontSize') || '14', 10) || 14; }
        function _applyEditorAppearance() {
            if (!_editorInstance) return;
            try {
                _editorInstance.setOption('theme', _editorTheme());
                _editorInstance.getWrapperElement().style.fontSize = _editorFontSize() + 'px';
                _editorInstance.refresh();
            } catch (e) { }
        }

        // ===== 编辑器状态：N 字符 · 大小 · 未修改/已修改 =====
        let _edModified = false;
        let _edDirtyTimer = null;
        function _editorText() {
            try { return _simpleMDE ? _simpleMDE.value() : (_editorInstance ? _editorInstance.getValue() : ''); }
            catch (e) { return ''; }
        }
        function _fmtEditorSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }
        function _setEdStatus(mode) {
            const el = document.getElementById('edStatus');
            const dot = document.getElementById('edStatusDot');
            if (!el) return;
            const text = _editorText();
            const meta = text.length + ' 字符 · ' + _fmtEditorSize(new Blob([text]).size);
            const map = {
                unmodified: ['未修改', '🟢'],
                modified: ['已修改', '🔴'],
                saving: ['保存中...', '🟡'],
                saved: ['已保存 ✓', '🟢'],
                error: ['保存失败', '🔴'],
            };
            const [label, icon] = map[mode] || map.unmodified;
            el.textContent = meta + ' · ' + label;
            if (dot) dot.textContent = icon;
            // 保存按钮：仅已修改/保存失败时可点击
            const saveBtn = document.querySelector('.ed-save-btn');
            if (saveBtn && mode !== 'saving') saveBtn.disabled = !(mode === 'modified' || mode === 'error');
            // 内容变化时自动关闭对比视图（避免显示过期差异）
            if (mode === 'modified') {
                const dp = document.getElementById('edDiffPanel');
                if (dp && dp.style.display !== 'none') dp.style.display = 'none';
            }
        }
        function _edMarkDirty() {
            if (_edDirtyTimer) clearTimeout(_edDirtyTimer);
            _edDirtyTimer = setTimeout(() => {
                // 以「当前内容 vs 已保存基准」的实际对比结果为准：
                // 改动后又改回原样（如撤销、删掉刚输入的字符）→ 视为未修改
                const changed = _editorText() !== _editorOriginal;
                _edModified = changed;
                _setEdStatus(changed ? 'modified' : 'unmodified');
                _updateDiffBadge();   // 实时刷新对比按钮上的 +N/-N 数量
            }, 200);
        }

        // ===== 对比视图：当前内容 vs 已保存内容，逐行显示增删 =====
        let _editorOriginal = '';   // 最近一次加载/保存的内容基准
        function _computeLineDiff(aText, bText) {
            const A = aText.split('\n'), B = bText.split('\n');
            const n = A.length, m = B.length;
            if ((n + 1) * (m + 1) > 6000000) return null;   // 过大时放弃精细对比
            const W = m + 1;
            const dp = new Int32Array((n + 1) * W);
            for (let i = n - 1; i >= 0; i--) {
                for (let j = m - 1; j >= 0; j--) {
                    dp[i * W + j] = A[i] === B[j]
                        ? dp[(i + 1) * W + j + 1] + 1
                        : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
                }
            }
            const ops = [];
            let i = 0, j = 0;
            while (i < n && j < m) {
                if (A[i] === B[j]) { ops.push({ t: '=', s: A[i] }); i++; j++; }
                else if (dp[(i + 1) * W + j] >= dp[i * W + j + 1]) { ops.push({ t: '-', s: A[i] }); i++; }
                else { ops.push({ t: '+', s: B[j] }); j++; }
            }
            while (i < n) ops.push({ t: '-', s: A[i++] });
            while (j < m) ops.push({ t: '+', s: B[j++] });
            return ops;
        }
        function _updateDiffBadge() {
            const badge = document.getElementById('edDiffBadge');
            if (!badge) return;
            const ops = _computeLineDiff(_editorOriginal, _editorText());
            if (!ops) { badge.style.display = 'none'; return; }
            let addN = 0, delN = 0;
            ops.forEach(o => { if (o.t === '+') addN++; else if (o.t === '-') delN++; });
            if (addN === 0 && delN === 0) { badge.style.display = 'none'; return; }
            badge.innerHTML = '<span style="color:#86efac;">+' + addN + '</span> <span style="color:#fca5a5;">-' + delN + '</span>';
            badge.style.display = 'inline-block';
        }
        function _toggleDiffView() {
            const panel = document.getElementById('edDiffPanel');
            if (!panel) return;
            if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }
            _renderDiffView(panel);
        }
        function _renderDiffView(panel) {
            const body = panel.querySelector('.ed-diff-body');
            const summary = document.getElementById('edDiffSummary');
            const cur = _editorText();
            const ops = _computeLineDiff(_editorOriginal, cur);
            if (!ops) {
                summary.innerHTML = '文件过大，无法精细对比';
                body.innerHTML = '<div class="ed-diff-gap" style="padding:14px;">文件过大（超过对比行数上限），请直接编辑或保存后查看。</div>';
                panel.style.display = 'flex';
                return;
            }
            let addN = 0, delN = 0;
            ops.forEach(o => { if (o.t === '+') addN++; else if (o.t === '-') delN++; });
            if (addN === 0 && delN === 0) {
                summary.innerHTML = '与已保存内容 <b>完全一致，无修改</b>';
                body.innerHTML = '<div class="ed-diff-gap" style="padding:14px;">✓ 当前内容与上次保存/加载时一致，没有新增或删除的行。</div>';
                panel.style.display = 'flex';
                return;
            }
            summary.innerHTML = '与已保存内容相比：<span class="ed-diff-add">+ ' + addN + ' 行新增</span>　<span class="ed-diff-del">- ' + delN + ' 行删除</span>';
            // 折叠连续相同的行：只保留变更前后各 3 行上下文
            const changed = ops.map(o => o.t !== '=');
            const keep = new Array(ops.length).fill(false);
            ops.forEach((o, k) => {
                if (!changed[k]) return;
                for (let x = Math.max(0, k - 3); x <= Math.min(ops.length - 1, k + 3); x++) keep[x] = true;
            });
            let html = '', i = 0;
            const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            while (i < ops.length) {
                if (!keep[i]) {
                    let s = i;
                    while (i < ops.length && !keep[i]) i++;
                    html += '<div class="ed-diff-gap">··· 中间省略 ' + (i - s) + ' 行相同内容 ···</div>';
                    continue;
                }
                const o = ops[i];
                const no = o.t === '+' ? '' : String(i + 1);
                const cls = o.t === '=' ? 'same' : o.t === '+' ? 'add' : 'del';
                const mark = o.t === '+' ? '+' : o.t === '-' ? '-' : ' ';
                html += '<div class="ed-diff-line ' + cls + '"><span class="dl-mark">' + mark + '</span><span>' + (esc(o.s) || ' ') + '</span></div>';
                i++;
            }
            body.innerHTML = html;
            panel.style.display = 'flex';
        }

        function _getEditorMode(ext) {
            const map = {
                'js': 'javascript', 'ts': 'javascript', 'jsx': 'javascript', 'tsx': 'javascript',
                'html': 'htmlmixed', 'htm': 'htmlmixed', 'css': 'css', 'scss': 'css', 'less': 'css',
                'json': 'javascript', 'xml': 'xml', 'svg': 'xml',
                'py': 'python', 'rb': 'ruby', 'lua': 'lua', 'sql': 'sql', 'go': 'go',
                'rs': 'clike', 'c': 'clike', 'cpp': 'clike', 'h': 'clike', 'java': 'clike', 'cs': 'clike',
                'php': 'php', 'md': 'markdown', 'yml': 'yaml', 'yaml': 'yaml',
                'ini': 'ini', 'cfg': 'ini', 'conf': 'ini',
                'properties': 'properties', 'sh': 'shell', 'bash': 'shell', 'bat': 'shell', 'ps1': 'shell',
                'txt': 'text', 'log': 'text', 'conf': 'text', 'env': 'text',
            };
            return map[ext] || 'text/plain';
        }

        function _renderMarkdown(text) {
            // 简易 Markdown 渲染器
            let html = text;
            // 代码块
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
                const langAttr = lang ? ` class="language-${lang}"` : '';
                return `<pre><code${langAttr}>${_escHtml(code.replace(/\n$/, ''))}</code></pre>`;
            });
            // 行内代码
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            // 标题
            html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
            html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
            html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
            html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');
            // 粗体和斜体
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            // 引用
            html = html.replace(/^>\s+(.+)$/gm, '<blockquote>$1</blockquote>');
            // 分割线
            html = html.replace(/^---$/gm, '<hr>');
            // 图片
            html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
            // 链接
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            // 无序列表
            html = html.replace(/^(\s*)[-*+]\s+(.+)$/gm, (_, indent, content) => {
                return `<li>${content}</li>`;
            });
            // 有序列表
            html = html.replace(/^(\s*)\d+\.\s+(.+)$/gm, (_, indent, content) => {
                return `<li>${content}</li>`;
            });
            // 包裹连续的 li 到 ul
            html = html.replace(/((?:<li>.+<\/li>\n?)+)/g, '<ul>$1</ul>');
            // 段落：连续非空白行
            html = html.replace(/^(?!<[uh]|<hr|<h|<pre|<blockquote|<img|<a|<strong|<em|<code)(.+)$/gm, '<p>$1</p>');
            // 任务列表
            html = html.replace(/<li>\[(\s|x)\]\s+(.+)<\/li>/g, '<li class="task-list-item"><input type="checkbox" disabled$1checked>$2</li>');
            return html;
        }

        function _initCodeMirror(element, initialContent, mode) {
            try {
                if (_editorInstance) {
                    _editorInstance.toTextArea && _editorInstance.toTextArea();
                    _editorInstance = null;
                }
                if (_simpleMDE) {
                    try { _simpleMDE.toTextArea(); } catch (e) { }
                    _simpleMDE = null;
                }
                if (typeof CodeMirror === 'undefined') {
                    element.innerHTML = '<div class="cm-placeholder"><i class="bi bi-hourglass-split"></i> CodeMirror 未加载</div>';
                    return;
                }
                if (_editorIsMarkdown) {
                    // Markdown: use SimpleMDE if loaded, otherwise fall back to plain CodeMirror
                    if (typeof SimpleMDE !== 'undefined') {
                        _simpleMDE = new SimpleMDE({
                            element: element,
                            spellChecker: false,
                            status: false,
                            autosave: { enabled: false },
                            placeholder: '在此输入 Markdown 内容...',
                            toolbar: [
                                'bold', 'italic', 'heading', '|',
                                'quote', 'unordered-list', 'ordered-list', '|',
                                'link', 'image', 'code', 'table', 'hr', '|',
                                'preview', 'side-by-side', 'fullscreen', '|',
                                'guide'
                            ]
                        });
                        _editorInstance = _simpleMDE.codemirror;
                        if (_editorInstance) _applyEditorAppearance();
                        if (_editorInstance) _editorInstance.on('change', _edMarkDirty);
                        if (_pendingSearchText && _editorInstance.getValue().length > 0) {
                            _doFind(_pendingSearchText);
                            _pendingSearchText = '';
                            if (_readyPollTimer) { clearInterval(_readyPollTimer); _readyPollTimer = null; }
                        }
                        return;
                    } else {
                        // SimpleMDE 尚未加载，用普通 CodeMirror 占位
                        // 创建 wrapper div 供 CodeMirror 使用
                        const wrapper = document.createElement('div');
                        wrapper.style.cssText = 'width:100%;height:100%;position:absolute;top:0;left:0;';
                        element.style.display = 'none';
                        element.parentNode.insertBefore(wrapper, element);
                        _editorInstance = CodeMirror(wrapper, {
                            value: initialContent,
                            mode: 'markdown',
                            theme: _editorTheme(),
                            lineNumbers: true,
                            autoRefresh: true,
                            lineWrapping: true,
                            tabSize: 4,
                            indentUnit: 4,
                        });
                        if (!window._simpleMDEReady) {
                            window._simpleMDEReady = () => {
                                if (_editorInstance && _editorIsMarkdown) {
                                    try {
                                        if (_editorInstance) { _editorInstance.toTextArea && _editorInstance.toTextArea(); _editorInstance = null; }
                                        _simpleMDE = new SimpleMDE({
                                            element: element,
                                            spellChecker: false,
                                            status: false,
                                            autosave: { enabled: false },
                                            toolbar: [
                                                'bold', 'italic', 'heading', '|',
                                                'quote', 'unordered-list', 'ordered-list', '|',
                                                'link', 'image', 'code', 'table', 'hr', '|',
                                                'preview', 'side-by-side', 'fullscreen', '|',
                                                'guide'
                                            ]
                                        });
                                        _editorInstance = _simpleMDE.codemirror;
                                        if (_editorInstance) _applyEditorAppearance();
                                        if (_editorInstance) _editorInstance.on('change', _edMarkDirty);
                                        wrapper.remove();
                                    } catch (e) { console.error('SimpleMDE upgrade failed:', e); }
                                }
                            };
                            window.addEventListener('simplemde_loaded', () => {
                                if (window._simpleMDEReady) window._simpleMDEReady();
                            }, { once: true });
                        }
                        return;
                    }
                }
                _editorInstance = CodeMirror(element, {
                    value: initialContent,
                    mode: mode,
                    theme: _editorTheme(),
                    lineNumbers: true,
                    autoRefresh: true,
                    lineWrapping: true,
                    tabSize: 4,
                    indentUnit: 4,
                });
                _applyEditorAppearance();
                if (_editorIsMarkdown) {
                    _editorInstance.on('change', () => {
                        _edMarkDirty();
                        _updateEditorPreview();
                        if (_pendingSearchText) {
                            _doFind(_pendingSearchText);
                            _pendingSearchText = '';
                            if (_readyPollTimer) { clearInterval(_readyPollTimer); _readyPollTimer = null; }
                        }
                    });
                } else {
                    _editorInstance.on('change', () => {
                        _edMarkDirty();
                        if (_pendingSearchText) {
                            _doFind(_pendingSearchText);
                            _pendingSearchText = '';
                            if (_readyPollTimer) { clearInterval(_readyPollTimer); _readyPollTimer = null; }
                        }
                    });
                }
                // 编辑器就绪，触发待搜索（如果有内容）
                if (_pendingSearchText && _editorInstance.getValue().length > 0) {
                    _doFind(_pendingSearchText);
                    _pendingSearchText = '';
                    if (_readyPollTimer) { clearInterval(_readyPollTimer); _readyPollTimer = null; }
                }
            } catch (e) {
                console.error('_initCodeMirror failed:', e);
                element.innerHTML = '<div class="cm-placeholder"><i class="bi bi-exclamation-circle"></i> 初始化失败: ' + e.message + '</div>';
            }
        }

        // 保存前二次确认：展示本次新增/删除行数

        function closeEditor() {
            if (_editorPreviewTimer) { clearTimeout(_editorPreviewTimer); _editorPreviewTimer = null; }
            _clearSearchHighlights();
            if (_simpleMDE) { try { _simpleMDE.toTextArea(); } catch (e) { } _simpleMDE = null; }
            if (_editorInstance) { _editorInstance.toTextArea && _editorInstance.toTextArea(); _editorInstance = null; }

            container.innerHTML = '';

        // ========== 编辑器查找/替换 ==========
        let _searchMarkers = [];
        let _searchCurrentMarker = null;
        let _searchCurrentIdx = 0;
        let _searchTotalCount = 0;
        let _pendingSearchText = '';
        let _readyPollTimer = null;

        function _editorReady() {
            return _editorInstance && typeof _editorInstance.getValue === 'function';
        }
        function _editorReadyPoll() {
            if (_readyPollTimer) return;
            let tries = 0;
            _readyPollTimer = setInterval(() => {
                tries++;
                if (_editorReady() && _editorInstance.getValue().length > 0) {
                    clearInterval(_readyPollTimer);
                    _readyPollTimer = null;
                    if (_pendingSearchText) _doFind(_pendingSearchText);
                } else if (tries > 50) {
                    clearInterval(_readyPollTimer);
                    _readyPollTimer = null;
                }
            }, 100);
        }

        function _clearSearchHighlights() {
            for (const s of _searchMarkers) { try { if (s.marker) s.marker.clear(); } catch (e) { } }
            _searchMarkers = [];
            _searchCurrentMarker = null;
            _searchCurrentIdx = 0;
            _searchTotalCount = 0;
        }

        function _buildSearchRegex(text, wholeWord) {
            if (!text) return null;
            const escaped = text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = wholeWord ? '\\b' + escaped + '\\b' : escaped;
            const flags = 'g';
            return new RegExp(pattern, flags);
        }

        function _doFind(text) {
            // 编辑器未就绪：记录待搜索，轮询重试
            if (!_editorReady()) {
                _pendingSearchText = text;
                _editorReadyPoll();
                _updateSearchInfo('加载...', 0);
                return;
            }
            const editor = _editorInstance;
            _clearSearchHighlights();
            if (!text || !text.trim()) {
                _updateSearchInfo('', 0);
                return;
            }
            _pendingSearchText = text;

            const content = editor.getValue();
            // 内容为空（等待文件加载），记录待搜索并轮询
            if (!content || content.length === 0) {
                _updateSearchInfo('等待内容...', 0);
                _editorReadyPoll();
                return;
            }

            const matchCase = document.getElementById('edMatchCase').checked;
            const matchWhole = document.getElementById('edWholeWord').checked;

            // 手动实现搜索：getValue + posFromIndex + markText
            const escaped = text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = matchWhole ? '\\b' + escaped + '\\b' : escaped;
            const flags = 'g' + (matchCase ? '' : 'i');
            const regex = new RegExp(pattern, flags);
            const matches = [];
            let m;
            while ((m = regex.exec(content)) !== null) {
                matches.push({ fromIdx: m.index, toIdx: m.index + m[0].length });
            }

            if (matches.length === 0) {
                _updateSearchInfo('未找到', 0);
                return;
            }

            // 高亮所有匹配
            for (const match of matches) {
                const from = editor.posFromIndex(match.fromIdx);
                const to = editor.posFromIndex(match.toIdx);
                const marker = editor.markText(from, to, { className: 'cm-search-match' });
                _searchMarkers.push({ from, to, marker });
            }

            _searchTotalCount = matches.length;
            _searchCurrentIdx = 1;
            _searchCurrentMarker = _searchMarkers[0];

            // 第一个为当前光标高亮（橙色）
            const first = _searchMarkers[0];
            first.marker.clear();
            _searchMarkers[0] = { from: first.from, to: first.to, marker: editor.markText(first.from, first.to, { className: 'cm-search-match-cursor' }) };
            editor.scrollIntoView(first.from, 50);
            _updateSearchInfo('1/' + matches.length, 1);
        }

        function _findInEditor(forward) {
            const si = document.getElementById('edSearchInput');
            if (!_editorReady() || !si || !si.value) return;

            // 如果还没搜索过（或内容为空），先执行搜索
            if (_searchMarkers.length === 0) {
                _doFind(si.value);
                if (_searchMarkers.length === 0) return;
            }

            const editor = _editorInstance;

            // 恢复上一个当前为普通高亮
            if (_searchCurrentIdx) {
                const prev = _searchMarkers[_searchCurrentIdx - 1];
                if (prev) {
                    prev.marker.clear();
                    _searchMarkers[_searchCurrentIdx - 1] = { from: prev.from, to: prev.to, marker: editor.markText(prev.from, prev.to, { className: 'cm-search-match' }) };
                }
            }

            _searchCurrentIdx += (forward ? 1 : -1);
            if (_searchCurrentIdx > _searchMarkers.length) _searchCurrentIdx = 1;
            if (_searchCurrentIdx < 1) _searchCurrentIdx = _searchMarkers.length;

            const cur = _searchMarkers[_searchCurrentIdx - 1];
            if (!cur) return;
            cur.marker.clear();
            _searchMarkers[_searchCurrentIdx - 1] = { from: cur.from, to: cur.to, marker: editor.markText(cur.from, cur.to, { className: 'cm-search-match-cursor' }) };
            _searchCurrentMarker = _searchMarkers[_searchCurrentIdx - 1];
            editor.scrollIntoView(_searchCurrentMarker.from, 50);
            _updateSearchInfo(_searchCurrentIdx + '/' + _searchMarkers.length, _searchCurrentIdx);
        }

        function _replaceInEditor(replaceAll) {
            if (!_editorReady()) { showToast('提示', '编辑器未就绪', 'warning'); return; }
            const editor = _editorInstance;
            const searchInput = document.getElementById('edSearchInput');
            const replaceInput = document.getElementById('edReplaceInput');
            if (!editor || !searchInput.value) { showToast('提示', '请输入查找内容', 'warning'); searchInput.focus(); return; }

            const matchCase = document.getElementById('edMatchCase').checked;
            const matchWhole = document.getElementById('edWholeWord').checked;
            const findText = searchInput.value;
            const replaceText = replaceInput.value;

            if (replaceAll) {
                const escaped = findText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const pattern = matchWhole ? '\\b' + escaped + '\\b' : escaped;
                const flags = 'g' + (matchCase ? '' : 'i');
                const regex = new RegExp(pattern, flags);
                const newContent = editor.getValue().replace(regex, replaceText);
                editor.setValue(newContent);
                if (_editorIsMarkdown) _updateEditorPreview();
                _doFind(findText);
                _updateSearchInfo('全部替换完成', _searchMarkers.length);
                showToast('成功', '已替换所有匹配项', 'success');
            } else {
                if (_searchMarkers.length === 0) { showToast('提示', '未找到匹配', 'warning'); searchInput.focus(); return; }
                const cur = _searchMarkers[_searchCurrentIdx - 1];
                if (!cur) return;
                editor.replaceRange(replaceText, cur.from, cur.to);
                _doFind(findText);
                if (_editorIsMarkdown) _updateEditorPreview();
            }
        }

        function _replaceAllWholeWord(text, findText, replaceText, matchCase) {
            const escaped = findText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const flags = 'g' + (matchCase ? '' : 'i');
            const regex = new RegExp('\\b' + escaped + '\\b', flags);
            return text.replace(regex, replaceText);
        }

        function _updateSearchInfo(text, current) {
            const el = document.getElementById('edSearchInfo');
            if (!el) return;
            el.textContent = text;
            el.className = 'ed-search-info' + (current === 0 ? ' error' : '');
        }

        function _openSearchPanel(panel, showReplace) {
            if (!panel) return;
            panel.classList.add('visible');
            const searchInput = document.getElementById('edSearchInput');
            const infoEl = document.getElementById('edSearchInfo');
            if (infoEl) infoEl.textContent = '--';

            if (_editorReady()) {
                const sel = _editorInstance.getSelection();
                if (sel) { searchInput.value = sel; searchInput.select(); }
            }
            searchInput.focus();

            if (showReplace) {
                document.getElementById('edReplaceRow').style.display = 'flex';
                document.getElementById('edReplaceInput').focus();
            }

            if (searchInput.value) {
                if (_editorReady() && _editorInstance.getValue().length > 0) {
                    _doFind(searchInput.value);
                } else {
                    _pendingSearchText = searchInput.value;
                    _updateSearchInfo('等待内容...', 0);
                    _editorReadyPoll();
                }
            }
        }

        function _closeSearchPanel(panel) {
            if (!panel) return;
            panel.classList.remove('visible');
            _clearSearchHighlights();

        function _goToLine() {
            const editor = _editorInstance;
            if (!editor) return;
            const total = editor.lineCount();
            const overlay = document.createElement('div');
            overlay.className = 'custom-modal-overlay';
            overlay.innerHTML = `
            <div class="custom-modal" style="max-width:320px;padding:20px 24px;">
                <div class="modal-title"><i class="bi bi-arrow-down-up"></i> 跳转到行</div>
                <div class="modal-body">

                    <span style="font-size:0.72rem;color:#94a3b8;margin-top:4px;display:block;">共 ${total} 行</span>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-cancel" id="edGoCancel">取消</button>
                    <button class="btn btn-ok" id="edGoOk">跳转</button>
                </div>
            </div>
        `;
            document.body.appendChild(overlay);
            const input = overlay.querySelector('#edGoLineInput');
            input.focus(); input.select();
            const jump = () => {
                const line = parseInt(input.value, 10);
                if (line >= 1 && line <= total) {
                    editor.setCursor({ line: line - 1, ch: 0 });
                    editor.scrollIntoView({ line: line - 1, ch: 0 }, 80);
                    overlay.remove();
                }
            };
            overlay.querySelector('#edGoOk').addEventListener('click', jump);
            overlay.querySelector('#edGoCancel').addEventListener('click', () => overlay.remove());
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') jump(); if (e.key === 'Escape') overlay.remove(); });
        }

        // ========== 新建文件/文件夹 ==========
        function showNewFileDialog(isDir) {
            const defaultName = isDir ? '新文件夹' : '新文件.txt';
            const placeholder = isDir ? '输入文件夹名称' : '输入文件名（如 note.txt）';
            const icon = isDir ? '📁' : '📄';
            // 收集当前目录下已有的文件名
            const existingNames = new Set();
            for (const item of fileItems) {
                existingNames.add(item.name);
            }
            showInputDialog(icon + ' 新建' + (isDir ? '文件夹' : '文件'), placeholder, defaultName, (name) => {
                if (!name || !name.trim()) return;
                name = name.trim();
                if (!isDir && !name.includes('.')) {
                    name += '.txt';
                }
                createFileOrDir(name, isDir);
            }, (name) => {
                if (!name || !name.trim()) {
                    return { valid: false, message: '名称不能为空' };
                }
                const cleanName = isDir && !name.includes('.') ? name : (name.includes('.') ? name : (name + (isDir ? '' : '.txt')));
                const checkName = isDir && !cleanName.includes('.') ? name.trim() : cleanName;
                if (existingNames.has(checkName)) {
                    return { valid: false, message: '「' + checkName + '」已存在，请换一个名称' };
                }
                return { valid: true };
            });
        }

        // ========== 自定义弹窗 ==========

                overlay.innerHTML = `
                <div class="custom-modal">

                        el.checked = false;
                        selectedPaths.delete(el.dataset.path);
                        // 列表视图是 <tr>，图标/树型视图分别是 .icon-item / .tree-line（找不到时不能直接 .classList）
                        const row = el.closest('tr, .icon-item, .tree-line');
                        if (row) row.classList.remove('selected');
                    });
                    updateSelectedCount();
                    updateBatchDeleteBtn();
                    document.getElementById('selectAll').checked = false;
                    document.getElementById('selectAll').indeterminate = false;
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
                    e.preventDefault();
                    document.querySelectorAll('.item-checkbox').forEach(el => {
                        el.checked = true;
                        selectedPaths.add(el.dataset.path);
                        el.closest('tr').classList.add('selected');
                    });
                    updateSelectedCount();
                    updateBatchDeleteBtn();
                    document.getElementById('selectAll').checked = true;
                    document.getElementById('selectAll').indeterminate = false;
                }
            });
            // 视图切换
            document.querySelectorAll('.btn-view').forEach(btn => {
                btn.addEventListener('click', () => switchView(btn.dataset.view));
            });
            // 图标大小切换
            document.querySelectorAll('.icon-size-btn').forEach(btn => {
                btn.addEventListener('click', () => switchIconSize(btn.dataset.size));
            });
            // 选择模式
            document.getElementById('selectModeBtn').addEventListener('click', toggleSelectMode);
            // 双击列表空白处切换多选模式
            ['viewList', 'viewIcon', 'viewTree'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('dblclick', (e) => {
                    // 双击文件/文件夹行由行级处理器选中该行；此处仅处理表格/网格真正的空白区域
                    if (e.target.closest('button, a, input, select, .dropdown-menu, tr[data-path], .icon-item, .tree-line')) return;
                    toggleSelectMode();
                    showToast('提示', selectMode ? '已开启多选模式，再次双击空白处可退出' : '已退出多选模式', selectMode ? 'info' : 'success');
                });
            });
            // 全盘搜索
            document.getElementById('searchBtn').addEventListener('click', () => showSearchModal());
            // 新建文件/文件夹
            document.getElementById('newFileMenuItem').addEventListener('click', (e) => { e.preventDefault(); showNewFileDialog(false); });
            document.getElementById('newFolderMenuItem').addEventListener('click', (e) => { e.preventDefault(); showNewFileDialog(true); });
            // 删除历史面板
            document.getElementById('deleteHistoryBtn').addEventListener('click', () => showDeleteHistory());
        }

                bindIndexBadge();

        function closeDeleteHistory() {
            const container = document.getElementById('deleteHistoryPanel');

        }

        // ========== ⭐ 收藏夹 ==========
        let _favs = [];              // 收藏条目 {path, name, added, group?, is_dir}
        let _favGroupOrder = [];     // 分组展示顺序（"__ungrouped__" 占位「其他」）
        let _favActiveTab = '__all__';

        function loadFavs() {
            return fetch('/api/favorites')
                .then(r => r.json())
                .then(d => {
                    _favs = (d.items || []).slice();
                    _favGroupOrder = (d.groups || []).slice();
                })
                .catch(() => { });
        }

        function _favBasename(p) {
            return (p || '').replace(/[\\/]+$/, '').split(/[\\/]/).pop() || p;
        }

        // 收藏跳转后：等待列表渲染完成，滚动到对应行并闪烁高亮
        let _pendingHighlightPath = null;
        function _highlightRowByPath(path) {
            const rows = document.querySelectorAll('tr[data-path], .icon-item[data-path], .tree-line[data-path]');
            let el = null;
            for (const c of rows) { if (c.dataset.path === path) { el = c; break; } }
            if (!el) return false;
            try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) { try { el.scrollIntoView(); } catch (e2) { } }
            el.classList.remove('fav-highlight');
            void el.offsetWidth;   // 强制重排以重新触发动画
            el.classList.add('fav-highlight');
            // 动画自身约 2.7s 淡出；这里兜底清理所有高亮行（防止元素被重渲染替换后残留）
            setTimeout(() => {
                document.querySelectorAll('.fav-highlight').forEach(n => n.classList.remove('fav-highlight'));
            }, 3000);
            return true;
        }
        function _pollPendingHighlight() {
            if (!_pendingHighlightPath) return;
            const target = _pendingHighlightPath;
            const started = Date.now();
            const timer = setInterval(() => {
                if (_pendingHighlightPath !== target) { clearInterval(timer); return; }   // 已发起新的跳转
                if (_highlightRowByPath(target)) {
                    clearInterval(timer);
                    _pendingHighlightPath = null;
                } else if (Date.now() - started > 10000) {
                    clearInterval(timer);
                    _pendingHighlightPath = null;
                }
            }, 120);
        }

        function _fmtFavAdded(sec) {
            if (!sec) return '';
            const d = new Date(sec * 1000);
            const pad = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
                ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function _favApi(method, url, body) {
            return fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: body ? JSON.stringify(body) : undefined
            }).then(r => r.json());
        }

        // 收藏 / 取消收藏指定路径（菜单、收藏夹抽屉共用）
        async function toggleFavByPath(p) {
            if (!p) return;
            const exists = _favs.find(f => f.path === p);
            if (exists) {
                const ok = await showConfirm('取消收藏 "' + _favBasename(p) + '" 吗？');
                if (!ok) return;
                const d = await _favApi('DELETE', '/api/favorites', { path: p });
                if (d.error) { showToast('错误', d.error, 'danger'); return; }
                showToast('提示', '已取消收藏', 'info');
                await loadFavs();
                const panel = document.getElementById('favoritePanel');
                if (panel && panel.innerHTML) _renderFavTabs();
                return;
            }
            // 新增收藏：弹出分组选择悬浮框（点选现有分组或输入新分组）
            const groups = (_favGroupOrder || []).filter(g => g && g !== '__ungrouped__');
            showInputDialog('收藏「' + _favBasename(p) + '」', '选择分组，或输入新分组名称（留空归入「其他」）', '', async (name) => {
                name = (name || '').trim();
                const d = await _favApi('POST', '/api/favorites', { path: p, group: name });
                if (d.error) { showToast('错误', d.error, 'danger'); return false; }
                showToast('成功', '已收藏到「' + (name || '其他') + '」', 'success');
                await loadFavs();
                const panel = document.getElementById('favoritePanel');
                if (panel && panel.innerHTML) _renderFavTabs();
                return true;
            }, null, { suggestions: groups, suggestionsLabel: '选择分组' });
        }

        // 收藏 / 取消收藏当前目录（工具栏 ⭐ 收藏本目录）
        async function toggleFavCurrent() {
            if (!currentPath) { showToast('提示', '尚未进入任何目录', 'warning'); return; }
            await toggleFavByPath(currentPath);
        }

        function showFavorites() {
            const container = document.getElementById('favoritePanel');
            if (!container) return;
            container.innerHTML = `
            <div class="delhist-overlay">
                <div class="delhist-panel fav-panel">
                    <div class="panel-header">
                        <span class="panel-title"><i class="bi bi-star-fill"></i> 收藏夹</span>
                        <button class="panel-close" title="关闭"><i class="bi bi-x-lg"></i></button>
                    </div>
                    <div class="fav-tabs" id="favTabs"></div>
                    <div class="panel-body" id="favBody"></div>
                    <div class="panel-footer fav-footer">
                        <button class="fav-cur-btn" id="favCurPanelBtn"><i class="bi bi-star"></i> 收藏当前目录</button>
                        <span class="fav-tip">点名称跳转 · 🏷️ 改分组 · 🗑 取消收藏</span>
                    </div>
                </div>
            </div>
        `;
            container.querySelector('.panel-close').addEventListener('click', closeFavorites);
            container.querySelector('.delhist-overlay').addEventListener('click', (e) => {
                if (e.target === container.querySelector('.delhist-overlay')) closeFavorites();
            });
            document.getElementById('favCurPanelBtn').addEventListener('click', toggleFavCurrent);
            _renderFavTabs();
        }

        function closeFavorites() {
            const container = document.getElementById('favoritePanel');
            if (container) container.innerHTML = '';
        }

        function _favTabList() {
            // 顺序：全部 → 各分组（按保存顺序）→ 其他 → ＋新建
            const list = [{ key: '__all__', label: '全部' }];
            (_favGroupOrder || []).forEach(g => { if (g !== '__ungrouped__') list.push({ key: g, label: g }); });
            list.push({ key: '__ungrouped__', label: '其他' });
            return list;
        }

        function _renderFavTabs() {
            const wrap = document.getElementById('favTabs');
            if (!wrap) return;
            if (!_favTabList().some(t => t.key === _favActiveTab)) _favActiveTab = '__all__';
            let html = '';
            _favTabList().forEach(t => {
                const cnt = t.key === '__all__' ? _favs.length
                    : _favs.filter(f => (t.key === '__ungrouped__' ? !f.group : f.group === t.key)).length;
                html += `<button class="fav-tab${_favActiveTab === t.key ? ' on' : ''}" data-tab="${_escAttr(t.key)}">${_escapeHtml(t.label)}<span class="cnt">${cnt}</span></button>`;
            });
            html += `<button class="fav-tab fav-tab-add" id="favNewGroupBtn"><i class="bi bi-plus-lg"></i> 新建分组</button>`;
            wrap.innerHTML = html;
            wrap.querySelectorAll('.fav-tab[data-tab]').forEach(btn => {
                btn.addEventListener('click', () => {
                    _favActiveTab = btn.dataset.tab;
                    _renderFavTabs();
                });
            });
            wrap.addEventListener('wheel', (e) => {
                // 竖向滚轮映射为横向滚动（shift+滚轮或触摸板原生横向滚动不受影响）
                if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    if (wrap.scrollWidth > wrap.clientWidth) {
                        e.preventDefault();
                        wrap.scrollLeft += e.deltaY;
                    }
                }
            }, { passive: false });
            wrap.querySelector('#favNewGroupBtn').addEventListener('click', () => {
                showInputDialog('新建分组', '分组名称', '', async (name) => {
                    name = (name || '').trim();
                    if (!name) return false;
                    const d = await _favApi('POST', '/api/favorites/group', { name: name });
                    if (d.error) { showToast('错误', d.error, 'danger'); return false; }
                    await loadFavs();
                    _favActiveTab = name;
                    _renderFavTabs();
                    return true;
                });
            });
            _renderFavList();
        }

        function _renderFavList() {
            const body = document.getElementById('favBody');
            if (!body) return;
            let list = _favs;
            if (_favActiveTab !== '__all__') {
                list = _favs.filter(f => _favActiveTab === '__ungrouped__' ? !f.group : f.group === _favActiveTab);
            }
            let html = '';
            // 当前为具体分组：显示分组管理（重命名/删除分组）
            if (_favActiveTab !== '__all__' && _favActiveTab !== '__ungrouped__') {
                html += `<div class="fav-grp-head"><span>📁 ${_escapeHtml(_favActiveTab)}</span>
                <span class="fav-acts">
                    <button class="fav-mini" id="favRenameGroupBtn" title="重命名分组">✏️</button>
                    <button class="fav-mini" id="favDelGroupBtn" title="删除分组（收藏保留，归入其他）">🗑️</button>
                </span></div>`;
            }
            if (!list.length) {
                html += `<div class="delhist-empty"><i class="bi bi-star"></i>暂无收藏<br><span style="font-size:0.75rem;">进入目录后点击工具栏「⭐ 收藏本目录」</span></div>`;
                body.innerHTML = html;
                _bindFavGroupActs();
                return;
            }
            list.forEach(f => {
                const name = f.name || _favBasename(f.path);
                const ico = f.is_dir ? '📁' : '📄';
                html += `<div class="fav-row" data-path="${_escAttr(f.path)}" title="${_escAttr(f.path)}">
                <span class="fav-ico">${ico}</span>
                <span class="fav-name">${_escapeHtml(name)}</span>
                <span class="fav-time">${_fmtFavAdded(f.added)}</span>
                <span class="fav-acts">
                    <button class="fav-mini fav-act-group" data-path="${_escAttr(f.path)}" data-group="${_escAttr(f.group || '')}" title="改分组">🏷️</button>
                    <button class="fav-mini fav-act-del" data-path="${_escAttr(f.path)}" title="取消收藏">🗑️</button>
                </span>
            </div>`;
            });
            body.innerHTML = html;
            _bindFavGroupActs();
            // 行点击跳转：目录直接进入；文件进入其所在目录
            body.querySelectorAll('.fav-row').forEach(row => {
                row.addEventListener('click', (e) => {
                    if (e.target.closest('.fav-mini')) return;
                    const p = row.dataset.path;
                    const item = _favs.find(f => f.path === p);
                    const target = item && item.is_dir ? p : (p.replace(/[\\/][^\\/]+[\\/]?$/, '') || p);
                    _pendingHighlightPath = p;        // 跳转后高亮此条目（文件高亮所在目录中的它，目录高亮自身）
                    navigateTo(target);
                    closeFavorites();
                    _pollPendingHighlight();
                });
            });
            body.querySelectorAll('.fav-act-group').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const p = btn.dataset.path;
                    const existingGroups = (_favGroupOrder || []).filter(g => g && g !== '__ungrouped__');
                    showInputDialog('修改分组', '分组名称（留空归入「其他」，输入新名称自动创建）', btn.dataset.group, async (name) => {
                        name = (name || '').trim();
                        const d = await _favApi('PUT', '/api/favorites', { path: p, group: name });
                        if (d.error) { showToast('错误', d.error, 'danger'); return false; }
                        await loadFavs();
                        _renderFavTabs();
                        return true;
                    }, null, { suggestions: existingGroups, suggestionsLabel: '现有分组' });
                });
            });
            body.querySelectorAll('.fav-act-del').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const p = btn.dataset.path;
                    const ok = await showConfirm('取消收藏 "' + _favBasename(p) + '" 吗？');
                    if (!ok) return;
                    const d = await _favApi('DELETE', '/api/favorites', { path: p });
                    if (d.error) { showToast('错误', d.error, 'danger'); return; }
                    await loadFavs();
                    _renderFavTabs();
                });
            });
        }

        function _bindFavGroupActs() {
            const rn = document.getElementById('favRenameGroupBtn');
            if (rn) rn.addEventListener('click', () => {
                showInputDialog('重命名分组', '新的分组名称', _favActiveTab, async (name) => {
                    name = (name || '').trim();
                    if (!name || name === _favActiveTab) return false;
                    const d = await _favApi('POST', '/api/favorites/group', { old: _favActiveTab, name: name });
                    if (d.error) { showToast('错误', d.error, 'danger'); return false; }
                    await loadFavs();
                    _favActiveTab = name;
                    _renderFavTabs();
                    return true;
                });
            });
            const del = document.getElementById('favDelGroupBtn');
            if (del) del.addEventListener('click', async () => {
                const ok = await showConfirm('删除分组 "' + _favActiveTab + '" 吗？组内收藏会保留并归入「其他」。');
                if (!ok) return;
                const d = await _favApi('DELETE', '/api/favorites/group', { name: _favActiveTab });
                if (d.error) { showToast('错误', d.error, 'danger'); return; }
                await loadFavs();
                _favActiveTab = '__all__';
                _renderFavTabs();
            });
        }

        function _initFavUI() {
            const favBtn = document.getElementById('favPanelBtn');
            if (favBtn) favBtn.addEventListener('click', showFavorites);
            const curBtn = document.getElementById('favCurBtn');
            if (curBtn) curBtn.addEventListener('click', toggleFavCurrent);
            loadFavs();
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', _initFavUI);
        } else {
            _initFavUI();
        }

        function _formatTimeAgo(ts) {
            if (!ts) return '--';
            const diff = Math.floor((Date.now() / 1000) - ts);
            if (diff < 60) return diff + '秒前';
            if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
            if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
            return Math.floor(diff / 86400) + '天前';
        }
