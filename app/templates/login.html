<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 文件管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .login-card {
            width: 360px; max-width: 92vw;
            background: #fff; border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            padding: 36px 32px;
        }
        .login-card .title { font-size: 1.25rem; font-weight: 600; color: #1a202c; text-align: center; margin-bottom: 4px; }
        .login-card .subtitle { font-size: 0.85rem; color: #94a3b8; text-align: center; margin-bottom: 24px; }
        .error-banner {
            background: #fef2f2; color: #dc2626; border: 1px solid #fecaca;
            border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; margin-bottom: 16px;
        }
        .btn-login { width: 100%; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="title">📁 文件管理</div>
        <div class="subtitle">请登录后使用</div>
        {% if error %}
        <div class="error-banner">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}">
            <div class="mb-3">
                <label class="form-label" style="font-size:0.85rem;color:#475569;">用户名</label>
                <input type="text" class="form-control" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label" style="font-size:0.85rem;color:#475569;">密码</label>
                <input type="password" class="form-control" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login">登 录</button>
        </form>
    </div>
</body>
</html>
