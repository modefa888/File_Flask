<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} - Markdown</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #ffffff; color: #1f2328;
    font: 16px/1.75 -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  /* 居中排版列 */
  .md-page {
    max-width: 860px; margin: 0 auto;
    padding: 56px 32px 96px; word-break: break-word;
  }
  h1, h2, h3, h4, h5, h6 { margin: 1.4em 0 .6em; line-height: 1.35; font-weight: 600; }
  h1 { font-size: 2em; margin-top: 0; padding-bottom: .3em; border-bottom: 1px solid #d1d9e0; }
  h2 { font-size: 1.5em; padding-bottom: .25em; border-bottom: 1px solid #e4e8ec; }
  h3 { font-size: 1.25em; }
  h4 { font-size: 1.05em; }
  p { margin: .8em 0; }
  a { color: #0969da; text-decoration: none; }
  a:hover { text-decoration: underline; }
  code {
    background: #eff1f3; border-radius: 5px; padding: .15em .45em;
    font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: .875em; color: #cf222e;
  }
  pre {
    background: #f6f8fa; border: 1px solid #e4e8ec; border-radius: 8px;
    padding: 14px 16px; overflow-x: auto; margin: 1em 0; line-height: 1.55;
  }
  pre code { background: none; padding: 0; color: #1f2328; font-size: 13px; }
  blockquote {
    margin: 1em 0; padding: 2px 18px; color: #59636e;
    border-left: 4px solid #d1d9e0; background: #f6f8fa; border-radius: 0 6px 6px 0;
  }
  ul, ol { margin: .6em 0; padding-left: 1.8em; }
  li { margin: .25em 0; }
  li input[type="checkbox"] { margin-right: 8px; }
  hr { border: none; border-top: 1px solid #d1d9e0; margin: 1.6em 0; }
  img { max-width: 100%; border-radius: 6px; }
  table { border-collapse: collapse; margin: 1em 0; min-width: 50%; }
  th, td { border: 1px solid #d1d9e0; padding: 7px 15px; }
  th { background: #f6f8fa; }
  tr:nth-child(even) td { background: #fafbfc; }
  del { color: #8c959f; }
</style>
</head>
<body>
<main class="md-page" id="mdPage"></main>
<script>
  const SRC = {{ content | tojson }};
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  // 与 IDE 内置渲染器同款的轻量 Markdown 渲染：先整体转义，
  // 代码块/行内代码/图片/链接用占位符保护，最后还原
  function renderMarkdown(src) {
    const stash = [];
    const keep = (h) => { stash.push(h); return "\u0000" + (stash.length - 1) + "\u0000"; };
    let text = String(src == null ? "" : src).replace(/\r\n?/g, "\n");
    text = text.replace(/```(\w*)[ \t]*\n([\s\S]*?)(?:\n[ \t]*```|$)/g,
      (m, lang, code) => "\n" + keep('<pre><code' + (lang ? ' class="lang-' + esc(lang) + '"' : "") + ">" + esc(code) + "</code></pre>") + "\n");
    text = esc(text);
    text = text.replace(/`([^`\n]+)`/g, (m, c) => keep("<code>" + c + "</code>"));
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, url) => keep('<img src="' + url.replace(/"/g, "") + '" alt="' + alt + '">'));
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, url) => keep('<a href="' + url.replace(/"/g, "") + '">' + t + "</a>"));
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    text = text.replace(/~~([^~]+)~~/g, "<del>$1</del>");
    const lines = text.split("\n");
    const out = [];
    let i = 0;
    const isBlank = (l) => /^\s*$/.test(l);
    const isFence = (l) => /^\u0000\d+\u0000$/.test(l.trim());
    const taskMark = (h) => h.replace(/^\[( |x|X)\]\s+/, (m, c) => '<input type="checkbox" disabled' + (c.toLowerCase() === "x" ? " checked" : "") + "> ");
    while (i < lines.length) {
      const line = lines[i];
      if (isBlank(line)) { i++; continue; }
      if (isFence(line)) { out.push(line.trim()); i++; continue; }
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
        const heads = cells(line);
        const aligns = cells(lines[i + 1]).map(c => {
          const l = c.startsWith(":"), r = c.endsWith(":");
          return l && r ? "center" : r ? "right" : l ? "left" : "";
        });
        const al = (k) => aligns[k] ? ' style="text-align:' + aligns[k] + '"' : "";
        let html = "<table><thead><tr>" + heads.map((h, k) => "<th" + al(k) + ">" + h + "</th>").join("") + "</tr></thead><tbody>";
        i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
          const row = cells(lines[i]);
          html += "<tr>" + heads.map((_, k) => "<td" + al(k) + ">" + (row[k] || "") + "</td>").join("") + "</tr>";
          i++;
        }
        out.push(html + "</tbody></table>"); continue;
      }
      let m = line.match(/^(#{1,6})\s+(.*)$/);
      if (m) { const n = m[1].length; out.push("<h" + n + ">" + m[2] + "</h" + n + ">"); i++; continue; }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
      if (/^\s*&gt;\s?/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*&gt;\s?/, "")); i++; }
        out.push("<blockquote>" + buf.join("<br>") + "</blockquote>"); continue;
      }
      if (/^\s*[-*+]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
        const ordered = /^\s*\d+\.\s+/.test(line);
        const re = ordered ? /^\s*\d+\.\s+(.*)$/ : /^\s*[-*+]\s+(.*)$/;
        let html = ordered ? "<ol>" : "<ul>";
        while (i < lines.length && re.test(lines[i])) { html += "<li>" + taskMark(lines[i].replace(re, "$1")) + "</li>"; i++; }
        out.push(html + (ordered ? "</ol>" : "</ul>")); continue;
      }
      const buf = [line]; i++;
      while (i < lines.length && !isBlank(lines[i]) && !isFence(lines[i]) &&
             !/^(#{1,6})\s+/.test(lines[i]) && !/^\s*[-*+]\s+/.test(lines[i]) &&
             !/^\s*\d+\.\s+/.test(lines[i]) && !/^\s*&gt;/.test(lines[i]) &&
             !/^\s*\|.*\|\s*$/.test(lines[i]) && !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i])) {
        buf.push(lines[i]); i++;
      }
      out.push("<p>" + buf.join("<br>") + "</p>");
    }
    return out.join("\n").replace(/\u0000(\d+)\u0000/g, (m, k) => stash[+k]);
  }
  const page = document.getElementById("mdPage");
  page.innerHTML = renderMarkdown(SRC);
  const h1 = page.querySelector("h1");   // 用第一个标题做页面标题
  if (h1 && h1.textContent.trim()) document.title = h1.textContent.trim();
</script>
</body>
</html>
