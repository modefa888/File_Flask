<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} - Markdown</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #ffffff; color: #1f2328;
    font: 16px/1.75 -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  /* 居中排版列 */
  .md-page {
    max-width: 860px; margin: 0 auto;
    padding: 56px 32px 96px; word-break: break-word;
  }
  h1, h2, h3, h4, h5, h6 { margin: 1.4em 0 .6em; line-height: 1.35; font-weight: 600; }
  h1 { font-size: 2em; margin-top: 0; padding-bottom: .3em; border-bottom: 1px solid #d1d9e0; }
  h2 { font-size: 1.5em; padding-bottom: .25em; border-bottom: 1px solid #e4e8ec; }
  h3 { font-size: 1.25em; }
  h4 { font-size: 1.05em; }
  p { margin: .8em 0; }
  a { color: #0969da; text-decoration: none; }
  a:hover { text-decoration: underline; }
  code {
    background: #eff1f3; border-radius: 5px; padding: .15em .45em;
    font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace; font-size: .875em; color: #cf222e;
  }
  pre {
    background: #f6f8fa; border: 1px solid #e4e8ec; border-radius: 8px;
    padding: 14px 16px; overflow-x: auto; margin: 1em 0; line-height: 1.55;
  }
  pre code { background: none; padding: 0; color: #1f2328; font-size: 13px; }
  blockquote {
    margin: 1em 0; padding: 2px 18px; color: #59636e;
    border-left: 4px solid #d1d9e0; background: #f6f8fa; border-radius: 0 6px 6px 0;
  }
  ul, ol { margin: .6em 0; padding-left: 1.8em; }
  li { margin: .25em 0; }
  li input[type="checkbox"] { margin-right: 8px; }
  hr { border: none; border-top: 1px solid #d1d9e0; margin: 1.6em 0; }
  img { max-width: 100%; border-radius: 6px; }
  table { border-collapse: collapse; margin: 1em 0; min-width: 50%; }
  th, td { border: 1px solid #d1d9e0; padding: 7px 15px; }
  th { background: #f6f8fa; }
  tr:nth-child(even) td { background: #fafbfc; }
  del { color: #8c959f; }
</style>
</head>
<body>
<main class="md-page" id="mdPage"></main>
<script>
{% include "partials/markdown_render.js" %}
  const SRC = {{ content | tojson }};
  const page = document.getElementById("mdPage");
  page.innerHTML = renderMarkdown(SRC);
  const h1 = page.querySelector("h1");   // 用第一个标题做页面标题
  if (h1 && h1.textContent.trim()) document.title = h1.textContent.trim();
</script>
</body>
</html>
