  // ---------- 待执行的移动/复制（全局记录） ----------
  function setPendingOp(mode, paths) {
    pendingOp = { mode: mode, paths: paths };
    document.getElementById("pasteBtn").classList.remove("hidden");
    toast((mode === "move" ? "移动" : "复制") + "已记录 " + paths.length +
      " 项，打开目标文件夹后点击 📋 完成", "info");
  }
  async function executePendingOp() {
    if (!pendingOp) return;
    var isMove = pendingOp.mode === "move";
    var paths = pendingOp.paths.slice();
    var dest = state.path || "/";
    pendingOp = null;
    document.getElementById("pasteBtn").classList.add("hidden");
    if (!paths.length) return;
    var name = paths.length === 1 ? (paths[0].split("/").pop() || "") : (paths.length + " 项");
    bgStart(isMove ? "mv" : "cp", isMove ? "/api/move/start" : "/api/copy/start",
      { paths: paths, dest_dir: dest }, {
      title: (isMove ? "正在移动：" : "正在复制：") + name,
      label: (isMove ? "移动" : "复制"),
      legacy: function () { _legacyMoveCopy(isMove, paths, dest); },
      onDone: function (ok, d) {
        var result = (d && d.result) || {};
        var doneN = result.done != null ? result.done : paths.length;
        if (ok) toast((isMove ? "已移动 " : "已复制 ") + doneN + " 项到当前目录", "success");
        load(state.path);
      }
    });
  }

  // 后端未升级兜底：退回旧的逐文件同步接口
  async function _legacyMoveCopy(isMove, paths, dest) {
    var ok = 0, fail = 0, firstErr = "";
    for (var i = 0; i < paths.length; i++) {
      try {
        var resp = await fetch(isMove ? "/api/move" : "/api/copy", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path: paths[i], dest_dir: dest })
        });
        var d = await resp.json();
        if (d.success || !d.error) ok++;
        else { fail++; if (!firstErr) firstErr = d.error; }
      } catch (e) { fail++; if (!firstErr) firstErr = "网络错误"; }
    }
    if (fail === 0) {
      toast((isMove ? "已移动 " : "已复制 ") + ok + " 项到当前目录", "success");
    } else if (ok === 0 && paths.length === 1) {
      toast((isMove ? "移动失败：" : "复制失败：") + firstErr, "error");
    } else {
      toast((isMove ? "移动" : "复制") + "完成：成功 " + ok + "，失败 " + fail +
        (firstErr ? "（" + firstErr + "）" : ""), "warn");
    }
    load(state.path);
  }
  function cancelPendingOp() {
    if (!pendingOp) return;
    pendingOp = null;
    document.getElementById("pasteBtn").classList.add("hidden");
    toast("已取消待执行的操作", "info");
  }
  document.getElementById("pasteBtn").addEventListener("click", executePendingOp);
  (function () {   // 长按 📋 取消待执行操作
    var btn = document.getElementById("pasteBtn"), t = null;
    btn.addEventListener("touchstart", function () {
      t = setTimeout(function () { t = null; cancelPendingOp(); }, 600);
    }, { passive: true });
    ["touchend", "touchmove"].forEach(function (ev) {
      btn.addEventListener(ev, function () { if (t) { clearTimeout(t); t = null; } });
    });
    btn.addEventListener("contextmenu", function (e) { e.preventDefault(); cancelPendingOp(); });
  })();

  function normDirPath(p) { return (!p || p === "/") ? "/" : p; }
  // 路径编码成 base64url 再放进 hash，地址栏不显示明文路径
  function b64urlEncode(s) {
    var bytes = new TextEncoder().encode(s), bin = "";
    bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64urlDecode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  // 返回 ""(根目录) / 路径 / null(无效 hash)
  function readHashPath() {
    var h = location.hash.replace(/^#\/?/, "");
    if (!h) return "";
    try {
      var p = b64urlDecode(h);
      return (p && p.charAt(0) === "/") ? p : null;
    } catch (e) { return null; }
  }
  // 带超时的 fetch：超时自动中断（AbortError），避免请求卡住一直转圈
  function fetchTimeout(url, ms, opts) {
    ms = ms || 15000;
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms);
    var init = Object.assign({}, opts || {});
    if (ctrl) init.signal = ctrl.signal;
    return fetch(url, init)
      .finally(function () { clearTimeout(timer); });
  }

  // 预览卡片内加载同级文件列表：带超时，失败/超时可重试
  function loadSiblingsInto(listEl, dirAbs, render) {
    function run() {
      listEl.innerHTML = '<div class="pv-vempty">加载中…</div>';
      fetchTimeout("/api/files?path=" + encodeURIComponent(dirAbs) + "&limit=0&offset=0", 10000)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.error) { listEl.innerHTML = '<div class="pv-vempty">' + esc(d.error) + '</div>'; return; }
          render(d.items || []);
        })
        .catch(function (e) {
          var reason = (e && e.name === "AbortError") ? "加载超时" : "列表加载失败";
          listEl.innerHTML = "";
          var tip = document.createElement("div");
          tip.className = "pv-vempty";
          tip.textContent = reason;
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "pv-retry";
          btn.textContent = "↻ 重试";
          btn.addEventListener("click", run);
          tip.appendChild(btn);
          listEl.appendChild(tip);
        });
    }
    run();
  }

  var _loadingPath = null;
  async function load(path, fallbackRoot) {
    if (_loadingPath === (path || "")) return;   // 同一目录正在加载，忽略重复触发
    _loadingPath = path || "";
    exitSelMode();
    showLoading(true);
    try {
      var url = path
        ? "/api/files?path=" + encodeURIComponent(path) + "&limit=0&offset=0"
        : "/api/files?limit=0&offset=0";
      var resp = await fetchTimeout(url, 15000);
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      var data = await resp.json();
      if (data.error) {
        toast(data.error, "error");
        if (fallbackRoot) load("");   // hash 里的目录已不存在，回根目录
        return;
      }
      state.path = data.current_path_abs || "";
      // 同步 URL hash（编码后）：刷新/分享链接可直接回到当前目录，浏览器前进后退也可用
      var wantPath = (state.path && state.path !== "/") ? state.path : "/";
      var curHash = readHashPath();
      if (curHash === null || normDirPath(curHash) !== wantPath) {
        location.hash = wantPath === "/" ? "#/" : "#/" + b64urlEncode(wantPath);
      }
      state.parentPath = data.parent_path || null;
      state.items = data.items || [];
      renderBreadcrumb(state.path);
      renderList();
      renderStats(data.stats);
      startSizePoll(state.path);
      document.getElementById("appTitle").textContent =
        (state.path === "/" || !state.path) ? "根目录" : state.path.split("/").filter(Boolean).pop();
    } catch (e) {
      var msg = (e && e.name === "AbortError")
        ? "加载超时，请点重试或检查网络"
        : "加载失败: " + (e.message || e);
      toast(msg, "error");
    } finally {
      _loadingPath = null;
      showLoading(false);
    }
  }

  function renderStats(stats) {
    if (!stats) return;
    document.getElementById("statCount").textContent =
      (stats.total_dirs || 0) + " 文件夹 · " + (stats.total_files || 0) + " 文件";
    document.getElementById("statSize").textContent = stats.total_size_str || "";
  }

  // ---------- 连接状态指示：定期轻量探测服务器可达性 ----------
  var _connState = "";
  function setConnState(s) {
    if (_connState === s) return;
    _connState = s;
    var dot = document.getElementById("connDot");
    if (!dot) return;
    dot.className = "conn-dot " + s;
    dot.title = s === "on" ? "已连接服务器"
      : (s === "off" ? "无法连接服务器（显示的可能是缓存数据）" : "检测连接…");
  }
  function pingConn() {
    if (!navigator.onLine) { setConnState("off"); return; }
    fetchTimeout("/", 5000, { method: "HEAD" })
      .then(function () { setConnState("on"); })
      .catch(function () { setConnState("off"); });
  }
  window.addEventListener("online", pingConn);
  window.addEventListener("offline", function () { setConnState("off"); });
  setInterval(pingConn, 30000);
  pingConn();

  // ---------- 本地增量更新列表（删除/压缩/解压完成后不重新请求 /api/files，避免大目录超时） ----------
  function nowStrLocal() {
    var d = new Date();
    function p2(n) { return String(n).padStart(2, "0"); }
    return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()) + " " +
      p2(d.getHours()) + ":" + p2(d.getMinutes()) + ":" + p2(d.getSeconds());
  }
  function updateStatsLocal() {
    var dirs = 0, files = 0, total = 0;
    (state.items || []).forEach(function (it) {
      if (it.is_dir) dirs++;
      else files++;
      if (it.size >= 0) total += (it.size || 0);
    });
    renderStats({ total_dirs: dirs, total_files: files, total_size: total, total_size_str: fmtDelBytes(total) });
  }
  function localRemoveItems(paths) {
    if (!state.items || !state.items.length) return false;
    var names = {};
    (paths || []).forEach(function (p) {
      var n = String(p).split("/").filter(Boolean).pop();
      if (n) names[n] = true;
    });
    var before = state.items.length;
    state.items = state.items.filter(function (it) { return !names[it.name]; });
    if (state.items.length === before) return false;
    renderList();
    updateStatsLocal();
    return true;
  }
  function localAddItem(item) {
    if (!state.items) state.items = [];
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].name === item.name) return false;
    }
    state.items.push(item);
    renderList();
    updateStatsLocal();
    return true;
  }

  // ---------- 目录大小后台补齐：有目录在算就轮询，算完自动刷新一次 ----------
  var _sizePollTimer = null, _sizePollPath = null;
  function stopSizePoll() {
    if (_sizePollTimer) { clearInterval(_sizePollTimer); _sizePollTimer = null; }
    _sizePollPath = null;
  }
  function startSizePoll(dir) {
    if (_sizePollTimer && _sizePollPath === dir) return;   // 同目录继续轮
    stopSizePoll();
    if (!state.items.some(function (it) { return it.is_dir && it.size_pending; })) return;
    _sizePollPath = dir;
    _sizePollTimer = setInterval(function () {
      fetchTimeout("/api/size-status?path=" + encodeURIComponent(dir), 10000)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (_sizePollPath !== dir) return;
          // 本地更新已算好的目录大小，不重新请求 /api/files（大目录会超时）
          if (d && d.sizes && state.path === dir) {
            var changed = false;
            state.items.forEach(function (it) {
              if (it.is_dir && Object.prototype.hasOwnProperty.call(d.sizes, it.name)) {
                it.size = d.sizes[it.name];
                it.size_str = fmtDelBytes(it.size);
                it.size_pending = false;
                changed = true;
              }
            });
            if (changed) { renderList(); updateStatsLocal(); }
          }
          if (d.error || !d.pending || !d.pending.length) {
            stopSizePoll();   // 全部算完，本地已更新，不再 load 刷新
          }
        })
        .catch(function () { /* 网络抖动忽略，下轮再试 */ });
    }, 2500);
  }

  function renderBreadcrumb(absPath) {
    var bc = document.getElementById("bcScroll");
    bc.innerHTML = "";
    var parts = (absPath || "/").split("/").filter(Boolean);
    function addCrumb(text, target, current) {
      var c = document.createElement("span");
      c.className = "crumb" + (current ? " current" : "");
      c.textContent = text;
      if (!current && target !== undefined) {
        c.addEventListener("click", function () { load(target); });
      }
      bc.appendChild(c);
      if (!current) {
        var sep = document.createElement("span");
        sep.className = "crumb sep";
        sep.textContent = "/";
        bc.appendChild(sep);
      }
    }
    addCrumb("🏠", "/", false);
    var cum = "";
    for (var i = 0; i < parts.length; i++) {
      cum += "/" + parts[i];
      var isLast = i === parts.length - 1;
      addCrumb(parts[i], isLast ? undefined : cum, isLast);
    }
    bc.scrollLeft = bc.scrollWidth;
  }

  // 智能时间显示：今年省略年份，去年/前年用文字，更早显示完整日期
  function fmtTime(s) {
    if (!s) return "";
    var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/.exec(s);
    if (!m) return s;
    var thisY = new Date().getFullYear();
    var y = +m[1], md = m[2] + "-" + m[3], hm = m[4];
    if (y === thisY) return md + " " + hm;
    if (y === thisY - 1) return "去年 " + md + " " + hm;
    if (y === thisY - 2) return "前年 " + md + " " + hm;
    return s;   // 更早的年份：完整显示
  }

  function renderList() {
    var list = document.getElementById("list");
    list.className = "list body-pad " + (state.view === "grid" ? "grid" : "rows");
    list.innerHTML = "";
    var items = sortItems(state.items);
    if (items.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "空目录";
      list.appendChild(empty);
      return;
    }
    items.forEach(function (item) {
      var row = document.createElement("div");
      row.className = "item";
      var thumbHtml;
      if (canThumb(item)) {
        thumbHtml = '<img loading="lazy" src="/api/thumbnail?path=' +
          encodeURIComponent(itemAbs(item)) + '" alt="" onerror="this.parentNode.textContent=\'' +
          iconFor(item) + '\'">';
      } else {
        thumbHtml = iconHtmlFor(item);
      }
      var sub = item.size_str || "";
      if (item.mtime) sub += (sub ? "  ·  " : "") + fmtTime(item.mtime);
      if (!isDir(item)) sub += "  ·  " + fileTypeName(item);
      // 文件夹：下一级子项计数徽标（文件夹数 · 文件数）
      var cntHtml = "";
      if (isDir(item) && item.n_dirs != null) {
        var cp = [];
        if (item.n_dirs) cp.push("📁" + item.n_dirs);
        if (item.n_files) cp.push("📄" + item.n_files);
        cntHtml = '<span class="cnt">' + (cp.length ? cp.join(" · ") : "空") + '</span>';
      }
      row.innerHTML =
        '<div class="thumb">' + thumbHtml + '</div>' +
        '<div class="meta">' +
          '<div class="name-row"><div class="name">' + esc(item.name) + '</div>' + cntHtml + '</div>' +
          '<div class="gtime">' + esc(fmtTime(item.ctime || "")) + '</div>' +
          '<div class="sub">' + esc(sub) + '</div>' +
        '</div>' +
        // 文件点行即打开操作菜单，无需 ⋯；文件夹保留（点行是进入目录，⋯ 是唯一操作入口）
        (isDir(item) ? '<button class="more" aria-label="更多">⋯</button>' : '');
      var abs = itemAbs(item);
      row.setAttribute("data-abs", abs);
      if (state.selMode) {
        var chk = document.createElement("span");
        chk.className = "sel-check" + (state.selSet[abs] ? " on" : "");
        chk.textContent = "✓";
        row.insertBefore(chk, row.firstChild);
        if (state.selSet[abs]) row.classList.add("sel-on");
        var moreBtn = row.querySelector(".more");
        if (moreBtn) moreBtn.style.display = "none";
        row.addEventListener("click", function () {
          if (lpFired) { lpFired = false; return; }
          toggleSel(abs);
        });
      } else {
        row.addEventListener("click", function () {
          if (lpFired) { lpFired = false; return; }
          if (isDir(item)) load(itemAbs(item));
          else openActions(item);
        });
        var moreBtn2 = row.querySelector(".more");
        if (moreBtn2) moreBtn2.addEventListener("click", function (e) {
          e.stopPropagation();
          openActions(item);
        });
        // 文件：点缩略图图标直接预览（点行其余部分仍是操作菜单）
        if (!isDir(item)) {
          var th = row.querySelector(".thumb");
          if (th) th.addEventListener("click", function (e) {
            e.stopPropagation();
            if (lpFired) { lpFired = false; return; }
            openPreview(item);
          });
        }
        bindLongPress(row, function () { enterSelMode(); toggleSel(itemAbs(item)); });
      }
      list.appendChild(row);
    });
  }

  // ---------- 排序 ----------
  var SORT_DEFS = [
    { mode: "name", ico: "🔤", label: "按名称" },
    { mode: "type", ico: "🗂️", label: "按类型" },
    { mode: "size", ico: "📦", label: "按大小" },
    { mode: "time", ico: "🕐", label: "按时间" }
  ];
  function cmpName(a, b) {
    return String(a.name).localeCompare(String(b.name), "zh-Hans-CN");
  }
  function sortItems(src) {
    var m = state.sort.mode, d = state.sort.dir;
    return src.slice().sort(function (a, b) {
      if (!!a.is_dir !== !!b.is_dir) return a.is_dir ? -1 : 1;   // 文件夹始终在前
      var r = 0;
      if (m === "name") r = cmpName(a, b);
      else if (m === "type") {
        r = String(a.ext || "").localeCompare(String(b.ext || ""), "zh-Hans-CN");
        if (!r) r = String(a.type || "").localeCompare(String(b.type || ""), "zh-Hans-CN");
      }
      else if (m === "size") r = (Number(a.size) || 0) - (Number(b.size) || 0);
      else if (m === "time") r = String(a.mtime || "").localeCompare(String(b.mtime || ""));
      if (!r) r = cmpName(a, b);
      return r * d;
    });
  }
  function openSortSheet() {
    var head = document.getElementById("sheetHead");
    var btns = document.getElementById("sheetBtns");
    head.textContent = "排序方式";
    btns.innerHTML = "";
    SORT_DEFS.forEach(function (def) {
      var active = state.sort.mode === def.mode;
      var arrow = active ? (state.sort.dir === 1 ? " ↑" : " ↓") : "";
      var b = document.createElement("button");
      b.className = "sheet-btn";
      b.innerHTML = '<span class="ico">' + (active ? "✅" : def.ico) + '</span><span>' +
        def.label + arrow + '</span>';
      b.addEventListener("click", function () {
        // 同一项再点 = 切换升降序；不同项 = 切换方式（大小/时间默认降序：大的/新的在前）
        if (state.sort.mode === def.mode) state.sort.dir = -state.sort.dir;
        else {
          state.sort.mode = def.mode;
          state.sort.dir = (def.mode === "size" || def.mode === "time") ? -1 : 1;
        }
        spLsSet(SORT_KEY, state.sort);
        renderList();
        openSortSheet();   // 刷新 ✓/箭头，弹层保持打开方便连续调整
      });

    document.getElementById("sheet").classList.add("show");
  }

  // ---------- 操作弹窗 ----------

  // ---------- 预览 ----------
  function openPreview(item, contextItems) {
    var ext = extOf(item.name);
    var abs = itemAbs(item);
    // 音频走独立播放器，不占用预览遮罩（避免遮罩停留在“加载中…”）
    if (AUDIO_EXT.indexOf(ext) >= 0) {
      openAudioPlayer(item, contextItems);
      return;
    }
    var mask = document.getElementById("previewMask");
    var body = document.getElementById("previewBody");
    body.innerHTML = '<div class="preview-msg">加载中…</div>';
    document.getElementById("previewClose").style.display = "";
    mask.classList.add("show");

    if (VIDEO_EXT.indexOf(ext) >= 0) {
      buildVideoPreview(item, abs, contextItems);
      return;
    }
    if (MOBILE_IMG_EXT.indexOf(ext) >= 0) {
      buildImagePreview(item, abs);
      return;
    }
    if (TEXT_EXT.indexOf(ext) >= 0) {
      fetchTimeout("/api/preview?path=" + encodeURIComponent(abs), 15000)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.error) { body.innerHTML = '<div class="preview-msg">' + esc(d.error) + '</div>'; return; }
          var bin = atob(d.content);
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          var text = new TextDecoder("utf-8").decode(bytes);
          buildTextPreview(item, text);
        })
        .catch(function (e) {
          var msg = (e && e.name === "AbortError") ? "加载超时" : (e.message || e);
          body.innerHTML = '<div class="preview-msg">预览失败: ' + esc(msg) + '</div>';
        });
      return;
    }
    // 压缩包：直接打开压缩包查看器（浏览/解压/下载包内文件）
    if (ext === "zip" || ext === "rar") {
      mask.classList.remove("show");
      body.innerHTML = "";
      openZipViewer(item);
      return;
    }
    body.innerHTML = '<div class="preview-msg">暂不支持预览该类型<br/>（移动版仅支持 图片 / 视频 / 文本 / 压缩包）</div>';
  }
  // 视频预览卡片：文件名 + 播放器 + 视频列表（可切换）
  // 列表来源优先级：外部上下文（如搜索结果命中的视频）> 同级目录视频
  function buildVideoPreview(item, abs, contextItems) {
    var body = document.getElementById("previewBody");
    var card = document.createElement("div");
    card.className = "pv-card";
    card.innerHTML =
      '<div class="pv-head">' +
        '<span class="pv-title">' + esc(item.name) + '</span>' +
        '<button type="button" class="pv-new" data-op="newplayer" title="在新版播放器中打开">✨ 新版播放器</button>' +
        '<button type="button" class="pv-close" data-op="close">✕</button>' +
      '</div>' +
      '<div class="pv-vidarea"><video controls playsinline src="/api/stream?path=' +
        encodeURIComponent(abs) + '"></video></div>' +
      '<div class="pv-vlist"><div class="pv-vload">加载同级视频…</div></div>';
    body.innerHTML = "";
    body.appendChild(card);
    document.getElementById("previewClose").style.display = "none";

    var title = card.querySelector(".pv-title");
    var video = card.querySelector("video");
    var listEl = card.querySelector(".pv-vlist");
    var dirAbs = abs.slice(0, abs.lastIndexOf("/")) || "/";
    var curVids = [], curIdx = 0;      // 传给新版播放器的列表与当前项

    function renderVlist(items) {
      var vids = (items || []).filter(function (it) {
        return !isDir(it) && VIDEO_EXT.indexOf(extOf(it.name)) >= 0;
      });
      if (!vids.length) {
        listEl.innerHTML = '<div class="pv-vempty">当前文件夹没有其他视频</div>';
        return;
      }
      listEl.innerHTML = "";
      // 同步给新版播放器用的列表（含当前项下标）
      curVids = vids.map(function (it) { return { name: it.name, abs: it.abs_path || joinPath(dirAbs, it.name) }; });
      curIdx = 0;
      curVids.forEach(function (v, k) { if (v.name === item.name) curIdx = k; });
      vids.forEach(function (it, vi) {
        var p = it.abs_path || joinPath(dirAbs, it.name);
        var row = document.createElement("div");
        row.className = "pv-vitem" + (it.name === item.name ? " cur" : "");
        // 封面：后端抽帧缩略图，失败显示 🎬 占位
        var img = document.createElement("img");
        img.loading = "lazy";
        img.src = "/api/thumbnail?path=" + encodeURIComponent(p);
        img.onerror = function () { img.style.display = "none"; row.classList.add("noimg"); };
        var nm = document.createElement("span");
        nm.className = "pv-vname"; nm.textContent = it.name; nm.title = it.name;
        var sz = document.createElement("span");
        sz.className = "pv-vsize"; sz.textContent = it.size_str || "";
        row.appendChild(img); row.appendChild(nm);
        if (it.size_str) row.appendChild(sz);
        row.addEventListener("click", function () {
          video.src = "/api/stream?path=" + encodeURIComponent(p);
          var pp = video.play(); if (pp && pp.catch) pp.catch(function () {});
          title.textContent = it.name;
          curIdx = vi;                 // 新版播放器要从这里继续
          Array.prototype.forEach.call(listEl.children, function (n) { n.classList.remove("cur"); });
          row.classList.add("cur");
          try { row.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" }); } catch (e) {}
        });
        listEl.appendChild(row);
      });
      // 当前播放项初始滚动到可视区
      var cur = listEl.querySelector(".pv-vitem.cur");
      if (cur) try { cur.scrollIntoView({ block: "nearest", inline: "center" }); } catch (e) {}
    }

    // 优先使用外部上下文（如搜索结果）中的视频作为播放列表（排除当前项后至少 1 个才有意义）
    var ctxVids = (contextItems || []).filter(function (it) {
      return !isDir(it) && VIDEO_EXT.indexOf(extOf(it.name)) >= 0;
    });
    if (ctxVids.length > 1) {
      renderVlist(ctxVids);
    } else if (normDirPath(dirAbs) === normDirPath(state.path) && state.items && state.items.length) {
      renderVlist(state.items);
    } else {
      loadSiblingsInto(listEl, dirAbs, renderVlist);
    }

    card.querySelector('[data-op="close"]').addEventListener("click", function () {
      video.pause();
      var mask = document.getElementById("previewMask");
      mask.classList.remove("show");
      document.getElementById("previewBody").innerHTML = "";
      document.getElementById("previewClose").style.display = "";
    });
    // 前往新版播放器（暂停旧播放器，避免两个声音叠加）
    card.querySelector('[data-op="newplayer"]').addEventListener("click", function () {
      video.pause();
      openVPlayer(curVids.length ? curVids : [{ name: item.name, abs: abs }], curIdx);
    });
  }
  // 图片预览卡片：文件名 + 可缩放看图区（双指捏合/双击/滚轮）+ 同级图片列表
  function buildImagePreview(item, abs) {
    var body = document.getElementById("previewBody");
    var card = document.createElement("div");
    card.className = "pv-card";
    card.innerHTML =
      '<div class="pv-head">' +
        '<span class="pv-title">' + esc(item.name) + '</span>' +
        '<button type="button" class="pv-close" data-op="close">✕</button>' +
      '</div>' +
      '<div class="pv-imgarea"><img class="pv-img" draggable="false" alt="' + esc(item.name) + '"></div>' +
      '<div class="pv-vlist"><div class="pv-vload">加载图片…</div></div>';
    body.innerHTML = "";
    body.appendChild(card);
    document.getElementById("previewClose").style.display = "none";

    var title = card.querySelector(".pv-title");
    var img = card.querySelector("img");
    var area = card.querySelector(".pv-imgarea");
    var listEl = card.querySelector(".pv-vlist");
    var dirAbs = abs.slice(0, abs.lastIndexOf("/")) || "/";

    // ===== 缩放 / 拖动（transform: translate + scale，1x~8x），未放大时横滑切图 =====
    var scale = 1, tx = 0, ty = 0, MIN_S = 1, MAX_S = 8, imgToken = 0;
    var imgList = [];      // 同级图片顺序表 [{path, name}]，供左右滑动切换
    var curPath = "";
    function apply(anim) {
      img.classList.toggle("anim", !!anim);
      img.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
    }
    // 把平移量夹在合法范围内：放大后不能拖出边界，未占满时保持居中
    function clampT() {
      var aw = area.clientWidth, ah = area.clientHeight;
      var iw = img.clientWidth * scale, ih = img.clientHeight * scale;
      var ox = (aw - img.clientWidth) / 2, oy = (ah - img.clientHeight) / 2;
      if (iw <= aw) tx = (aw - iw) / 2 - ox;
      else tx = Math.max(aw - iw - ox, Math.min(-ox, tx));
      if (ih <= ah) ty = (ah - ih) / 2 - oy;
      else ty = Math.max(ah - ih - oy, Math.min(-oy, ty));
    }
    function resetZoom() {
      scale = 1; tx = 0; ty = 0; apply(true);
    }
    // 围绕某点缩放到 s（保持该点下的图像位置不动）
    function zoomAt(mx, my, s, anim) {
      var k = s / scale;
      tx = mx - (mx - tx) * k;
      ty = my - (my - ty) * k;
      scale = s;
      clampT(); apply(anim);
    }
    function dblTap(cx, cy) {
      var rect = area.getBoundingClientRect();
      if (scale > 1.02) resetZoom();
      else zoomAt(cx - rect.left, cy - rect.top, 2.5, true);
    }

    var pinch = null, pan = null, lastTap = 0, lastTapX = 0, lastTapY = 0;
    function tdist(t) {
      var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
      return Math.sqrt(dx * dx + dy * dy) || 1;
    }
    area.addEventListener("touchstart", function (e) {
      if (e.touches.length === 2) {
        var rect = area.getBoundingClientRect(), t = e.touches;
        pinch = {
          d0: tdist(t), s0: scale, tx0: tx, ty0: ty,
          mx: (t[0].clientX + t[1].clientX) / 2 - rect.left,
          my: (t[0].clientY + t[1].clientY) / 2 - rect.top,
        };
        pan = null;
      } else if (e.touches.length === 1) {
        pinch = null;
        var now = Date.now();
        // 双击：300ms 内二次点按
        if (now - lastTap < 300 &&
            Math.abs(e.touches[0].clientX - lastTapX) < 40 &&
            Math.abs(e.touches[0].clientY - lastTapY) < 40) {
          lastTap = 0;
          dblTap(e.touches[0].clientX, e.touches[0].clientY);
          pan = null;
          return;
        }
        lastTap = now; lastTapX = e.touches[0].clientX; lastTapY = e.touches[0].clientY;
        pan = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx: tx, ty: ty, t0: Date.now() };
      }
    }, { passive: false });
    area.addEventListener("touchmove", function (e) {
      e.preventDefault();   // 阻止页面滚动/浏览器默认缩放
      if (pinch && e.touches.length === 2) {
        var rect = area.getBoundingClientRect();
        var s = Math.min(MAX_S, Math.max(MIN_S, pinch.s0 * tdist(e.touches) / pinch.d0));
        var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
        var my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
        var k = s / pinch.s0;
        tx = mx - (mx - pinch.tx0) * k;
        ty = my - (my - pinch.ty0) * k;
        scale = s;
        clampT(); apply(false);
      } else if (pan && e.touches.length === 1) {
        var dx = e.touches[0].clientX - pan.x;
        if (scale > 1.02) {
          tx = pan.tx + dx;
          ty = pan.ty + (e.touches[0].clientY - pan.y);
          clampT(); apply(false);
        } else {
          // 未放大：横向跟手滑动，松手按距离/速度切上一张或下一张
          tx = pan.tx + dx; ty = 0;
          apply(false);
        }
      }
    }, { passive: false });
    area.addEventListener("touchend", function (e) {
      if (e.touches.length < 2) pinch = null;
      if (e.touches.length === 0) {
        if (scale > 1.02) {
          clampT(); apply(true);
        } else {
          var dx = tx;
          var fast = pan && (Date.now() - pan.t0) < 250 && Math.abs(dx) > 40;
          if (Math.abs(dx) > area.clientWidth * 0.25 || fast) {
            if (!step(dx < 0 ? 1 : -1)) resetZoom();
          } else {
            resetZoom();
          }
        }
        pan = null;
      }
    });
    area.addEventListener("touchcancel", function () {
      pinch = null; pan = null;
      if (scale <= 1.02) resetZoom(); else { clampT(); apply(true); }
    });
    // 桌面端：滚轮缩放
    area.addEventListener("wheel", function (e) {
      e.preventDefault();
      var rect = area.getBoundingClientRect();
      var s = Math.min(MAX_S, Math.max(MIN_S, scale * (e.deltaY < 0 ? 1.2 : 1 / 1.2)));
      zoomAt(e.clientX - rect.left, e.clientY - rect.top, s, false);
      if (scale <= 1.001) resetZoom();
    }, { passive: false });

    // 同步底部列表高亮并滚动到可视位置
    function markCur(path) {
      Array.prototype.forEach.call(listEl.children, function (n) {
        if (n.classList && n.classList.contains("pv-vitem")) {
          n.classList.toggle("cur", n.getAttribute("data-path") === path);
        }
      });
      var cur = listEl.querySelector(".pv-vitem.cur");
      if (cur) try { cur.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" }); } catch (e) {}
    }
    // 左右切换：dir=1 下一张，-1 上一张；返回 false 表示已到头
    function step(dir) {
      var idx = -1, i;
      for (i = 0; i < imgList.length; i++) {
        if (imgList[i].path === curPath) { idx = i; break; }
      }
      if (idx < 0) return false;
      var n = idx + dir;
      if (n < 0 || n >= imgList.length) return false;
      var it = imgList[n];
      // 当前图滑出，新图从对侧滑入
      tx = -dir * area.clientWidth; ty = 0; apply(true);
      setTimeout(function () {
        setImg(it.path, it.name);                       // 换图并复位（带动画从当前位移回 0）
        tx = dir * area.clientWidth; ty = 0; apply(false);   // 瞬移到进入侧
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { resetZoom(); });  // 滑入
        });
      }, 180);
      return true;
    }

    // ===== 图片加载：先缩略图快速显示，原图（/api/raw）就绪后无缝替换 =====
    function setImg(path, name) {
      var tk = ++imgToken;
      curPath = path;
      resetZoom();
      img.src = "/api/thumbnail?path=" + encodeURIComponent(path);
      var hi = new Image();
      hi.onload = function () { if (tk === imgToken) img.src = hi.src; };
      hi.onerror = function () { /* 原图失败则保留缩略图 */ };
      hi.src = "/api/raw?path=" + encodeURIComponent(path);
      title.textContent = name;
      markCur(path);
    }

    function renderImgs(items) {
      var imgs = (items || []).filter(function (it) {
        return !isDir(it) && MOBILE_IMG_EXT.indexOf(extOf(it.name)) >= 0;
      });
      imgList = imgs.map(function (it) {
        return { path: it.abs_path || joinPath(dirAbs, it.name), name: it.name };
      });
      if (!imgs.length) {
        listEl.innerHTML = '<div class="pv-vempty">当前文件夹没有其他图片</div>';
        return;
      }
      listEl.innerHTML = "";
      imgList.forEach(function (it) {
        var row = document.createElement("div");
        row.className = "pv-vitem img" + (it.path === curPath ? " cur" : "");
        row.setAttribute("data-path", it.path);
        var t = document.createElement("img");
        t.loading = "lazy";
        t.src = "/api/thumbnail?path=" + encodeURIComponent(it.path);
        t.onerror = function () { t.style.display = "none"; row.classList.add("noimg"); };
        var nm = document.createElement("span");
        nm.className = "pv-vname"; nm.textContent = it.name; nm.title = it.name;
        row.appendChild(t); row.appendChild(nm);
        row.addEventListener("click", function () { setImg(it.path, it.name); });
        listEl.appendChild(row);
      });
      markCur(curPath);
    }

    setImg(abs, item.name);

    if (normDirPath(dirAbs) === normDirPath(state.path) && state.items && state.items.length) {
      renderImgs(state.items);
    } else {
      loadSiblingsInto(listEl, dirAbs, renderImgs);
    }

    card.querySelector('[data-op="close"]').addEventListener("click", function () {
      var mask = document.getElementById("previewMask");
      mask.classList.remove("show");
      document.getElementById("previewBody").innerHTML = "";
      document.getElementById("previewClose").style.display = "";
    });
  }
  // 文本预览卡片：文件名 + 操作栏（含搜索）+ 带行号的内容区
  function buildTextPreview(item, text) {
    var body = document.getElementById("previewBody");
    var card = document.createElement("div");
    card.className = "pv-card";
    card.innerHTML =
      '<div class="pv-head">' +
        '<span class="pv-title">' + esc(item.name) + '</span>' +
        '<span class="pv-badge">未修改</span>' +
        '<button type="button" class="pv-close" data-op="close">✕</button>' +
      '</div>' +
      '<div class="pv-meta"></div>' +
      '<div class="pv-ops">' +
        '<button type="button" data-op="copy">📋 复制</button>' +
        '<button type="button" data-op="wrap">↩️ 换行</button>' +

    var pre = document.createElement("pre");

    // ---- 关键字搜索 / 高亮 ----
    var sbar = card.querySelector(".pv-search");

    var hits = [], hitIdx = -1, dirty = [], debounceT = null;

    function escHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function clearHits() {
      for (var k = 0; k < dirty.length; k++) contentSpans[dirty[k]].textContent = lines[dirty[k]];
      dirty = []; hits = []; hitIdx = -1; sCount.textContent = "";
    }
    function doSearch() {
      if (editing) { doSearchEdit(); return; }
      clearHits();
      var q = sInput.value;
      if (!q) return;
      var lq = q.toLowerCase();
      for (var i = 0; i < lines.length; i++) {
        var ll = lines[i].toLowerCase();
        if (ll.indexOf(lq) < 0) continue;
        var html = "", pos = 0, idx;
        while ((idx = ll.indexOf(lq, pos)) >= 0) {
          html += escHtml(lines[i].slice(pos, idx)) +
                  "<mark class='pv-hit'>" + escHtml(lines[i].slice(idx, idx + q.length)) + "</mark>";
          pos = idx + q.length;
        }
        html += escHtml(lines[i].slice(pos));
        contentSpans[i].innerHTML = html;
        dirty.push(i);
      }
      hits = Array.prototype.slice.call(pre.querySelectorAll("mark.pv-hit"));
      if (hits.length) goHit(0); else sCount.textContent = "无匹配";
    }
    function goHit(n) {
      if (!hits.length) return;
      if (hitIdx >= 0 && hits[hitIdx]) hits[hitIdx].classList.remove("cur");
      hitIdx = (n % hits.length + hits.length) % hits.length;

    // 编辑模式搜索：定位匹配处并选中

      editHits = []; editHitIdx = -1;

      var lv = ta.value.toLowerCase(), lq = q.toLowerCase();
      var idx = lv.indexOf(lq);
      while (idx >= 0) { editHits.push(idx); idx = lv.indexOf(lq, idx + q.length); }
      if (!editHits.length) { sCount.textContent = "无匹配"; return; }

  // ---------- 下载（流式接口 + 实时进度） ----------
  var _dlCtrl = null;

  function showDlProgress(name) {
    document.getElementById("dlProgTitle").textContent = "正在下载 " + (name || "");
    document.getElementById("dlProgBar").className = "delprog-bar indet";
    document.getElementById("dlProgBar").style.width = "";
    document.getElementById("dlProgBytes").textContent = "连接中…";
    document.getElementById("dlProgSpeed").textContent = "";
    document.getElementById("dlProgBox").classList.add("show");
  }
  function hideDlProgress() {
    document.getElementById("dlProgBox").classList.remove("show");
    _dlCtrl = null;
  }
  function updateDlProgress(got, total, speed) {
    var bar = document.getElementById("dlProgBar");
    if (total > 0) {
      bar.classList.remove("indet");
      bar.style.width = Math.min(100, got / total * 100).toFixed(1) + "%";
    } else {
      bar.classList.add("indet");
    }
    document.getElementById("dlProgBytes").textContent =
      fmtDelBytes(got) + (total > 0 ? " / " + fmtDelBytes(total) : "");
    document.getElementById("dlProgSpeed").textContent = speed || "";
  }
  function saveDlBlob(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
  }
  function download(item) {
    var abs = itemAbs(item);
    showDlProgress(item.name);
    _dlCtrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    fetch("/api/download?path=" + encodeURIComponent(abs),
          _dlCtrl ? { signal: _dlCtrl.signal } : {})
      .then(function (r) {
        if (!r.ok) {
          return r.json().catch(function () { return {}; }).then(function (d) {
            throw new Error(d.error || ("HTTP " + r.status));
          });
        }
        var total = parseInt(r.headers.get("Content-Length") || "0", 10) || 0;
        // 老浏览器无流式接口：整体 blob 后保存
        if (!r.body || !r.body.getReader) {
          return r.blob().then(function (b) {
            saveDlBlob(b, item.name); hideDlProgress(); toast("下载完成", "success");
          });
        }
        // 超大文件（>1GB）避免占满内存：转系统直链下载
        if (total > 1024 * 1024 * 1024) {
          hideDlProgress();
          toast("文件较大，已转系统下载", "warn");
          var a = document.createElement("a");
          a.href = "/api/download?path=" + encodeURIComponent(abs);
          a.download = item.name;
          document.body.appendChild(a); a.click(); a.remove();
          return;
        }
        var reader = r.body.getReader();
        var chunks = [], got = 0, lastT = Date.now(), lastB = 0, speed = "";
        function pump() {
          return reader.read().then(function (res) {
            if (res.done) {
              var type = r.headers.get("Content-Type") || "application/octet-stream";
              saveDlBlob(new Blob(chunks, { type: type }), item.name);
              hideDlProgress();
              toast("下载完成", "success");
              return;
            }
            chunks.push(res.value);
            got += res.value.length;
            var now = Date.now();
            if (now - lastT >= 500) {
              speed = fmtDelBytes((got - lastB) * 1000 / (now - lastT)) + "/s";
              lastT = now; lastB = got;
            }
            updateDlProgress(got, total, speed);
            return pump();
          });
        }
        return pump();
      })
      .catch(function (e) {
        hideDlProgress();
        toast((e && e.name === "AbortError") ? "已取消下载"
              : ("下载失败：" + ((e && e.message) || "")), "error");
      });
  }
  document.getElementById("dlProgCancel").addEventListener("click", function () {
    if (_dlCtrl) _dlCtrl.abort();
    hideDlProgress();
  });

  // ---------- 删除 ----------
  function doDelete(item) {

      title: "删除确认",
      message: "确定删除 “" + item.name + "” 吗？删除后可在回收站找回。",

      onOk: function () { doDeleteConfirmed(item); }
    });

  function doDeleteConfirmed(item) {

  }

  // ---------- 后台任务通用进度（删除 / 解压 等，可挂后台胶囊） ----------
  var _bgTasks = {};      // key -> {kind, timer, onDone, title, last, progUrl}
  var _activeBg = null;
  var _bgSeq = 0;

  function fmtDelBytes(n) {
    if (!n) return "0 B";
    var u = ["B", "KB", "MB", "GB", "TB"], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return n.toFixed(n >= 100 || i === 0 ? 0 : 1) + " " + u[i];
  }
  function bgIco(kind) { return kind === "uz" ? "📂" : (kind === "zip" ? "📦" : (kind === "mv" ? "↔️" : (kind === "cp" ? "📄" : "🗑️"))); }
  function bgUpdateModal(d) {
    document.getElementById("delProgBar").style.width = (d.percent || 0) + "%";
    document.getElementById("delProgFiles").textContent =
      d.done_files + " / " + d.total_files + " 个文件";
    document.getElementById("delProgBytes").textContent =
      fmtDelBytes(d.done_bytes) + " / " + fmtDelBytes(d.total_bytes);
    document.getElementById("delProgCur").textContent = d.current || "";
  }
  function bgOpenModal(key) {
    _activeBg = key;
    var t = _bgTasks[key];
    document.getElementById("delProgTitle").textContent = (t && t.title) || "处理中…";
    if (t && t.last) bgUpdateModal(t.last);
    else {
      document.getElementById("delProgBar").style.width = "0%";
      document.getElementById("delProgFiles").textContent = "准备中…";
      document.getElementById("delProgBytes").textContent = "";
      document.getElementById("delProgCur").textContent = "";
    }
    document.getElementById("delProgBox").classList.add("show");
    bgRenderDock();
  }
  function bgCloseModal() {  // 仅收起弹窗，任务继续在后台跑
    document.getElementById("delProgBox").classList.remove("show");
    _activeBg = null;
    bgRenderDock();
  }
  function bgRenderDock() {
    var dock = document.getElementById("delTaskDock");
    var ids = Object.keys(_bgTasks);
    if (!ids.length) { dock.classList.remove("show"); dock.innerHTML = ""; return; }
    dock.classList.add("show");
    dock.innerHTML = ids.map(function (id) {
      var t = _bgTasks[id], d = t.last;
      var txt = d ? (Math.round(d.percent || 0) + "% · " + fmtDelBytes(d.done_bytes) +
        (d.total_bytes ? " / " + fmtDelBytes(d.total_bytes) : "")) : "准备中…";
      var fin = d && d.status !== "running";
      return '<div class="del-task' + (fin ? " done" : "") + '" data-task="' + id + '">' +
        '<span>' + bgIco(t.kind) + '</span><span class="dt-txt">' + esc(txt) + '</span></div>';
    }).join("");
  }
  document.getElementById("delTaskDock").addEventListener("click", function (e) {
    var el = e.target.closest && e.target.closest(".del-task");
    if (el && _bgTasks[el.getAttribute("data-task")]) bgOpenModal(el.getAttribute("data-task"));
  });
  document.getElementById("delProgMin").addEventListener("click", bgCloseModal);

  function bgFinish(key, d) {
    var t = _bgTasks[key];
    if (!t) return;
    clearInterval(t.timer);
    if (t.es) { try { t.es.close(); } catch (e) {} t.es = null; }
    delete _bgTasks[key];
    if (_activeBg === key) bgCloseModal();
    else bgRenderDock();
    var errs = (d.errors || []).concat((d.result && d.result.errors) || []);
    var _lbl = t.kind === "uz" ? "解压" : (t.kind === "zip" ? "压缩" : (t.kind === "mv" ? "移动" : (t.kind === "cp" ? "复制" : "删除")));
    if (errs.length) toast(_lbl + "失败：" + errs[0], "error");
    if (t.onDone) t.onDone(!errs.length, d);
  }
  function bgPollApply(key, d) {
    var tt = _bgTasks[key];
    if (!tt) return;
    if (d.error) { bgFinish(key, { errors: [d.error] }); return; }
    tt.last = d;
    if (_activeBg === key) bgUpdateModal(d);
    else bgRenderDock();
    if (d.status !== "running") bgFinish(key, d);
  }
  function bgPollFallback(key) {   // SSE 不可用时回退到 400ms 轮询
    var t = _bgTasks[key];
    if (!t) return;
    t.timer = setInterval(function () {
      fetchTimeout(t.progUrl, 8000).then(function (r) { return r.json(); })
        .then(function (d) { bgPollApply(key, d); })
        .catch(function () { /* 单次轮询失败继续下一轮 */ });
    }, 400);
  }
  function bgPoll(key) {
    var t = _bgTasks[key];
    if (!t) return;
    // 优先走 SSE 流式进度：一个长连接收完整个任务生命周期，不再几百次轮询
    if (typeof EventSource !== "undefined") {
      var es = new EventSource("/api/progress/stream?task_id=" + encodeURIComponent(t.taskId));
      t.es = es;
      es.onmessage = function (ev) {
        var d;
        try { d = JSON.parse(ev.data); } catch (e) { return; }
        bgPollApply(key, d);
      };
      es.onerror = function () {
        var tt = _bgTasks[key];
        if (!tt || tt.es !== es) return;   // 已被结束/替换
        es.close(); tt.es = null;
        if (tt.last && tt.last.status !== "running") return;   // 已收尾，无需回退
        bgPollFallback(key);   // 流断开/后端未升级 → 回退轮询
      };
      return;
    }
    bgPollFallback(key);
  }
  function bgStart(kind, startUrl, payload, opts) {
    opts = opts || {};
    if (_activeBg && _bgTasks[_activeBg]) _activeBg = null;  // 旧任务转入后台胶囊
    _bgSeq++;
    var ph = "pending" + _bgSeq;
    _bgTasks[ph] = {
      kind: kind, timer: null, onDone: opts.onDone,
      title: opts.title || "处理中…", last: null, progUrl: ""
    };
    bgOpenModal(ph);
    fetchTimeout(startUrl, 15000, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (r) {
        if (r.status === 404) throw new Error("no-api");  // 后端未重启升级 → 旧接口兜底
        return r.json();
      })
      .then(function (d) {
        var t = _bgTasks[ph];
        if (!t) return;
        if (d.error) {
          delete _bgTasks[ph]; bgCloseModal();
          toast(d.error, "error");
          if (opts.onDone) opts.onDone(false, d);
          return;
        }
        var key = kind + ":" + d.task_id;
        _bgTasks[key] = t;
        delete _bgTasks[ph];
        t.taskId = d.task_id;
        var progPath = kind === "uz" ? "zip/unzip" : (kind === "zip" ? "zip/create" : (kind === "mv" ? "move" : (kind === "cp" ? "copy" : "delete")));
        t.progUrl = "/api/" + progPath + "/progress?task_id=" + encodeURIComponent(d.task_id);
        if (_activeBg === ph) _activeBg = key;
        bgPoll(key);
        bgRenderDock();
      })
      .catch(function (er) {
        var t = _bgTasks[ph];
        if (er && er.message === "no-api") {   // 旧接口兜底（无进度条）
          delete _bgTasks[ph]; bgCloseModal();
          if (opts.legacy) opts.legacy();
          return;
        }
        delete _bgTasks[ph]; bgCloseModal();
        toast((er && er.name === "AbortError") ? "请求超时" : (opts.label || "操作") + "请求失败", "error");
        if (opts.onDone) opts.onDone(false);
      });
  }

  // ---------- 复制到剪贴板 ----------
  function copyText(text, okMsg) {
    var done = function () { toast(okMsg || "已复制", "success"); };
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast("复制失败", "error"); }
      if (ta.parentNode) ta.parentNode.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else fallback();
  }

  // ---------- 压缩为 ZIP ----------
  function doCompress(item) {
    var abs = itemAbs(item);
    var destDir = dirnameOf(abs);
    // 默认压缩包名：条目名_日期时间（精确到秒）
    var d = new Date();
    var ts = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")
      + "_" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + String(d.getSeconds()).padStart(2, "0");
    showDialog("压缩为 ZIP（存于 " + destDir + "）", (item.name || "压缩包") + "_" + ts, function (name) {
      name = (name || "").trim();
      if (!name) { toast("请输入压缩包名称", "warn"); return; }
      // 走后台任务进度（同解压），可挂后台胶囊显示挂载状态
      bgStart("zip", "/api/zip/create/start", { paths: [abs], dest_dir: destDir, name: name }, {
        title: "正在压缩…",
        label: "压缩",
        onDone: function (ok, dd) {
          if (ok && dd && dd.result) {
            toast("已生成 " + dd.result.name + (dd.result.size_str ? "（" + dd.result.size_str + "）" : ""), "success");
          }
          // 本地插入新 zip 条目，不重新请求 /api/files（大目录会超时）
          if (ok && dd && dd.result && normDirPath(dirnameOf(abs)) === normDirPath(state.path)) {
            localAddItem({ name: dd.result.name, path: dd.result.name, abs_path: dd.result.path,
              is_dir: false, size: dd.result.size || 0,
              size_str: dd.result.size_str || fmtDelBytes(dd.result.size || 0),
              ext: "zip", type: "ZIP", mtime: nowStrLocal() });
          }
        },
        legacy: function () { legacyZipCreate([abs], destDir, name); }
      });
    });
  }

  var _zipAbs = "", _zipName = "", _zipDir = "", _zipView = "list", _zipMeta = null;

  var _zipOuter = "", _zipNestedEntry = "", _zipOuterName = "";   // 嵌套压缩包：外层包 + 成员路径

  // 从嵌套包退回外层包刚才所在的目录
  function backToOuterZip() {
    _zipAbs = _zipOuter;
    _zipName = _zipOuterName || _zipName;
    var dir = _zipOuterDir || "";
    _zipPwd = _zipOuterPwd || "";

  function zipPwdQ() { return _zipPwd ? "&pwd=" + encodeURIComponent(_zipPwd) : ""; }
  function askZipPwd(then) {                      // 输入密码后回调
    showDialog("输入压缩包密码", "", function (v) {
      _zipPwd = (v || "").trim();
      then();
    });
  }
  function closeZipViewer() {
    document.getElementById("zipPage").classList.remove("show");
    _zipAbs = ""; _zipDir = ""; _zipView = "list";
    _zipOuter = ""; _zipNestedEntry = ""; _zipOuterName = ""; _zipOuterDir = ""; _zipOuterPwd = "";
  }
  function zipEntryPath(name) { return _zipDir ? _zipDir + "/" + name : name; }
  function fmtZipSize(n) {
    if (n == null) return "";
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    if (n < 1073741824) return (n / 1048576).toFixed(2) + " MB";
    return (n / 1073741824).toFixed(2) + " GB";
  }
  function loadZipDir(dir) {
    _zipDir = dir; _zipView = "list";
    var body = document.getElementById("zpBody");
    body.innerHTML = '<div class="empty">加载中…</div>';
    renderZipCrumb();
    var url = _zipOuter
      ? "/api/zip/nested?zip_path=" + encodeURIComponent(_zipOuter) +
        "&outer_entry=" + encodeURIComponent(_zipNestedEntry) +
        "&inner_dir=" + encodeURIComponent(dir)
      : "/api/zip/contents?path=" + encodeURIComponent(_zipAbs) +
        (dir ? "&dir=" + encodeURIComponent(dir) : "") + zipPwdQ();
    fetchTimeout(url, 10000)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) {
          // 加密 RAR：首次未输密码时提示输入，输入后自动重试
          if (/密码/.test(d.error) && !_zipPwd) {
            body.innerHTML = '<div class="empty">' + esc(d.error) +
              ' <a href="javascript:void(0)" id="zpPwd" style="color:var(--primary)">🔑 输入密码</a></div>';
            var pe = document.getElementById("zpPwd");
            if (pe) pe.addEventListener("click", function () {
              askZipPwd(function () { loadZipDir(_zipDir); });
            });
            return;
          }
          body.innerHTML = '<div class="empty">' + esc(d.error) + '</div>';
          return;
        }
        _zipMeta = d;
        renderZipList(d.entries || []);
      })
      .catch(function (e) {
        var msg = (e && e.name === "AbortError") ? "加载超时" : (e.message || e);
        body.innerHTML = '<div class="empty">' + esc(msg) +
          ' <a href="javascript:void(0)" id="zpRetry" style="color:var(--primary)">↻ 重试</a></div>';
        var rt = document.getElementById("zpRetry");
        if (rt) rt.addEventListener("click", function () { loadZipDir(_zipDir); });
      });
  }
  function renderZipCrumb() {
    var crumb = document.getElementById("zpCrumb");
    var html = '<button data-d="">📦 ' + esc(_zipName) + '</button>';
    var acc = "";
    (_zipDir ? _zipDir.split("/") : []).forEach(function (p) {
      acc += (acc ? "/" : "") + p;
      html += '<span>›</span><button data-d="' + esc(acc) + '">' + esc(p) + '</button>';
    });
    crumb.innerHTML = html;
    Array.prototype.forEach.call(crumb.querySelectorAll("button"), function (b) {
      b.addEventListener("click", function () { loadZipDir(b.getAttribute("data-d")); });
    });
  }
  function renderZipList(entries) {
    var body = document.getElementById("zpBody");
    var meta = _zipMeta || {};
    var metaLine = "";
    if (meta.entry_count != null) {
      metaLine = '<div class="zp-meta">📦 ' + esc(meta.zip_size_str || "") +
        ' · ' + meta.entry_count + ' 项' +
        (meta.total_uncompressed_str ? ' · 解压后 ' + esc(meta.total_uncompressed_str) : '') +
        '</div>';
    }
    if (!entries.length) {
      body.innerHTML = metaLine + '<div class="empty">空文件夹</div>';
      return;
    }
    entries = entries.slice().sort(function (a, b) {
      if (!!a.is_dir !== !!b.is_dir) return a.is_dir ? -1 : 1;
      return a.name.localeCompare(b.name, "zh-CN");
    });
    var frag = document.createDocumentFragment();
    entries.forEach(function (e) {
      var row = document.createElement("div");
      row.className = "item";                      // 与主列表同款行布局
      var sub = e.is_dir
        ? "文件夹"
        : (fmtZipSize(e.size) + " · " + fileTypeName(e));
      row.innerHTML =
        '<div class="thumb">' + iconHtmlFor({ name: e.name, is_dir: e.is_dir }) + '</div>' +
        '<div class="meta">' +
          '<div class="name-row"><div class="name">' + esc(e.name) + '</div></div>' +
          '<div class="sub">' + esc(sub) + '</div>' +
        '</div>';
      row.addEventListener("click", function () {
        if (e.is_dir) { loadZipDir(zipEntryPath(e.name)); } else { zipEntryInfo(e); }
      });
      frag.appendChild(row);
    });
    body.innerHTML = metaLine;
    body.appendChild(frag);
  }
  // 嵌套解压：把外层包内的 zip 成员单独解压到外层包所在目录（走后台任务进度）
  function nestedUnzip(outerAbs, memberEntry, memberName) {
    bgStart("uz", "/api/zip/nested/unzip/start", {
      path: outerAbs, outer_entry: memberEntry,
      name: (memberName || "解压结果").replace(/\.zip$/i, "")
    }, {
      title: "正在解压：" + (memberName || "嵌套压缩包"),
      label: "解压",
      onDone: function (ok, d) {
        if (ok && d && d.result && d.result.files != null) {
          toast("已解压 " + d.result.files + " 个文件到「" + d.result.name + "」", "success");
        }
        if (ok && d && d.result && d.result.name && d.result.path &&
            normDirPath(dirnameOf(d.result.path)) === normDirPath(state.path)) {
          localAddItem({ name: d.result.name, path: d.result.name, abs_path: d.result.path,
            is_dir: true, size: 0, size_str: "", mtime: nowStrLocal() });
        }
      },
      legacy: function () {   // 后端未升级兜底：退回下载该压缩包成员
        window.open("/api/zip/file?zip_path=" + encodeURIComponent(outerAbs) +
          "&entry=" + encodeURIComponent(memberEntry), "_blank");
      }
    });
  }
  // 点击包内文件：弹出文件信息卡片（不再直接跳转下载）
  function zipEntryInfo(e) {
    var full = zipEntryPath(e.name);
    var ext = extOf(e.name);
    var isNested = !!_zipOuter;
    var isZipMember = ext === "zip";
    var fileUrl = isNested
      ? "/api/zip/nested/file?zip_path=" + encodeURIComponent(_zipOuter) +
        "&outer_entry=" + encodeURIComponent(_zipNestedEntry) + "&inner_path=" + encodeURIComponent(full)
      : "/api/zip/file?zip_path=" + encodeURIComponent(_zipAbs) +
        "&entry=" + encodeURIComponent(full) + zipPwdQ();
    var previewUrl = isNested
      ? "/api/zip/nested/preview?zip_path=" + encodeURIComponent(_zipOuter) +
        "&outer_entry=" + encodeURIComponent(_zipNestedEntry) + "&inner_path=" + encodeURIComponent(full)
      : "/api/zip/preview?zip_path=" + encodeURIComponent(_zipAbs) +
        "&entry=" + encodeURIComponent(full) + zipPwdQ();
    var isImg = MOBILE_IMG_EXT.indexOf(ext) >= 0;

    var mask = document.getElementById("previewMask");
    var body = document.getElementById("previewBody");
    document.getElementById("previewClose").style.display = "none";   // 遮罩层自带的 ✕ 隐藏，卡片内已有关闭

    var card = document.createElement("div");
    card.className = "pv-card zp-fcard";
    card.innerHTML =
      '<div class="pv-head">' +
        '<span class="pv-title">' + esc(e.name) + '</span>' +
        '<button type="button" class="pv-close" data-op="close">✕</button>' +
      '</div>' +
      '<div class="zp-fbody">' +
        '<div class="zp-finfo">' +
          '<div class="zp-finfo-toggle"><span>📄 文件信息</span><span class="tg">收起 ▴</span></div>' +
          '<div class="zp-finfo-rows">' +
            '<div><span>类型</span>' + esc(fileTypeName(e)) + '</div>' +
            '<div><span>大小</span>' + esc(fmtZipSize(e.size)) +
              (e.compressed ? '（压缩后 ' + esc(fmtZipSize(e.compressed)) + '）' : '') + '</div>' +
            '<div><span>路径</span>' + esc(full) + '</div>' +
            '<div><span>所在包</span>' + esc(_zipName) + '</div>' +
          '</div>' +
        '</div>' +
        (isImg ? '<div class="zp-fprev"><img alt=""></div>' : '') +
        (isTxt ? '<pre class="zp-ftext">加载中…</pre>' : '') +
        (!isImg && !isTxt
          ? '<div class="preview-msg" style="padding:4px 0 10px">该类型不支持在线预览，可点击下方下载</div>'
          : '') +
      '</div>' +
      '<div class="zp-fops">' +
        (isZipMember ? '<button type="button" data-op="open">📦 打开</button>' : '') +
        (isZipMember ? '<button type="button" data-op="unzip">📂 解压</button>' : '') +
        '<button type="button" data-op="dl">⬇️ 下载</button>' +

    body.innerHTML = "";
    body.appendChild(card);
    mask.classList.add("show");

    card.querySelector('[data-op="close"]').addEventListener("click", function () {
      mask.classList.remove("show");
      body.innerHTML = "";
      document.getElementById("previewClose").style.display = "";
    });
    card.querySelector('[data-op="dl"]').addEventListener("click", function () {
      window.open(fileUrl, "_blank");
    });
    if (isZipMember) {
      // 打开：进入嵌套压缩包查看
      card.querySelector('[data-op="open"]').addEventListener("click", function () {
        mask.classList.remove("show"); body.innerHTML = "";
        document.getElementById("previewClose").style.display = "";
        var outerAbs = _zipOuter || _zipAbs;
        var outerName = _zipName;
        var memberEntry = isNested ? (_zipNestedEntry + "/" + full) : full;
        openNestedZipViewer(outerAbs, outerName, memberEntry);
      });
      // 解压：把该压缩包成员单独解压到外层 zip 所在目录
      card.querySelector('[data-op="unzip"]').addEventListener("click", function () {
        mask.classList.remove("show"); body.innerHTML = "";

    // 图片预览：用 fetch 带密码加载为 blob，失败（如加密）提示输入密码
    if (isImg) {
      var img = card.querySelector(".zp-fprev");
      fetchTimeout(fileUrl, 15000)
        .then(function (r) {
          if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || "加载失败"); });
          return r.blob();

        .then(function (blob) {
          var u = URL.createObjectURL(blob);
          var im = new Image();

          im.onerror = function () { img.innerHTML = '<div class="empty">图片预览失败</div>'; };

          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d.error) {
              if (/密码/.test(d.error) && !_zipPwd) {
                pre.textContent = d.error + "（点击输入密码）";
                pre.style.cursor = "pointer";
                pre.onclick = function () { askZipPwd(function () { zipEntryInfo(e); }); };
                return;
              }
              pre.textContent = d.error; return;
            }
            var bin = atob(d.content);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            pre.textContent = new TextDecoder("utf-8").decode(bytes);
          })
          .catch(function (er) {

          });
      }

  // ---------- 回收站 ----------
  var _trItems = [];
  function trIco(name, isDir) {
    if (isDir) return "📁";
    var e = (name.split(".").pop() || "").toLowerCase();
    if (["jpg","jpeg","png","gif","webp","bmp","svg","ico"].indexOf(e) >= 0) return "🖼️";
    if (["mp4","mkv","avi","mov","wmv","flv","ts","webm","m4v"].indexOf(e) >= 0) return "🎬";
    if (["mp3","flac","wav","aac","ogg","m4a","wma"].indexOf(e) >= 0) return "🎵";
    if (["zip","rar","7z","tar","gz","bz2","xz"].indexOf(e) >= 0) return "🗜️";
    if (["pdf","doc","docx","xls","xlsx","ppt","pptx","txt","md","epub"].indexOf(e) >= 0) return "📝";
    if (["exe","msi","apk","deb","dmg","appimage"].indexOf(e) >= 0) return "⚙️";
    return "📄";
  }
  function fmtTrTime(ts) {
    if (!ts) return "";
    var diff = Date.now() / 1000 - ts;
    if (diff < 60) return "刚刚";
    if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
    if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
    if (diff < 86400 * 7) return Math.floor(diff / 86400) + " 天前";
    var dte = new Date(ts * 1000), p2 = function (x) { return (x < 10 ? "0" : "") + x; };
    return dte.getFullYear() + "-" + p2(dte.getMonth() + 1) + "-" + p2(dte.getDate());
  }

          stat.textContent = "";
          return;
        }
        var items = d.items || [];
        _trItems = items;
        var alive = items.filter(function (x) { return x.exists; });
        var bytes = alive.reduce(function (s, x) { return s + (x.is_dir ? 0 : (x.size || 0)); }, 0);
        stat.textContent = items.length
          ? "共 " + items.length + " 项 · 可恢复 " + alive.length + " 项 · 约 " + fmtDelBytes(bytes)
          : "";
        if (!items.length) {
          box.innerHTML = '<div class="tr-empty">🗑<br>回收站是空的</div>';
          return;
        }
        box.innerHTML = items.map(function (it, idx) {
          var gone = !it.exists;
          var sizeTxt = it.is_dir ? "文件夹" : (fmtDelBytes(it.size || 0));
          return '<div class="tr-item' + (gone ? " gone" : "") + '" data-i="' + idx + '">' +
            '<div class="tr-row">' +
              '<span class="tr-ico">' + trIco(it.name || "", it.is_dir) + '</span>' +

          '</div>';

        stat.textContent = "";

  function idxRow(dir, name, inner) {

  function renderIdx(d) {
    var body = document.getElementById("idxBody");

    var status = d.status || "idle";

    stat.textContent = scanning ? "扫描中 " + (d.progress || 0) + "%" : "基于本地索引，全盘搜索毫秒级响应";
    var h = '<div class="idx-grid">' +

        '<span class="prop-value' + (copyable ? ' copyable" data-copy="' + esc(value) : '') + '">' +

    h += row("大小", d.size_str);

  function favGroups() {
    var map = {}, names = [], seen = {};
    favs.forEach(function (f) {
      var g = f.group || "";
      if (!map[g]) map[g] = [];
      map[g].push(f);
    });
    // 先按保存的 tab 顺序，再补上未登记的分组
    favGroupOrder.forEach(function (g) {
      if (g && g !== "__ungrouped__" && map[g] && !seen[g]) { names.push(g); seen[g] = 1; }
    });
    Object.keys(map).forEach(function (g) {
      if (g && !seen[g]) { names.push(g); seen[g] = 1; }
    });
    return { names: names, map: map };
  }
  // 分组选择弹层（cb 收到分组名；"" = 其他，"__new__" = 新建分组；cur = 当前所在分组，用于标记）

      var names = [], seen = {};
      favGroupOrder.forEach(function (g) {
        if (g && g !== "__ungrouped__" && !seen[g]) { names.push(g); seen[g] = 1; }
      });
      favs.forEach(function (f) {

  function openFavSheet() {
    loadFavs().then(function () {
      document.getElementById("sheetHead").textContent = "⭐ 收藏夹";
      document.getElementById("sheet").classList.add("favmode");
      var btns = document.getElementById("sheetBtns");
      btns.innerHTML = "";
      if (!favs.length) {
        var tip = document.createElement("div");
        tip.className = "sheet-tip";
        tip.textContent = "还没有收藏：点右上角 ＋ → 「收藏当前文件夹」";
        btns.appendChild(tip);
        document.getElementById("sheetMask").classList.add("show");
        document.getElementById("sheet").classList.add("show");
        return;
      }
      var gs = favGroups();
      // 分组 tab（横向滚动，吸顶）：全部 / 各分组 / 其他；带数量统计，可长按拖动排序（除「全部」）
      var tabRow = document.createElement("div");
      tabRow.className = "fav-tabs";
      var favList = document.createElement("div");   // 列表内容容器：切换 tab 时只清它，不让 tab 行重挂导致滚动复位
      var favTabDragEnd = 0;        // 拖动结束时间戳，防止误触发 click
      // tab 顺序：已保存顺序 → 未登记分组 → 其他（"__ungrouped__" 占位）
      var tabSeq = [];
      (function () {
        var seen = {}, hasUngrouped = !!gs.map[""];
        favGroupOrder.forEach(function (g) {
          if (g === "__ungrouped__") {
            if (hasUngrouped && !seen[""]) { tabSeq.push(""); seen[""] = 1; }
            return;
          }
          if (g && !seen[g]) { tabSeq.push(g); seen[g] = 1; }   // 空分组（还没有收藏）也显示
        });
        gs.names.forEach(function (g) { if (g && !seen[g]) { tabSeq.push(g); seen[g] = 1; } });
        if (hasUngrouped && !seen[""]) tabSeq.push("");
      })();
      function centerTab(t) {
        var r = t.getBoundingClientRect(), pr = tabRow.getBoundingClientRect();
        if (r.left < pr.left + 4 || r.right > pr.right - 4) {
          tabRow.scrollLeft = Math.max(0, t.offsetLeft - (tabRow.clientWidth - t.offsetWidth) / 2);
        }
      }
      function renderList(active) {
        // active: "__all__" = 全部分组；"" = 其他；其它 = 分组名
        favList.innerHTML = "";
        Array.prototype.forEach.call(tabRow.children, function (t) {
          var on = t.dataset.g === active;
          t.classList.toggle("on", on);
          if (on) centerTab(t);
        });
        if (active === "__all__") {
          if (gs.map[""]) renderFavRows(gs.map[""], favList);
          gs.names.forEach(function (g) {
            if (!g) return;
            favGroupHead(g, favList);
            renderFavRows(gs.map[g], favList);
          });
        } else {
          if (active) favGroupHead(active, favList);   // 单分组视图也保留重命名/删除入口
          renderFavRows(gs.map[active] || [], favList);
        }
        var tip2 = document.createElement("div");
        tip2.className = "sheet-tip";
        tip2.textContent = "点名称跳转 · 长按 tab 拖动排序 · 🏷️ 改分组/重命名 · 🗑️ 删除分组/取消收藏";
        favList.appendChild(tip2);
      }
      function addTab(label, val, cnt, draggable) {
        var t = document.createElement("button");
        t.className = "fav-tab";
        t.innerHTML = esc(label) + (typeof cnt === "number" ? '<span class="cnt">' + cnt + '</span>' : "");
        t.dataset.g = val;
        t.addEventListener("click", function () {
          if (Date.now() < favTabDragEnd) return;
          renderList(val);
        });
        if (draggable) makeTabDraggable(t);
        tabRow.appendChild(t);
      }
      // 长按 tab 拖动换位，松手后把新顺序持久化到服务端
      function makeTabDraggable(t) {
        var timer = null, sx = 0, sy = 0, moved = false;
        t.addEventListener("touchstart", function (e) {
          var tc = e.touches[0];
          sx = tc.clientX; sy = tc.clientY; moved = false;
          timer = setTimeout(function () { moved = true; t.classList.add("dragging"); }, 300);
        }, { passive: true });
        t.addEventListener("touchmove", function (e) {
          if (!moved) {
            var tc = e.touches[0];
            if (Math.abs(tc.clientX - sx) > 8 || Math.abs(tc.clientY - sy) > 8) {
              clearTimeout(timer); moved = false; timer = null;
            }
            return;
          }
          e.preventDefault();

      var tKey = _normKey(tr.title), aKey = _normKey(tr.artist);
      var imgs = _ctxItems.filter(function (it) {
        return !isDir(it) && rawExts.indexOf(extOf(it.name)) >= 0;
      });
      cands = imgs.filter(function (it) {
        var nb = _normKey(_baseOf(it.name));
        return (tKey && nb.indexOf(tKey) >= 0) || (aKey && nb.indexOf(aKey) >= 0);
      });
      if (!cands.length && imgs.length === 1) cands = imgs;
    }
    return cands.length ? "/api/raw?path=" + encodeURIComponent(itemAbs(cands[0])) : "";
  }

  function _normKey(s) { return (s || "").toLowerCase().replace(/\s+/g, ""); }

  // 歌词匹配：同名 .lrc 优先；否则按 歌名/歌手 模糊匹配
  // （兼容 音频为乱码名、lrc 命名为「歌名 - 歌手.lrc」等场景）
  function _findLrcItem(trackAbs) {
    var fname = trackAbs.split("/").pop();
    var base = _baseOf(fname).toLowerCase();
    var tr = _parseTrack(fname);
    var tKey = _normKey(tr.title), aKey = _normKey(tr.artist);
    var best = null, bestScore = -1;
    for (var i = 0; i < _ctxItems.length; i++) {
      var it = _ctxItems[i];
      if (isDir(it) || extOf(it.name) !== "lrc") continue;
      var b = _baseOf(it.name).toLowerCase();
      var nb = _normKey(b);
      var score = -1;
      if (b === base) score = 100;                                                          // 同名
      else if (tKey && nb.indexOf(tKey) >= 0 && (!aKey || nb.indexOf(aKey) >= 0)) score = 80; // 含歌名+歌手
      else if (tKey && nb.indexOf(tKey) >= 0) score = 60;                                    // 仅含歌名
      else if (aKey && nb.indexOf(aKey) >= 0 && nb.length <= aKey.length + 12) score = 40;   // 仅含歌手
      if (score > bestScore) { bestScore = score; best = it; }
    }
    return bestScore >= 40 ? best : null;
  }

  // 拉取目录列表并补全每项的绝对路径（接口列表项不带 abs_path，
  // itemAbs 会按「当前浏览目录」拼接——后台拉取时目录与浏览目录不一致会全部拼错）
  function _fetchDirItems(dir) {
    return fetchTimeout("/api/files?path=" + encodeURIComponent(dir) + "&limit=0&offset=0", 10000)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var items = (d && d.items) || [];
        items.forEach(function (it) { if (!it.abs_path) it.abs_path = joinPath(dir, it.name); });
        return items;
      });
  }

  // 上下文不是曲目所在目录（如搜索结果进入）时，先拉取该目录列表再匹配
  function _loadExtras(abs) {
    var dir = _dirnameOf(abs);
    if (_ctxDir === dir) { _applyExtras(abs); return; }
    _fetchDirItems(dir)
      .then(function (items) { _ctxItems = items; _ctxDir = dir; _applyExtras(abs); })
      .catch(function () { _applyExtras(abs); });
  }

  function _applyExtras(abs) {
    if (_plIndex < 0 || !_plItems[_plIndex] || itemAbs(_plItems[_plIndex]) !== abs) return; // 已切歌
    var coverUrl = _coverUrlFor(abs);
    var mpDisc = document.getElementById("mpDisc");
    var ppDisc = document.getElementById("ppDisc");
    if (coverUrl) {
      var bg = 'url("' + coverUrl + '") center/cover no-repeat';
      mpDisc.style.background = bg;
      ppDisc.style.background = bg;
      mpDisc.textContent = "";
    } else {
      mpDisc.style.background = "";
      ppDisc.style.background = "";
      mpDisc.textContent = "🎵";
    }
    // 氛围背景：模糊放大的封面（无封面时回落到按曲目生成的渐变底色）
    var ppBg = document.getElementById("ppBg");
    if (ppBg) {
      ppBg.style.backgroundImage = coverUrl ? 'url("' + coverUrl + '")' : "";
      ppBg.classList.toggle("has-cover", !!coverUrl);
    }
    if (coverUrl && navigator.mediaSession && navigator.mediaSession.metadata) {
      try {
        var tr2 = _parseTrack(_plItems[_plIndex].name);
        navigator.mediaSession.metadata = new MediaMetadata({
          title: tr2.title, artist: tr2.artist || "", album: "文件管理",
          artwork: [{ src: coverUrl, sizes: "512x512" }]
        });
      } catch (e) {}
    }
    _loadLrc(abs);
  }

  function _loadLrc(abs) {
    _lrcLines = [];
    _lrcIdx = -1;
    var box = document.getElementById("ppLyrics");
    box.innerHTML = '<div class="pp-lyr-empty">暂无歌词</div>';
    box.scrollTop = 0;
    document.getElementById("mpLyric").textContent = "";
    var lrcItem = _findLrcItem(abs);
    if (!lrcItem) return;
    fetch("/api/preview?path=" + encodeURIComponent(itemAbs(lrcItem)))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.type !== "text" || !d.content) return;
        if (_plIndex < 0 || !_plItems[_plIndex] || itemAbs(_plItems[_plIndex]) !== abs) return;
        _lrcLines = _parseLrc(_decodeLrcContent(d.content));
        if (!_lrcLines.length) {
          // 内容拿到了但解析不出时间戳：多半是加密歌词（如 kwl/qrc）或损坏文件
          box.innerHTML = '<div class="pp-lyr-empty">歌词格式无法识别（可能是加密或损坏的 LRC）</div>';
          return;
        }
        _renderLrc();
      })
      .catch(function () {});
  }

  // LRC 内容解码：接口返回 base64（传输层）。再按实际情况：
  // 1) 部分下载工具把 .lrc 内容本身又做了 base64（二次编码），需再解一次；
  // 2) 文本可能是 UTF-8 或 GBK/GB18030（Windows「ANSI」）
  function _decodeLrcContent(b64) {
    var bin = atob(b64);   // 解传输层，得到 .lrc 文件内容
    var t = bin.trim();
    // 若内容本身不含时间戳且整体像 base64（纯字母数字+/=、长度 4 的倍数）→ 再解一层
    if (t.indexOf("[") < 0 && /^[A-Za-z0-9+/=\r\n]+$/.test(t) && t.replace(/\s+/g, "").length % 4 === 0 && t.length > 24) {
      try { bin = atob(t); } catch (e) {}
    }
    if (bin.charCodeAt(0) === 0xEF && bin.charCodeAt(1) === 0xBB && bin.charCodeAt(2) === 0xBF) {
      bin = bin.slice(3);   // 去 UTF-8 BOM
    }
    var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
    try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); } catch (e) {}
    try { return new TextDecoder("gbk").decode(bytes); } catch (e) {}
    try { return new TextDecoder("gb18030").decode(bytes); } catch (e) {}
    return bin;   // 兜底：按 Latin-1 原样返回
  }

  function _parseLrc(txt) {
    var out = [];
    txt.split(/\r\n|\n|\r/).forEach(function (line) {
      var tags = line.match(/\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g);
      if (!tags) return;
      var text = line.replace(/\[[^\]]*\]/g, "").trim();
      if (!text) return;
      tags.forEach(function (tag) {
        var m = tag.match(/\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/);
        var t = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) +
                (m[3] ? parseInt((m[3] + "00").slice(0, 3), 10) / 1000 : 0);
        out.push({ t: t, text: text });
      });
    });
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function _renderLrc() {
    var box = document.getElementById("ppLyrics");
    box.innerHTML = "";
    if (!_lrcLines.length) { box.innerHTML = '<div class="pp-lyr-empty">纯音乐 · 无有效歌词</div>'; return; }
    _lrcLines.forEach(function (l) {
      var d = document.createElement("div");
      d.className = "pp-line";
      d.textContent = l.text;
      d.addEventListener("click", function () {   // 点歌词行跳转播放位置
        _audio.currentTime = l.t;
        if (_audio.paused) _audio.play().catch(function () {});
      });
      box.appendChild(d);
    });
    // 下一帧再定位：确保容器尺寸就绪、并按音频真实进度（而非刚 load 时的 0 秒）高亮
    requestAnimationFrame(function () { _syncLrc(_audio.currentTime); });
  }

  // 迷你条歌词超出一行时，启用跑马灯来回滚动（外层裁剪、内层文字平移）
  function _updateMpLyricScroll() {
    var mp = document.getElementById("mpLyric");
    mp.classList.remove("marquee");
    var span = document.createElement("span");
    span.className = "mpl-inner";
    span.textContent = mp.textContent;
    mp.textContent = "";
    mp.appendChild(span);
    var over = span.scrollWidth - mp.clientWidth;
    if (over > 4) {
      mp.style.setProperty("--shift", (over + 12) + "px");
      mp.style.setProperty("--dur", Math.max(6, Math.min(16, over / 15)) + "s");
      void mp.offsetWidth;   // 强制重启动画
      mp.classList.add("marquee");
    }
  }

  var _lrcHoldUntil = 0;   // 用户手动滚动歌词时，暂停自动跟随 3.5 秒
  function _syncLrc(cur) {
    if (!_lrcLines.length) return;
    var idx = -1;
    for (var i = 0; i < _lrcLines.length; i++) {
      if (_lrcLines[i].t <= cur + 0.25) idx = i; else break;
    }
    if (idx === _lrcIdx) return;
    _lrcIdx = idx;
    var box = document.getElementById("ppLyrics");
    var lines = box.querySelectorAll(".pp-line");
    lines.forEach(function (el, i) { el.classList.toggle("cur", i === idx); });
    document.getElementById("mpLyric").textContent = (idx >= 0) ? _lrcLines[idx].text : "";
    _updateMpLyricScroll();
    var curEl = lines[idx];
    if (curEl && Date.now() >= _lrcHoldUntil) {
      var y = curEl.offsetTop - box.clientHeight / 2 + curEl.offsetHeight / 2;
      try { box.scrollTo({ top: y, behavior: "smooth" }); } catch (e) { box.scrollTop = y; }
    }
