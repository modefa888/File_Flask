<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1f6feb" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
<title>文件管理 · 移动版</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --primary: #1f6feb;
    --text: #1f2328;
    --sub: #8a909a;
    --border: #e8eaed;
    --danger: #e5484d;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  /* ===== 顶部栏 ===== */
  .header { position: sticky; top: 0; z-index: 30; }
  .appbar {
    background: var(--primary);
    color: #fff;
    padding: calc(10px + var(--safe-top)) 12px 10px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.12);
  }
  .appbar .title { font-size: 17px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appbar button {
    border: none; background: rgba(255,255,255,.18); color: #fff;
    width: 38px; height: 38px; border-radius: 10px; font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .appbar button:active { background: rgba(255,255,255,.32); }
  /* ===== 面包屑 ===== */
  .breadcrumb {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 6px 8px; display: flex; align-items: center; gap: 6px;
  }
  .bc-scroll {
    flex: 1; min-width: 0; display: flex; gap: 2px; overflow-x: auto; white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  .bc-scroll::-webkit-scrollbar { display: none; }
  .crumb {
    color: var(--primary); font-size: 13px; padding: 2px 6px; border-radius: 6px;
    cursor: pointer; flex: 0 0 auto;
  }
  .crumb:active { background: rgba(31,111,235,.1); }
  .crumb.sep { color: var(--sub); cursor: default; padding: 2px 0; }
  .crumb.current { color: var(--text); font-weight: 600; }
  /* ===== 列表 ===== */
  .list { padding: 8px; }
  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px;
  }
  .item:active { background: #f0f3f8; }
  .thumb {
    width: 46px; height: 46px; border-radius: 10px; flex: 0 0 auto;
    background: #eef1f5; display: flex; align-items: center; justify-content: center;
    font-size: 24px; overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  /* 彩色扩展名徽标（js/md/json 等代码与文本格式） */
  .ext-badge {
    width: 100%; height: 100%; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; letter-spacing: .5px; user-select: none;
  }
  .list.grid .ext-badge { font-size: 26px; border-radius: 10px; }
  .meta { flex: 1; min-width: 0; }
  .meta .name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .sub { font-size: 12px; color: var(--sub); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cnt {
    flex: 0 0 auto; font-size: 11px; color: var(--sub); background: #f1f4f8;
    border: 1px solid var(--border); border-radius: 8px; padding: 3px 7px; white-space: nowrap;
  }
  .gtime { display: none; }
  .name-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name-row .name { flex: 1; min-width: 0; }
  .more {
    border: none; background: transparent; color: var(--sub); font-size: 22px;
    width: 36px; height: 36px; border-radius: 8px; cursor: pointer; flex: 0 0 auto;
  }
  .more:active { background: #eef1f5; }
  /* ===== 底部统计 ===== */
  .stats {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--card); border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + var(--safe-bottom));
    display: flex; justify-content: space-between; font-size: 12px; color: var(--sub);
  }
  /* 连接状态小圆点 */
  .stats-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .conn-dot {
    width: 9px; height: 9px; border-radius: 50%; flex: none; align-self: center;
    background: #94a3b8;
  }
  .conn-dot.on { background: #22c55e; box-shadow: 0 0 4px rgba(34,197,94,.6); }
  .conn-dot.off { background: #ef4444; box-shadow: 0 0 4px rgba(239,68,68,.6); }
  .conn-dot.unknown { animation: connPulse 1.2s ease-in-out infinite; }
  @keyframes connPulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .body-pad { padding-bottom: 56px; }
  body.has-mini .body-pad { padding-bottom: 112px; }
  /* ===== 音乐播放器 ===== */
  .mini-player {
    position: fixed; left: 0; right: 0; z-index: 58;
    margin: 0 8px; bottom: calc(56px + var(--safe-bottom));
    background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    transform: translateY(160%); opacity: 0; pointer-events: none;
    transition: transform .3s cubic-bezier(.22,.61,.36,1), opacity .25s,
                width .25s ease, border-radius .25s ease;
  }
  .mini-player.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
  /* 缩小模式：收成单个悬浮圆封面 */
  .mini-player.dock {
    left: auto; right: 14px; margin: 0; width: 52px; height: 52px;
    padding: 6px; border-radius: 50%; gap: 0; justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .mini-player.dock .mp-meta, .mini-player.dock .mp-btn { display: none; }
  .mini-player.dock .mp-info { cursor: pointer; }
  .mini-player.dock .mp-disc { width: 40px; height: 40px; font-size: 18px; }
  .mp-info { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; cursor: pointer; }
  .mp-disc {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    background: conic-gradient(#1f6feb, #7c3aed, #1f6feb);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.45);
    animation: discspin 7s linear infinite;
  }
  @keyframes discspin { to { transform: rotate(360deg); } }
  .mp-disc.paused { animation-play-state: paused; }
  .mp-meta { min-width: 0; }
  .mp-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-lyric {
    min-width: 0; margin-top: 1px; font-size: 11px; font-weight: 600; line-height: 1.45;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mp-lyric .mpl-inner {
    display: inline-block;
    background: linear-gradient(90deg, #ff5f6d, #ffa751, #47cf73, #38a1db, #b06ab3);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .mp-lyric.marquee .mpl-inner { animation: mpscroll var(--dur, 10s) linear infinite alternate; padding-right: 12px; }
  @keyframes mpscroll {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(-1 * var(--shift, 0px))); }
  }
  .mp-sub { font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mp-btn {
    border: none; background: transparent; color: var(--text); width: 34px; height: 34px;
    border-radius: 50%; font-size: 16px; flex: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .mp-btn:active { background: rgba(0,0,0,.06); }
  .mp-btn.close { color: var(--sub); }

  /* ===== 全屏播放器：氛围背景 + 毛玻璃抽屉 ===== */
  .player-page {
    position: fixed; inset: 0; z-index: 96; display: none; flex-direction: column;
    overflow: hidden;
    padding: calc(14px + var(--safe-top)) 16px calc(14px + var(--safe-bottom));
    color: #fff; background: linear-gradient(165deg, #2b5876, #4e4376);   /* JS 会按曲目覆盖 */
    transition: opacity .25s ease;
  }
  .player-page.show { display: flex; }
  /* 氛围层：模糊放大的封面，让上层的毛玻璃有内容可透 */
  .pp-bg {
    position: absolute; inset: -14%; z-index: 0; pointer-events: none;
    background: center/cover no-repeat;
    filter: blur(40px) saturate(155%) brightness(.85);
    transform: scale(1.15); opacity: 0; transition: opacity .6s ease;
  }
  .pp-bg.has-cover { opacity: .9; }
  /* 顶部提亮 + 底部压暗，保证白字和玻璃面板的对比度 */
  .player-page::after {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(130% 60% at 50% 0%, rgba(255,255,255,.12), transparent 62%),
      linear-gradient(180deg, rgba(0,0,0,.30), rgba(0,0,0,.06) 34%, rgba(0,0,0,.46));
  }
  .pp-top, .pp-disc-wrap, .pp-sheet { position: relative; z-index: 1; }
  .pp-top { display: flex; align-items: center; gap: 10px; }
  /* 顶部圆形按钮：毛玻璃胶囊 */
  .pp-collapse, .pp-list-btn, .pp-fav-btn {
    border: 1px solid rgba(255,255,255,.18); color: #fff; cursor: pointer;
    background: rgba(255,255,255,.13);
    -webkit-backdrop-filter: blur(16px) saturate(170%);
    backdrop-filter: blur(16px) saturate(170%);
    box-shadow: 0 6px 18px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.24);
    display: flex; align-items: center; justify-content: center; flex: none;
    transition: transform .18s ease, background .18s ease;
  }
  .pp-collapse, .pp-list-btn { width: 40px; height: 40px; border-radius: 50%; font-size: 18px; }
  .pp-fav-btn { width: 40px; height: 40px; border-radius: 50%; }
  .pp-collapse:active, .pp-list-btn:active, .pp-fav-btn:active { transform: scale(.93); background: rgba(255,255,255,.28); }
  .pp-title-wrap { flex: 1; min-width: 0; text-align: center; }
  .pp-title-wrap::before {
    content: "NOW PLAYING"; display: block; margin-bottom: 3px;
    font-size: 9px; font-weight: 600; letter-spacing: 2.4px; opacity: .55;
  }
  .pp-title-wrap .pp-name { font-size: 16px; letter-spacing: .3px; text-shadow: 0 1px 10px rgba(0,0,0,.35); }
  .pp-title-wrap .pp-artist { margin-top: 2px; font-size: 11px; color: rgba(255,255,255,.72); }
  /* 唱片：居中展示，背后一层柔光让封面从背景里浮起来 */
  .pp-disc-wrap {
    flex: 1 1 auto; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center; padding: 6px 0 10px;
  }
  .pp-disc-wrap::before {
    content: ""; position: absolute; border-radius: 50%;
    width: min(66vw, 290px); height: min(66vw, 290px);
    background: radial-gradient(circle, rgba(255,255,255,.26), rgba(255,255,255,0) 70%);
    filter: blur(22px);
  }
  /* 喜欢：收进进度行右端，做成图标式（不再是漂浮圆钮），和「当前时间─时长」成为一条信息带
     外框 32px 保留手指热区，视觉上只有一个心形；负外边距让它不撑高这一行 */
  .pp-progress .pp-fav-btn {
    flex: none; width: 32px; height: 32px; margin: -6px -2px -6px 0;
    border: none; background: transparent; box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none;
    color: rgba(255,255,255,.62);
  }
  .pp-progress .pp-fav-btn svg { width: 20px; height: 20px; }
  .pp-progress .pp-fav-btn:active { background: transparent; color: #fff; box-shadow: none; }
  .pp-progress .pp-fav-btn.on { color: #ff6a97; background: transparent; }
  .pp-disc {
    width: min(56vw, 240px, 30vh); height: min(56vw, 240px, 30vh); border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.95) 0 18%, transparent 19%),
      conic-gradient(from 0deg, #1f6feb, #7c3aed, #ec4899, #f59e0b, #1f6feb);
    box-shadow:
      0 22px 52px rgba(0,0,0,.45),
      0 0 0 1px rgba(255,255,255,.18),
      inset 0 0 0 6px rgba(255,255,255,.08),
      inset 0 10px 26px rgba(255,255,255,.16);
    display: flex; align-items: center; justify-content: center;
    animation: discspin 9s linear infinite; position: relative;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .pp-disc.paused { animation-play-state: paused; }
  /* 按下时提亮一下（用 filter 避免和旋转动画的 transform 打架） */
  .pp-disc:active { filter: brightness(1.18); }
  .pp-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pp-artist { font-size: 13px; opacity: .82; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* ===== 毛玻璃抽屉：歌词 + 进度 + 控制都收进这块玻璃里 ===== */
  .pp-sheet {
    flex: 0 1 auto; max-height: 54vh; min-height: 0;
    display: flex; flex-direction: column;
    margin-top: 6px; padding: 14px 16px 16px; border-radius: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.07));
    -webkit-backdrop-filter: blur(26px) saturate(175%);
    backdrop-filter: blur(26px) saturate(175%);
    border: 1px solid rgba(255,255,255,.17);
    box-shadow: 0 -10px 42px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.26);
    animation: sheetUp .42s cubic-bezier(.22,.61,.36,1) both;
  }
  .pp-sheet::before {   /* 顶部把手：抽屉感 */
    content: ""; display: block; width: 40px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,.3); margin: -4px auto 10px; flex: none;
  }
  @keyframes sheetUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  /* 进度条：玻璃轨道 + 高亮已播放段（--p 由 JS 更新） */
  .pp-progress {
    flex: none; display: flex; align-items: center; gap: 10px;
    margin-top: 12px; font-size: 11px; color: rgba(255,255,255,.78);
    font-variant-numeric: tabular-nums;
  }
  .pp-seek {
    flex: 1; -webkit-appearance: none; appearance: none; height: 5px; border-radius: 4px;
    outline: none; cursor: pointer; border: none;
    background: linear-gradient(90deg,
      rgba(255,255,255,.95) 0 calc(var(--p, 0) * 100%),
      rgba(255,255,255,.22) calc(var(--p, 0) * 100%) 100%);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.22);
  }
  .pp-seek::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 2px solid rgba(255,255,255,.5);
    box-shadow: 0 2px 8px rgba(0,0,0,.45);
  }
  .pp-seek::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: #fff;
    border: 2px solid rgba(255,255,255,.5);
  }
  /* 控制区：两侧玻璃圆钮 + 中间白色主按钮 */
  .pp-controls {
    position: relative;   /* 音量悬浮条的定位基准 */
    flex: none; display: flex; align-items: center; justify-content: space-between;
    gap: 4px; margin-top: 14px; padding: 0 2px;
  }
  /* 极窄屏：再收一档，保证 6 个按钮始终一行放得下 */
  @media (max-width: 345px) {
    .pp-controls { gap: 2px; padding: 0; }
    .pp-controls button:not(.pp-play-big) { width: 36px; height: 36px; }
    .pp-controls button.pp-play-big { width: 52px; height: 52px; }
    .pp-controls button svg { width: 18px; height: 18px; }
    .pp-controls button.pp-play-big svg { width: 22px; height: 22px; }
  }
  .pp-controls button {
    border: 1px solid rgba(255,255,255,.15); color: #fff; cursor: pointer;
    background: rgba(255,255,255,.1);
    -webkit-backdrop-filter: blur(12px) saturate(160%);
    backdrop-filter: blur(12px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 6px 16px rgba(0,0,0,.2);
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: transform .18s ease, background .18s ease;
  }
  .pp-controls button:not(.pp-play-big) { width: 42px; height: 42px; border-radius: 50%; flex: none; font-size: 22px; }
  .pp-controls button:active { transform: scale(.9); background: rgba(255,255,255,.26); }
  /* 主按钮：白色实心（选择器需盖过 .pp-controls button，否则会退回玻璃底色） */
  .pp-controls button.pp-play-big {
    width: 60px; height: 60px; border-radius: 50%; flex: none; padding: 0; font-size: 26px;
    color: #17171f; border: none;
    background: linear-gradient(180deg, #ffffff, #e6e6ef);
    box-shadow: 0 12px 30px rgba(0,0,0,.42), inset 0 1px 0 #fff;
  }
  .pp-controls button.pp-play-big:active {
    background: linear-gradient(180deg, #f1f1f7, #d9d9e4);
  }
  /* 音量工具：垂直悬浮玻璃条（挂在喇叭按钮正上方，不占布局） */
  .pp-vol {
    /* 抬到进度条上方，避免遮住左侧时间 */
    position: absolute; left: -2px; bottom: calc(100% + 36px); z-index: 5;
    display: none; flex-direction: column; align-items: center; gap: 8px;
    padding: 12px 8px 10px; border-radius: 20px;
    background: rgba(28,26,42,.42);
    -webkit-backdrop-filter: blur(18px) saturate(170%);
    backdrop-filter: blur(18px) saturate(170%);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 14px 34px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.22);
    transform-origin: 22px 100%;
    animation: volPop .22s cubic-bezier(.22,.61,.36,1) both;
  }
  .pp-vol.show { display: flex; }
  @keyframes volPop {
    from { opacity: 0; transform: translateY(8px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .pp-vol-slot { position: relative; width: 34px; height: 132px; }
  .pp-vol-range {
    position: absolute; left: 50%; top: 50%; width: 132px; height: 5px; margin: 0;
    transform: translate(-50%,-50%) rotate(-90deg);   /* 旋转成竖直滑杆：向上=变大 */
    -webkit-appearance: none; appearance: none; border-radius: 3px;
    outline: none; cursor: pointer; border: none;
    background: linear-gradient(90deg,
      rgba(255,255,255,.95) 0 calc(var(--v, 1) * 100%),
      rgba(255,255,255,.22) calc(var(--v, 1) * 100%) 100%);
  }
  .pp-vol-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  .pp-vol-range::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: none; }
  .pp-vol-val {
    flex: none; font-size: 11px; color: rgba(255,255,255,.85);
    font-variant-numeric: tabular-nums;
  }
  /* SVG 图标尺寸 */
  .pp-collapse svg, .pp-list-btn svg { width: 20px; height: 20px; }
  .pp-controls button svg { width: 20px; height: 20px; }
  .pp-controls button.pp-play-big svg { width: 26px; height: 26px; }
  .pp-badge svg { width: 20px; height: 20px; }
  .mp-btn svg { width: 18px; height: 18px; }
  .pp-pl-close svg { width: 14px; height: 14px; }

  /* 播放列表：右侧悬浮抽屉（半透明毛玻璃，浮在画面上，三个 tab 共用） */
  .pp-pl-mask {
    position: fixed; inset: 0; z-index: 96; background: rgba(0,0,0,.24);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .pp-pl-mask.show { opacity: 1; pointer-events: auto; }
  .pp-playlist {
    /* 四周留出间距 + 投影 + 描边：做成真正“悬浮”在画面上的卡片 */
    position: fixed; top: 8px; right: 8px; bottom: calc(8px + var(--safe-bottom)); z-index: 97;
    width: min(78vw, 320px); max-height: none; overflow: hidden;   /* 整块不滚动：只有中间列表滚动 */
    display: flex; flex-direction: column;
    /* 更透明、模糊更强（.92 → .55、blur 18 → 30），让背后画面明显透出来 */
    background: rgba(20,18,38,.55);
    -webkit-backdrop-filter: blur(30px) saturate(170%);
    backdrop-filter: blur(30px) saturate(170%);
    border: 1px solid rgba(255,255,255,.14);

  /* ===== 全局搜索页 ===== */
  .search-page {
    position: fixed; inset: 0; z-index: 45; background: var(--bg);
    display: none; flex-direction: column;
  }
  .search-page.show { display: flex; }
  .sp-head {
    background: var(--primary); color: #fff;
    padding: calc(10px + var(--safe-top)) 12px 10px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.12);
  }
  .sp-head button {
    border: none; background: rgba(255,255,255,.18); color: #fff;
    width: 38px; height: 38px; border-radius: 10px; font-size: 17px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .sp-head button:active { background: rgba(255,255,255,.32); }
  .sp-head input {
    flex: 1; min-width: 0; border: none; outline: none; border-radius: 20px;
    padding: 9px 14px; font-size: 16px; background: #fff; color: var(--text);
  }
  .sp-tools {
    position: relative;   /* 搜索历史下拉面板的定位基准 */
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--card); border-bottom: 1px solid var(--border);
    flex-wrap: nowrap;
  }
  .sp-chip {
    border: 1px solid var(--border); background: #fff; color: var(--sub);
    border-radius: 14px; padding: 4px 12px; font-size: 12px; cursor: pointer; flex: 0 0 auto;
  }
  .sp-chip.active {
    background: rgba(31,111,235,.12); border-color: rgba(31,111,235,.4);
    color: var(--primary); font-weight: 600;
  }
  .sp-status {
    font-size: 12px; color: var(--sub); margin-left: auto;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* 搜索历史：下拉面板（表头固定 + 列表滚动，全部列出） */
  .sp-histwrap {
    position: absolute; left: 8px; right: 8px; top: calc(100% + 6px); z-index: 30;
    display: flex; flex-direction: column;
    border-radius: 14px; overflow: hidden;   /* 圆角裁切内部滚动区 */
    background: #fff; border: 1px solid var(--border);
    box-shadow: 0 16px 36px rgba(15,23,42,.18);
    max-height: 62vh;
  }
  .sp-histwrap.hidden { display: none; }
  .sp-hist-head {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px 8px; font-size: 12px; color: var(--sub);
    border-bottom: 1px solid #eef2f7;
  }
  /* 列表是唯一的滚动区，滚动条按平台能力显示；另加底部渐隐箭头做兜底提示 */
  .sp-hist-list {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column; gap: 2px;
    padding: 6px 4px 8px 8px;
    overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    scrollbar-width: thin;                                  /* Firefox */
    scrollbar-color: rgba(100,116,139,.5) transparent;
  }
  .sp-hist-list::-webkit-scrollbar { width: 6px; }
  .sp-hist-list::-webkit-scrollbar-track { background: transparent; }
  .sp-hist-list::-webkit-scrollbar-thumb {
    background: rgba(100,116,139,.5); border-radius: 3px;
  }
  /* 还有更多时：底部渐隐 + 向下箭头（不依赖平台滚动条） */
  .sp-histwrap.has-more::after {
    content: "⌄"; position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 1px;
    font-size: 14px; color: #94a3b8;
    background: linear-gradient(rgba(255,255,255,0), #fff 76%);
    pointer-events: none;
  }
  .sp-hist-clear { color: #e05656; cursor: pointer; padding: 2px 6px; border-radius: 8px; }
  .sp-hist-clear:active { background: #fee2e2; }
  .sp-hist-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 8px; border-radius: 10px; cursor: pointer;
  }
  .sp-hist-item:active { background: #f1f5f9; }
  .sp-hist-ico {
    flex: none; width: 30px; height: 30px; border-radius: 9px; font-size: 14px;
    background: #f1f5f9; display: flex; align-items: center; justify-content: center;
  }
  .sp-hist-q {
    flex: 1 1 auto; min-width: 0; font-size: 14px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sp-hist-where {
    flex: 0 1 auto; max-width: 42%; font-size: 12px; color: var(--sub);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sp-hist-del {
    flex: none; width: 24px; height: 24px; border-radius: 50%; border: none; padding: 0;
    background: transparent; color: var(--sub); font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .sp-hist-del:active { background: #fee2e2; color: #e05656; }
  .sp-hist-empty { padding: 16px 8px; text-align: center; font-size: 13px; color: var(--sub); }
  .sp-histbtn {
    flex: 0 0 auto;
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid var(--border); background: #fff; font-size: 14px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .sp-histbtn:active { background: #f1f5f9; }
  .sp-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sp-results { padding: 8px; }
  .sp-note { text-align: center; color: var(--sub); font-size: 12px; padding: 10px; }
  /* ===== 文件信息弹层 ===== */
  .props-mask {
    position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.4);
    display: none; align-items: flex-end; justify-content: center;
  }
  .props-mask.show { display: flex; }
  .props-card {
    width: 100%; max-width: 480px; max-height: 78vh; overflow-y: auto;
    background: #fff; border-radius: 16px 16px 0 0; padding: 14px 14px 18px;
    -webkit-overflow-scrolling: touch;
  }
  .props-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; color: var(--text);
    display: flex; align-items: center; gap: 8px; }
  .prop-row {
    display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--border);
    font-size: 13px; align-items: baseline;
  }
  .prop-label { color: var(--sub); flex: 0 0 62px; }
  .prop-value { color: var(--text); word-break: break-all; flex: 1; }
  .prop-value.copyable { color: var(--primary); }
  .props-close {
    display: block; width: 100%; margin-top: 12px; padding: 9px 0;
    border: none; border-radius: 10px; background: #eef2f7; color: var(--sub);
    font-size: 14px; cursor: pointer;
  }
  .props-close:active { background: #e2e8f0; }
  /* ===== 新建下拉菜单 ===== */
  .add-menu-mask { position: fixed; inset: 0; z-index: 38; display: none; }
  .add-menu-mask.show { display: block; }
  .add-menu {
    position: fixed; top: calc(64px + var(--safe-top)); right: 8px; z-index: 39;
    background: #fff; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
    padding: 6px; min-width: 150px; display: none;
  }
  .add-menu.show { display: block; }
  .add-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    border: none; background: transparent; padding: 11px 12px;
    font-size: 14px; color: var(--text); border-radius: 8px; cursor: pointer; text-align: left;
  }
  .add-item:disabled { opacity: .4; }
  .add-item:active { background: #f1f5f9; }
  /* ===== 多选 / 待执行移动复制 ===== */
  #pasteBtn.hidden { display: none; }
  .appbar button:disabled { opacity: .45; }
  .sel-check {
    flex: 0 0 22px; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #cbd5e1; background: #fff; color: transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .sel-check.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .item.sel-on { border-color: rgba(31,111,235,.55); background: rgba(31,111,235,.07); }
  /* ===== 图标（网格）视图 ===== */
  .list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px 8px; align-items: start; }
  .list.grid .item { flex-direction: column; align-items: stretch; gap: 6px; padding: 6px; margin-bottom: 0; position: relative; }
  .list.grid .thumb { width: 100%; height: 96px; flex: 0 0 auto; border-radius: 10px; font-size: 40px; }
  .list.grid .meta { min-width: 0; }
  .list.grid .meta .name { font-size: 13px; text-align: center; }
  .list.grid .meta .sub { display: none; }
  .list.grid .gtime {
    display: block; font-size: 11px; color: var(--sub); text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
  }
  .list.grid .cnt { position: absolute; top: 4px; left: 4px; z-index: 1; margin: 0; }
  .list.grid .more { position: absolute; top: 2px; right: 2px; width: 28px; height: 28px; font-size: 18px; background: rgba(255,255,255,.85); border-radius: 6px; }
  .list.grid .sel-check { position: absolute; top: 4px; left: 4px; z-index: 2; }
  .list.grid .empty { grid-column: 1 / -1; }
  .sel-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 36;
    background: #fff; border-top: 1px solid var(--border);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    display: none; gap: 6px;
  }
  .sel-bar.show { display: flex; }
  .sel-bar button {
    flex: 1; border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 9px; padding: 8px 0; font-size: 13px; cursor: pointer;
  }
  .sel-bar button:active { background: #f1f5f9; }
  .sel-bar button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .sel-bar button.danger { color: #e11d48; border-color: rgba(225,29,72,.35); }
  /* ===== Toast ===== */
  .toast-wrap {
    position: fixed; top: calc(108px + var(--safe-top)); left: 0; right: 0; z-index: 130;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
  }
  .toast {
    background: rgba(33,37,41,.92); color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: 13px; max-width: 80vw; text-align: center; animation: fade .2s ease;
  }
  .toast.error { background: rgba(229,72,77,.95); }
  .toast.warn { background: rgba(200,140,0,.95); }
  .toast.success { background: rgba(36,160,80,.95); }
  @keyframes fade { from { opacity: 0; transform: translateY(-8px);} to { opacity: 1; transform: none; } }
  /* ===== 压缩包查看页 ===== */
  .zip-page { z-index: 55; }
  .zip-page #zpTitle { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; color: #fff; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zip-page #zpExtract { width: auto; padding: 0 10px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .zp-crumb {
    background: var(--primary); color: rgba(255,255,255,.8); padding: 0 12px 9px;
    font-size: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
  }
  .zp-crumb button {
    border: none; background: transparent; color: #fff; font-size: 12px; padding: 2px 3px;
    max-width: 40vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .zp-crumb span { opacity: .6; }
  .zp-body { padding: 10px 10px calc(14px + var(--safe-bottom)); }
  .zp-meta { font-size: 11px; color: var(--sub); padding: 0 4px 8px; }
  .zp-item {
    display: flex; align-items: center; gap: 10px; padding: 11px 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 6px; cursor: pointer;
  }
  .zp-item:active { background: #eef2f7; }
  .zp-item .zi { flex: none; width: 24px; text-align: center; font-size: 17px; }
  .zp-item .zn { flex: 1; min-width: 0; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zp-item .zs { flex: none; font-size: 11px; color: var(--sub); }
  .zp-imgwrap { display: flex; align-items: center; justify-content: center; height: 100%; }
  .zp-imgwrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
  /* 压缩包内文件信息卡片 */
  .pv-card.zp-fcard { height: auto; max-height: 84vh; }
  .zp-fbody { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: 10px 14px 0; }
  .zp-finfo {
    background: #f7f9fc; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 13px; color: var(--text);
    display: grid; gap: 6px; margin: 0 0 10px;
  }
  .zp-finfo-toggle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--sub); font-size: 12px; font-weight: 600; user-select: none; }
  .zp-finfo-rows { display: grid; gap: 6px; }
  .zp-finfo.folded .zp-finfo-rows { display: none; }
  .zp-finfo span { display: inline-block; min-width: 52px; color: var(--sub); margin-right: 8px; }
  .zp-finfo > div { word-break: break-all; }
  .zp-fprev { display: flex; justify-content: center; margin-bottom: 10px; }
  .zp-fprev img { max-width: 100%; max-height: 46vh; object-fit: contain; border-radius: 8px; }
  .zp-ftext {
    margin: 0 0 10px; background: #f7f9fc; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; font-size: 12px; white-space: pre-wrap; word-break: break-all;
    max-height: 40vh; overflow: auto;
  }
  .zp-fops { display: flex; gap: 8px; padding: 10px 14px 14px; }
  .zp-fops button {
    flex: 1; border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 10px; padding: 11px 0; font-size: 14px; cursor: pointer;
  }
  .zp-fops button:active { background: #f0f3f8; }
  /* ===== 回收站页 ===== */
  .trash-page { z-index: 56; }
  #trTitle { flex: 1; min-width: 0; text-align: left; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ahTitle, #idxTitle { flex: 1; min-width: 0; text-align: left; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #trClear, #ahClear, #idxRebuild { width: auto; padding: 0 14px; font-size: 12px; font-weight: 600; white-space: nowrap; border-radius: 19px; }
  /* ===== 索引页 ===== */
  .idx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .idx-cell { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .idx-cell b { font-size: 15px; color: var(--text); }
  .idx-cell span { font-size: 11px; color: var(--sub); }
  .idx-status { font-size: 12px; border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; }
  .idx-status.ok { background: #ecfdf5; color: #15803d; border: 1px solid #bbf7d0; }
  .idx-status.scan { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .idx-status.err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .idx-progress { height: 6px; border-radius: 3px; background: #e2e8f0; overflow: hidden; margin-bottom: 10px; }
  .idx-progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); transition: width .5s ease; }
  .idx-cancel { border: none; background: #fef2f2; color: #b91c1c; border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
  .idx-sec { font-size: 12px; font-weight: 700; color: var(--sub); margin: 14px 0 6px; }
  .idx-rank { flex: none; width: 20px; font-size: 12px; font-weight: 700; color: var(--sub); }
  .idx-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .idx-sub { flex: none; font-size: 11px; color: var(--sub); }
  .idx-size { flex: none; font-size: 12px; font-weight: 600; color: var(--text); margin-left: 8px; }
  .idx-ext { flex: none; background: #eef2ff; color: #4338ca; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
  .idx-trow { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 5px; }
  #ahList .tr-item { cursor: pointer; }
  #ahList .tr-item:active { background: #f1f5f9; }
  /* 跳转高亮：目标条目闪蓝光渐隐 */
  /* 跳转定位高亮：持久显示，直到用户点击任意处消失 */
  .item.item-pinned {
    background: #dbeafe; box-shadow: 0 0 0 2px #3b82f6 inset;
    transition: background .2s ease, box-shadow .2s ease;
  }
  .tr-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
  .tr-row { display: flex; align-items: center; gap: 8px; }
  .tr-ico { flex: none; font-size: 17px; }
  .tr-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr-acts { flex: none; display: flex; gap: 6px; }
  .tr-acts button { border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .tr-acts .tr-restore { background: var(--primary); color: #fff; }
  .tr-acts .tr-purge { background: rgba(225,29,72,.08); color: #e11d48; border: 1px solid rgba(225,29,72,.25); }
  .tr-meta { margin-top: 5px; font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr-sub { margin-top: 2px; font-size: 11px; color: var(--sub); }
  .tr-item.gone { opacity: .55; }
  .tr-empty { text-align: center; color: var(--sub); padding: 48px 0; font-size: 13px; line-height: 1.8; }

  /* ================= 新版视频播放器（与毛玻璃音乐播放器同一套视觉语言） ================= */
  .vp-page {
    position: fixed; inset: 0; z-index: 99; display: none; flex-direction: column;
    overflow: hidden;
    padding: calc(14px + var(--safe-top)) 16px calc(14px + var(--safe-bottom));
    color: #fff; background: linear-gradient(165deg, #16121f, #0b0a12);
  }
  .vp-page.show { display: flex; }
  /* 氛围层：用视频抽帧缩略图模糊放大铺底 */
  .vp-bg {
    position: absolute; inset: -14%; z-index: 0; pointer-events: none;
    background: center/cover no-repeat;
    filter: blur(44px) saturate(150%) brightness(.58);
    transform: scale(1.15); opacity: 0; transition: opacity .6s ease;
  }
  .vp-bg.has-cover { opacity: .85; }
  .vp-page::after {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(130% 60% at 50% 0%, rgba(255,255,255,.10), transparent 62%),
      linear-gradient(180deg, rgba(0,0,0,.34), rgba(0,0,0,.08) 34%, rgba(0,0,0,.5));
  }
  .vp-top, .vp-stage, .vp-sheet { position: relative; z-index: 1; }
  .vp-top { display: flex; align-items: center; gap: 10px; }
  .vp-collapse, .vp-list-btn {
    border: 1px solid rgba(255,255,255,.18); color: #fff; cursor: pointer;
    background: rgba(255,255,255,.13);
    -webkit-backdrop-filter: blur(16px) saturate(170%);
    backdrop-filter: blur(16px) saturate(170%);
    box-shadow: 0 6px 18px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.24);
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    transition: transform .18s ease, background .18s ease;
  }
  .vp-collapse:active, .vp-list-btn:active { transform: scale(.93); background: rgba(255,255,255,.28); }
  .vp-list-btn.on { background: rgba(255,255,255,.3); }   /* 播放列表已打开时高亮，点击有明确反馈 */
  .vp-collapse svg, .vp-list-btn svg { width: 20px; height: 20px; }
  /* 播放列表：右侧毛玻璃抽屉（与音乐播放器一致） */
  .vp-pl-mask {
    position: fixed; inset: 0; z-index: 96; background: rgba(0,0,0,.24);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .vp-pl-mask.show { opacity: 1; pointer-events: auto; }
  .vp-pl {
    /* 从顶栏下方开始：不盖住 ☰，开着时点 ☰ 区域也能收起（不会"点了没反应"） */
    position: fixed; top: calc(62px + var(--safe-top)); right: 8px; bottom: calc(8px + var(--safe-bottom)); z-index: 97;
    width: min(80vw, 330px); display: flex; flex-direction: column; overflow: hidden;
    background: rgba(20,18,38,.55);
    -webkit-backdrop-filter: blur(30px) saturate(170%);
    backdrop-filter: blur(30px) saturate(170%);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 18px; padding: 12px 10px;
    box-shadow: 0 18px 44px rgba(0,0,0,.45);
    transform: translateX(116%); transition: transform .3s cubic-bezier(.22,.61,.36,1);
  }
  .vp-pl.show { transform: translateX(0); }
  .vp-pl-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 2px 4px 10px; }
  .vp-pl-tabs { flex: 1; display: flex; gap: 4px; min-width: 0; }   /* 复用 .pp-tab 的胶囊样式 */
  .vp-pl-empty { padding: 28px 10px; text-align: center; font-size: 13px; color: rgba(255,255,255,.6); }
  .vp-pl-rm {
    flex: none; border: none; background: transparent; color: #ff6a97;
    font-size: 13px; padding: 4px 6px; border-radius: 8px; cursor: pointer;
  }
  .vp-pl-rm:active { background: rgba(255,106,151,.2); }
  .vp-pl-close {
    flex: none; width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,.12); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .vp-pl-close:active { background: rgba(255,255,255,.25); }
  .vp-pl-list {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .vp-pl-list::-webkit-scrollbar { display: none; width: 0; }
  .vp-pl-row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; cursor: pointer; }
  .vp-pl-row:active { background: rgba(255,255,255,.12); }
  .vp-pl-row.cur { background: rgba(255,255,255,.2); }
  /* 缩略图容器：图片加载失败时露出 🎬 兜底占位（不再是裂图图标） */
  .vp-pl-thumb {
    position: relative; flex: none; width: 64px; height: 38px; border-radius: 8px; overflow: hidden;
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.5); font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .vp-pl-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .vp-pl-fav { flex: none; font-size: 12px; color: #ff6a97; }
  .vp-pl-meta { flex: 1; min-width: 0; }
  .vp-pl-name { font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vp-pl-tag { margin-top: 2px; font-size: 11px; color: rgba(255,255,255,.6); }
  .vp-title-wrap { flex: 1; min-width: 0; text-align: center; }
  .vp-title-wrap::before {
    content: "NOW PLAYING"; display: block; margin-bottom: 3px;
    font-size: 9px; font-weight: 600; letter-spacing: 2.4px; opacity: .55;
  }
  .vp-name {
    font-size: 15px; font-weight: 600; letter-spacing: .3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 1px 10px rgba(0,0,0,.35);
  }
  /* 视频舞台：圆角卡片；点画面 = 播放/暂停 */
  .vp-stage {
    flex: 1 1 auto; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    margin-top: 10px; border-radius: 18px; overflow: hidden;
    background: rgba(255,255,255,.06);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 22px 52px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.16);
  }
  /* 视频元素不加黑底，letterbox 区域才露出上面的毛玻璃 */
  .vp-stage video { width: 100%; height: 100%; object-fit: contain; background: transparent; display: block; }
  /* 中央大播放键：毛玻璃（压在画面上，深色玻璃 + 白图标，亮暗画面都看得清） */
  .vp-big {
    position: absolute; left: 50%; top: 50%; margin: -34px 0 0 -34px;
    width: 68px; height: 68px; border-radius: 50%; cursor: pointer;
    color: #fff; background: rgba(24,22,34,.42);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255,255,255,.3);
    box-shadow: 0 12px 30px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.32);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .vp-page.paused .vp-big { opacity: 1; pointer-events: auto; }
  .vp-big:active { transform: scale(.94); }
  .vp-big svg { width: 30px; height: 30px; }
  /* 毛玻璃抽屉 */
  .vp-sheet {
    flex: none; display: flex; flex-direction: column;
    margin-top: 10px; padding: 12px 14px; border-radius: 24px;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.07));
    -webkit-backdrop-filter: blur(26px) saturate(175%);
    backdrop-filter: blur(26px) saturate(175%);
    border: 1px solid rgba(255,255,255,.17);
    box-shadow: 0 -10px 42px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.26);
  }
  .vp-sheet::before {
    content: ""; display: block; width: 40px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,.3); margin: -2px auto 8px; flex: none;
  }
  .vp-progress {
    flex: none; display: flex; align-items: center; gap: 10px;
    font-size: 11px; color: rgba(255,255,255,.78); font-variant-numeric: tabular-nums;
  }
  .vp-seek {
    flex: 1; -webkit-appearance: none; appearance: none; height: 5px; border-radius: 4px;
    outline: none; cursor: pointer; border: none;
    background: linear-gradient(90deg,
      rgba(255,255,255,.95) 0 calc(var(--p, 0) * 100%),
      rgba(255,255,255,.22) calc(var(--p, 0) * 100%) 100%);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.22);
  }
  .vp-seek::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 2px solid rgba(255,255,255,.5); box-shadow: 0 2px 8px rgba(0,0,0,.45);
  }
  .vp-seek::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid rgba(255,255,255,.5);
  }
  /* 倍速（快进播放）：点一下切换 1→1.25→1.5→2→0.75 循环，非 1 倍时高亮 */
  .vp-rate {
    flex: none; margin: -6px -2px -6px 0; padding: 5px 8px; min-width: 46px;
    border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
    background: rgba(255,255,255,.1); color: #fff; cursor: pointer;
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: background .18s ease, transform .18s ease;
  }
  .vp-rate:active { transform: scale(.94); background: rgba(255,255,255,.26); }
  .vp-rate.fast { background: rgba(255,255,255,.26); border-color: rgba(255,255,255,.42); }
  .vp-rate.on { background: rgba(255,255,255,.32); border-color: rgba(255,255,255,.5); }
  /* 倍速菜单：从倍速按钮向上弹出的竖向玻璃列表 */
  .vp-rate-pop {
    position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 6;
    display: none; flex-direction: column;
    min-width: 92px; max-height: 52vh; overflow-y: auto; overscroll-behavior: contain;
    padding: 6px; border-radius: 16px;
    background: rgba(28,26,42,.5);
    -webkit-backdrop-filter: blur(20px) saturate(170%);
    backdrop-filter: blur(20px) saturate(170%);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 14px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.2);
    animation: ratePop .2s cubic-bezier(.22,.61,.36,1) both;
    scrollbar-width: none;
  }
  .vp-rate-pop.show { display: flex; }
  .vp-rate-pop::-webkit-scrollbar { display: none; width: 0; }
  @keyframes ratePop {
    from { opacity: 0; transform: translateY(8px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .vp-rate-item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 10px; border: none; border-radius: 10px; cursor: pointer;
    background: transparent; color: rgba(255,255,255,.82);
    font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap;
    transition: background .15s ease;
  }
  .vp-rate-item:active { background: rgba(255,255,255,.14); }
  .vp-rate-item .rp-tick { visibility: hidden; font-size: 12px; color: #fff; }
  .vp-rate-item.cur { background: rgba(255,255,255,.18); color: #fff; font-weight: 600; }
  .vp-rate-item.cur .rp-tick { visibility: visible; }
  /* 喜欢：进度行右端的图标式按钮（与音乐播放器同款） */
  .vp-progress .vp-fav-btn {
    flex: none; width: 32px; height: 32px; margin: -6px 0 -6px 0;
    border: none; background: transparent; box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none;
    color: rgba(255,255,255,.62); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .18s ease, color .18s ease;
  }
  .vp-progress .vp-fav-btn svg { width: 20px; height: 20px; }
  .vp-progress .vp-fav-btn:active { transform: scale(.9); color: #fff; }
  .vp-progress .vp-fav-btn.on { color: #ff6a97; }
  .vp-controls {
    position: relative; flex: none;
    display: flex; align-items: center; justify-content: space-between;
    gap: 4px; margin-top: 12px; padding: 0 2px;
  }
  .vp-controls button {
    border: 1px solid rgba(255,255,255,.15); color: #fff; cursor: pointer;
    background: rgba(255,255,255,.1);
    -webkit-backdrop-filter: blur(12px) saturate(160%);
    backdrop-filter: blur(12px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 6px 16px rgba(0,0,0,.2);
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: transform .18s ease, background .18s ease;
  }
  .vp-controls button:not(.vp-play-big) { width: 42px; height: 42px; border-radius: 50%; flex: none; }
  .vp-controls button:active { transform: scale(.9); background: rgba(255,255,255,.26); }
  /* 主播放键：毛玻璃（比侧键更亮一点，保持主次区分） */
  .vp-controls button.vp-play-big {
    width: 60px; height: 60px; border-radius: 50%; flex: none; padding: 0;
    color: #fff; border: 1px solid rgba(255,255,255,.4);
    background: rgba(255,255,255,.24);
    -webkit-backdrop-filter: blur(14px) saturate(170%);
    backdrop-filter: blur(14px) saturate(170%);
    box-shadow: 0 10px 26px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .vp-controls button.vp-play-big:active { background: rgba(255,255,255,.38); }
  .vp-controls button svg { width: 20px; height: 20px; }
  .vp-controls button.vp-play-big svg { width: 26px; height: 26px; }
  /* 播放列表只在右侧抽屉里（底部横向缩略图条已移除，把高度让给画面） */
  /* 音量：竖向悬浮玻璃条（与音乐播放器同款） */
  .vp-vol {
    position: absolute; left: -2px; bottom: calc(100% + 36px); z-index: 5;
    display: none; flex-direction: column; align-items: center; gap: 8px;
    padding: 12px 8px 10px; border-radius: 20px;
    background: rgba(28,26,42,.42);
    -webkit-backdrop-filter: blur(18px) saturate(170%);
    backdrop-filter: blur(18px) saturate(170%);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 14px 34px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.22);
    animation: volPop .22s cubic-bezier(.22,.61,.36,1) both;
  }
  .vp-vol.show { display: flex; }
  .vp-vol-slot { position: relative; width: 34px; height: 120px; }
  .vp-vol-range {
    position: absolute; left: 50%; top: 50%; width: 120px; height: 5px; margin: 0;
    transform: translate(-50%,-50%) rotate(-90deg);   /* 竖直：向上=变大 */
    -webkit-appearance: none; appearance: none; border-radius: 3px;
    outline: none; cursor: pointer; border: none;
    background: linear-gradient(90deg,
      rgba(255,255,255,.95) 0 calc(var(--v, 1) * 100%),
      rgba(255,255,255,.22) calc(var(--v, 1) * 100%) 100%);
  }
  .vp-vol-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.45);
  }
  .vp-vol-range::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: none; }
  .vp-vol-val { font-size: 11px; color: rgba(255,255,255,.85); font-variant-numeric: tabular-nums; }
  /* 旧视频预览卡片上的入口按钮 */
  .pv-head .pv-new {
    flex: none; border: 1px solid rgba(31,111,235,.35); background: rgba(31,111,235,.08);
    color: var(--primary); border-radius: 999px; padding: 6px 10px; font-size: 12px;
    font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .pv-head .pv-new:active { background: rgba(31,111,235,.18); }
</style>
</head>
<body>
  <div class="header">
    <div class="appbar">
      <button id="homeBtn" title="根目录">🏠</button>
      <div class="title" id="appTitle">文件管理</div>
      <button id="pasteBtn" class="hidden" title="完成移动/复制（长按取消）">📋</button>
      <button id="searchBtn" title="全局搜索">🔍</button>
      <button id="favBtn" title="收藏夹">⭐</button>
      <button id="moreBtn" title="更多">⋯</button>
      <button id="newFolderBtn" title="新建文件夹">＋</button>
    </div>

    <div class="breadcrumb" id="breadcrumb">
      <div class="bc-scroll" id="bcScroll"></div>
    </div>
  </div>

  <div class="list body-pad" id="list"></div>

  <div class="stats" id="stats">
    <span class="stats-left">
      <span class="conn-dot unknown" id="connDot" title="检测连接…"></span>
      <span id="statCount">—</span>
    </span>
    <span id="statSize">—</span>
  </div>

  <!-- 音乐播放器：迷你条 -->
  <div class="mini-player" id="miniPlayer">
    <div class="mp-info" id="mpInfo">
      <div class="mp-disc" id="mpDisc">🎵</div>
      <div class="mp-meta">
        <div class="mp-name" id="mpName">—</div>
        <div class="mp-lyric" id="mpLyric"></div>
      </div>
    </div>
    <button class="mp-btn" id="mpToggle" title="播放/暂停"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
    <button class="mp-btn" id="mpNext" title="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    <button class="mp-btn" id="mpDock" title="缩小为悬浮封面"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13H5v-2h14v2z"/></svg></button>
    <button class="mp-btn close" id="mpClose" title="关闭"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
  </div>

  <!-- 音乐播放器：全屏页 -->
  <div class="player-page" id="playerPage">
    <div class="pp-bg" id="ppBg"></div>
    <div class="pp-top">
      <button class="pp-collapse" id="ppCollapse" title="收起"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
      <div class="pp-title-wrap">
        <div class="pp-name" id="ppName">—</div>
        <div class="pp-artist" id="ppArtist"></div>
      </div>
      <button class="pp-list-btn" id="ppListBtn" title="播放列表"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg></button>
    </div>
    <div class="pp-disc-wrap">
      <div class="pp-disc paused" id="ppDisc"></div>
    </div>
    <!-- 毛玻璃抽屉：歌词 + 进度 + 控制 -->
    <div class="pp-sheet">
      <div class="pp-lyrics" id="ppLyrics"><div class="pp-lyr-empty">暂无歌词</div></div>
      <div class="pp-progress">
        <span id="ppCur">0:00</span>
        <input type="range" class="pp-seek" id="ppSeek" min="0" max="1000" value="0" step="1" />
        <span id="ppDur">0:00</span>
        <!-- 喜欢：收在进度行右端，跟时间一起成为一条信息带 -->
        <button class="pp-fav-btn" id="ppFavBtn" title="喜欢"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
      </div>
      <div class="pp-controls">
        <!-- 音量工具：垂直悬浮玻璃条，挂在喇叭按钮正上方（默认收起） -->
        <div class="pp-vol" id="ppVolBar">
          <span class="pp-vol-val" id="ppVolVal">100%</span>
          <div class="pp-vol-slot">
            <input type="range" class="pp-vol-range" id="ppVol" min="0" max="100" step="1" value="100" />
          </div>
        </div>
        <button id="ppVolBtn" title="音量调节"></button>
        <button id="ppPrev" title="上一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg></button>
        <button class="pp-play-big" id="ppPlayBig" title="播放/暂停"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="ppNext" title="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        <button id="ppMode" title="播放模式"></button>
      </div>
    </div>
    <div class="pp-pl-mask" id="ppPlMask"></div>
    <div class="pp-playlist" id="ppPlaylist">
      <div class="pp-pl-head">
        <div class="pp-pl-tabs">
          <button class="pp-tab active" data-tab="pl">列表<span class="t-cnt" id="cntPl"></span></button>
          <button class="pp-tab" data-tab="his">最近<span class="t-cnt" id="cntHis"></span></button>
          <button class="pp-tab" data-tab="fav">喜欢<span class="t-cnt" id="cntFav"></span></button>
        </div>
        <button class="pp-pl-close" id="ppPlClose" title="收起列表"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      </div>
      <div id="ppPlItems"></div>
      <!-- 底部按钮：固定在面板底部、悬浮在列表之上（列表滚动时它不动） -->
      <div class="pp-pl-foot">
        <button class="pp-pl-clear" id="ppPlAdd" title="添加文件夹">＋ 添加文件夹</button>
        <button class="pp-pl-clear" id="ppPlClear" style="display:none">清空</button>
      </div>
    </div>
  </div>

  <!-- 新版视频播放器（毛玻璃抽屉式，入口在视频预览卡片上） -->
  <div class="vp-page paused" id="vpPage">
    <div class="vp-bg" id="vpBg"></div>
    <div class="vp-top">
      <button class="vp-collapse" id="vpCollapse" title="收起"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></button>
      <div class="vp-title-wrap">
        <div class="vp-name" id="vpName">—</div>
      </div>
      <button class="vp-list-btn" id="vpListBtn" title="播放列表"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg></button>
    </div>
    <div class="vp-stage">
      <video id="vpVideo" playsinline webkit-playsinline preload="metadata"></video>
      <button class="vp-big" id="vpBig" title="播放/暂停"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    </div>
    <div class="vp-sheet" id="vpSheet">
      <div class="vp-progress">
        <span id="vpCur">0:00</span>
        <input type="range" class="vp-seek" id="vpSeek" min="0" max="1000" value="0" step="1" />
        <span id="vpDur">0:00</span>
        <button class="vp-rate" id="vpRate" title="播放速度（快进播放）">1.0×</button>
        <button class="vp-fav-btn" id="vpFavBtn" title="喜欢"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
        <!-- 倍速菜单：点倍速按钮向上弹出 -->
        <div class="vp-rate-pop" id="vpRatePop">
          <div class="vp-rate-list" id="vpRateList"></div>
        </div>
      </div>
      <div class="vp-controls">
        <!-- 音量：竖向悬浮玻璃条 -->
        <div class="vp-vol" id="vpVolBar">

<script>
(function () {
  "use strict";

  var SORT_KEY = "fm_mobile_sort";        // 排序偏好（localStorage 持久化）
  var VIEW_KEY = "fm_mobile_view";        // 视图：list / grid
  var state = { path: "", parentPath: null, items: [], selMode: false, selSet: {},
                sort: { mode: "name", dir: 1 }, view: "list" };
  (function () {   // 恢复上次排序/视图偏好
    var s = spLsGet(SORT_KEY, null);
    if (s && ["name", "type", "size", "time"].indexOf(s.mode) >= 0 && (s.dir === 1 || s.dir === -1)) {
      state.sort = { mode: s.mode, dir: s.dir };
    }
    var v = spLsGet(VIEW_KEY, null);
    if (v === "grid" || v === "list") state.view = v;
  })();
  var pendingOp = null;   // 待执行的移动/复制: { mode: "move"|"copy", paths: [...] }
  var lpFired = false;    // 长按已触发标记，用于抑制随后的 click
  var MOBILE_IMG_EXT = ["jpg","jpeg","png","gif","bmp","webp","heic","tiff","svg"];
  var VIDEO_EXT = ["mp4","webm","mkv","mov","avi","flv","wmv","m4v","mpg","mpeg","ts","3gp","ogv"];
  var AUDIO_EXT = ["mp3","wav","ogg","flac","aac","m4a","opus","wma","mid","midi"];
  var TEXT_EXT = ["txt","md","log","json","csv","xml","yml","yaml","ini","conf","cfg","toml","py","js","ts","css","html","htm","sh","bat","c","cpp","h","java","go","rs","php","sql","gitignore"];
  var ARCHIVE_EXT = ["zip","rar","7z","tar","gz","tgz","bz2","xz"];

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function extOf(name) {
    var i = name.lastIndexOf(".");
    return i >= 0 ? name.slice(i + 1).toLowerCase() : "";
  }
  function isDir(item) { return !!item.is_dir; }
  function joinPath(base, name) {
    if (!base || base === "/") return "/" + name;
    return base.replace(/\/+$/, "") + "/" + name;
  }
  function itemAbs(item) {
    // 搜索结果自带绝对路径；普通列表项按当前目录拼接
    if (item.abs_path) return item.abs_path;
    return joinPath(state.path, item.name);
  }

  function iconFor(item) {
    if (isDir(item)) return "📁";
    var ext = extOf(item.name);
    if (MOBILE_IMG_EXT.indexOf(ext) >= 0) return "🖼️";
    if (VIDEO_EXT.indexOf(ext) >= 0) return "🎬";
    if (AUDIO_EXT.indexOf(ext) >= 0) return "🎵";
    if (ext === "pdf") return "📕";
    // Office 文档
    if (ext === "xls" || ext === "xlsx" || ext === "csv") return "📊";
    if (ext === "ppt" || ext === "pptx") return "📽️";
    if (ext === "doc" || ext === "docx" || ext === "wps" || ext === "rtf") return "📝";
    if (ARCHIVE_EXT.indexOf(ext) >= 0) return "📦";
    // 应用 / 安装包 / 镜像 / 种子：不用文本图标
    if (ext === "apk") return "📱";
    if (ext === "exe" || ext === "msi") return "💻";
    if (ext === "dmg" || ext === "iso") return "💿";
    if (ext === "torrent") return "🧲";
    if (TEXT_EXT.indexOf(ext) >= 0) return "📄";
    return "📄";
  }
  // 常见文本/代码格式的彩色扩展名徽标：[标签, 背景色, 文字色]
  var EXT_BADGE = {
    js: ["JS", "#f7df1e", "#3b3300"], mjs: ["JS", "#f7df1e", "#3b3300"], cjs: ["JS", "#f7df1e", "#3b3300"],
    jsx: ["JSX", "#61dafb", "#00303f"],
    ts: ["TS", "#3178c6", "#fff"], tsx: ["TSX", "#3178c6", "#fff"],
    json: ["{}", "#7cb342", "#fff"], jsonc: ["{}", "#7cb342", "#fff"],
    md: ["MD", "#42a5f5", "#fff"], markdown: ["MD", "#42a5f5", "#fff"],
    html: ["<>", "#e44d26", "#fff"], htm: ["<>", "#e44d26", "#fff"],
    vue: ["VUE", "#42b883", "#fff"],
    css: ["#", "#1565c0", "#fff"], scss: ["SCSS", "#c6538c", "#fff"], less: ["LESS", "#2f6db3", "#fff"],
    py: ["PY", "#3572a5", "#fff"],
    sh: ["$", "#89e051", "#1d3b00"], bash: ["$", "#89e051", "#1d3b00"], zsh: ["$", "#89e051", "#1d3b00"],
    bat: ["BAT", "#7a9f35", "#fff"], cmd: ["BAT", "#7a9f35", "#fff"], ps1: ["PS", "#5391fe", "#fff"],
    c: ["C", "#0288d1", "#fff"], h: ["H", "#7e8c9a", "#fff"],
    cpp: ["C++", "#f34b7d", "#fff"], hpp: ["C++", "#f34b7d", "#fff"], cc: ["C++", "#f34b7d", "#fff"],
    java: ["JVA", "#b07219", "#fff"], kt: ["KT", "#a97bff", "#fff"],
    go: ["GO", "#00add8", "#fff"], rs: ["RS", "#dea584", "#3b2104"],
    php: ["PHP", "#777bb4", "#fff"], rb: ["RB", "#cc342d", "#fff"],
    sql: ["SQL", "#e38c00", "#fff"],
    xml: ["XML", "#0060ac", "#fff"],
    yml: ["YML", "#cb171e", "#fff"], yaml: ["YML", "#cb171e", "#fff"],
    toml: ["CFG", "#607d8b", "#fff"], ini: ["CFG", "#607d8b", "#fff"],
    cfg: ["CFG", "#607d8b", "#fff"], conf: ["CFG", "#607d8b", "#fff"], env: ["ENV", "#607d8b", "#fff"],
    txt: ["TXT", "#9e9e9e", "#fff"], log: ["LOG", "#78909c", "#fff"],
    csv: ["CSV", "#2e7d32", "#fff"], tsv: ["CSV", "#2e7d32", "#fff"],
    gitignore: ["GIT", "#f14e32", "#fff"], gitattributes: ["GIT", "#f14e32", "#fff"]
  };
  // 特殊文件名（无扩展名或按文件名识别）
  var FILENAME_BADGE = {
    dockerfile: ["🐳", "#2496ed", "#fff"],
    makefile: ["MK", "#6a737d", "#fff"],
    license: ["©", "#8d6e63", "#fff"],
    "license.md": ["©", "#8d6e63", "#fff"]
  };

  // 优先返回彩色徽标 HTML；未命中返回 emoji（与 iconFor 一致）
  function iconHtmlFor(item) {
    if (isDir(item)) return iconFor(item);
    var ext = extOf(item.name);
    var hit = EXT_BADGE[ext] || FILENAME_BADGE[String(item.name || "").toLowerCase()];
    if (!hit) return iconFor(item);
    return '<span class="ext-badge" style="background:' + hit[1] + ';color:' + hit[2] + '">' +
      esc(hit[0]) + '</span>';
  }

  // 弹窗/卡片标题用的小缩略块：可出缩略图的用真图，否则用彩色扩展名徽标/图标（与列表项同款）
  function _titleThumbHtml(item) {
    if (!isDir(item) && canThumb(item)) {
      return '<img loading="lazy" src="/api/thumbnail?path=' +
        encodeURIComponent(itemAbs(item)) + '" alt="" onerror="this.parentNode.textContent=\'' +
        iconFor(item) + '\'">';
    }
    return iconHtmlFor(item);
  }

  function fileTypeName(item) {
    // "后缀 + 中文类型"提示，如 "ZIP 压缩包"；目录返回 "文件夹"
    if (isDir(item)) return "文件夹";
    var ext = extOf(item.name);
    if (!ext) return "文件";
    var map = {
      jpg: "图片", jpeg: "图片", png: "图片", gif: "图片", webp: "图片", bmp: "图片",
      svg: "图片", ico: "图标", heic: "图片", tif: "图片", tiff: "图片",
      mp4: "视频", avi: "视频", mkv: "视频", mov: "视频", wmv: "视频", flv: "视频",
      webm: "视频", m4v: "视频", rmvb: "视频", ts: "视频", mpg: "视频",
      mp3: "音频", wav: "音频", flac: "音频", aac: "音频", ogg: "音频", m4a: "音频", wma: "音频",
      pdf: "PDF 文档", doc: "Word 文档", docx: "Word 文档", wps: "文档",
      xls: "Excel 表格", xlsx: "Excel 表格", csv: "表格",
      ppt: "PPT 演示", pptx: "PPT 演示",
      txt: "文本", md: "Markdown 笔记", log: "日志", rtf: "文档",
      zip: "压缩包", rar: "压缩包", "7z": "压缩包", tar: "压缩包", gz: "压缩包",
      bz2: "压缩包", xz: "压缩包", tgz: "压缩包",
      html: "网页", htm: "网页", css: "样式表", js: "脚本", json: "数据", xml: "数据",
      py: "脚本", sh: "脚本", bat: "脚本", java: "代码", c: "代码", cpp: "代码",
      exe: "程序", msi: "安装包", apk: "安装包", dmg: "镜像", iso: "镜像", torrent: "种子"
    };
    var label = map[ext];
    return ext.toUpperCase() + (label ? " " + label : " 文件");
  }
  function canThumb(item) {
    if (isDir(item)) return false;
    var ext = extOf(item.name);
    return MOBILE_IMG_EXT.indexOf(ext) >= 0 || VIDEO_EXT.indexOf(ext) >= 0;
  }

  // ---------- 加载目录 ----------
  function showLoading(on) {
    document.getElementById("loading").classList.toggle("show", !!on);
  }
  // 提示条同时只显示一条：新提示先顶掉旧的（含旧定时器），不堆叠
  var _toastEl = null, _toastFade = null, _toastKill = null;
  function toast(msg, type) {
    var wrap = document.getElementById("toastWrap");
    if (_toastFade) { clearTimeout(_toastFade); _toastFade = null; }
    if (_toastKill) { clearTimeout(_toastKill); _toastKill = null; }
    if (_toastEl && _toastEl.parentNode) _toastEl.parentNode.removeChild(_toastEl);
    var el = document.createElement("div");
    el.className = "toast" + (type ? " " + type : "");
    el.textContent = msg;
    wrap.appendChild(el);
    _toastEl = el;
    _toastFade = setTimeout(function () { el.style.opacity = "0"; el.style.transition = "opacity .3s"; }, 1800);
    _toastKill = setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
      if (_toastEl === el) _toastEl = null;
    }, 2200);
  }

  // ---------- 多选模式 ----------
  function bindLongPress(el, fn) {
    var t = null;
    el.addEventListener("touchstart", function () {
      t = setTimeout(function () { t = null; lpFired = true; fn(); }, 500);
    }, { passive: true });
    ["touchmove", "touchend"].forEach(function (ev) {
      el.addEventListener(ev, function () { if (t) { clearTimeout(t); t = null; } }, { passive: true });
    });
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); fn(); });
  }
  function enterSelMode() {
    if (state.selMode) return;
    state.selMode = true;
    state.selSet = {};
    document.getElementById("selBar").classList.add("show");
    document.getElementById("searchBtn").disabled = true;
    document.getElementById("newFolderBtn").disabled = true;
    renderList(); updateSelTitle();
  }
  function exitSelMode() {
    if (!state.selMode) return;
    state.selMode = false;
    state.selSet = {};
    document.getElementById("selBar").classList.remove("show");
    document.getElementById("searchBtn").disabled = false;
    document.getElementById("newFolderBtn").disabled = false;
    renderList(); updateSelTitle();
  }
  function toggleSel(abs) {
    if (state.selSet[abs]) delete state.selSet[abs];
    else state.selSet[abs] = true;
    // 只更新当前卡片的勾选状态，不重建列表，避免缩略图重新请求/闪烁
    var row = document.querySelector('#list [data-abs="' + abs.replace(/"/g, '\\"') + '"]');
    if (row) {
      var chk = row.querySelector(".sel-check");
      if (chk) chk.classList.toggle("on", !!state.selSet[abs]);
      row.classList.toggle("sel-on", !!state.selSet[abs]);
    }
    updateSelTitle();
  }
  function selCount() { return Object.keys(state.selSet).length; }
  function selPaths() { return Object.keys(state.selSet); }
  function updateSelTitle() {
    var el = document.getElementById("appTitle");
    if (state.selMode) { el.textContent = "已选 " + selCount() + " 项"; return; }
    el.textContent = (state.path === "/" || !state.path) ? "根目录" : state.path.split("/").filter(Boolean).pop();
  }
  document.getElementById("selAllBtn").addEventListener("click", function () {
    var all = selCount() === state.items.length;
    state.selSet = {};
    if (!all) state.items.forEach(function (it) { state.selSet[itemAbs(it)] = true; });
    // 仅更新各卡片勾选状态，不重建列表，避免缩略图重请求/闪烁
    document.querySelectorAll("#list .item").forEach(function (row) {
      var on = !!state.selSet[row.getAttribute("data-abs")];
      var chk = row.querySelector(".sel-check");
      if (chk) chk.classList.toggle("on", on);
      row.classList.toggle("sel-on", on);
    });
    updateSelTitle();
  });
  document.getElementById("selCancelBtn").addEventListener("click", exitSelMode);
  document.getElementById("selMoveBtn").addEventListener("click", function () {
    var paths = selPaths();

  document.getElementById("selDelBtn").addEventListener("click", function () {

  function batchDelete(paths) {

  document.getElementById("selZipBtn").addEventListener("click", function () {

              is_dir: false, size: dd.result.size || 0,
