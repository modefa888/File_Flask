  document.getElementById("ppLyrics").addEventListener("touchstart", function () {
    _lrcHoldUntil = Date.now() + 3500;
  }, { passive: true });
  document.getElementById("ppLyrics").addEventListener("wheel", function () {
    _lrcHoldUntil = Date.now() + 3500;
  }, { passive: true });

  // 歌词常驻显示于唱片下方，无需视图切换

  function openAudioPlayer(item, contextItems, folderDir) {
    var src = (contextItems && contextItems.length) ? contextItems : (state.items || []);
    _plItems = src.filter(function (it) { return !isDir(it) && _isAudio(it); });
    if (!_plItems.length) { toast("该目录没有可播放的音频", "warn"); return; }
    // 保存上下文供封面/歌词匹配：来自指定目录/当前目录的列表可直接复用，搜索结果则按需拉取
    _ctxItems = src;
    _ctxDir = folderDir || ((contextItems && contextItems.length) ? null : (state.path || "/"));
    _plFolder = folderDir || state.path || "";
    if (folderDir) _grpSet(_plItems, folderDir);   // 记录分组根文件夹
    var idx = -1;
    for (var i = 0; i < _plItems.length; i++) {
      if (itemAbs(_plItems[i]) === itemAbs(item)) { idx = i; break; }
    }
    if (idx < 0) idx = 0;
    _mergeSavedPlaylist();   // 并回之前手动添加的歌曲，避免积累列表被重建冲掉
    _saveUserPlaylist();
    _renderTab();
    playIndex(idx, true);
    _showMini(true);
    // 单曲上下文（如一歌一文件夹布局）：自动向上扫描父目录汇总播放列表
    if (_plItems.length <= 1) _tryExpandPlaylist(itemAbs(item));
  }

  // 播放列表只有单曲时：查看父目录，若其下有子文件夹（或直接音频），
  // 则拉取全部音频汇成完整播放列表，当前歌保持播放
  function _tryExpandPlaylist(curAbs) {
    var dir = _plFolder || _dirnameOf(curAbs);
    var parent = _dirOf(dir);
    if (!parent || parent === dir) return;          // 已是根目录
    _fetchDirItems(parent)
      .then(function (items) {
        var subs = items.filter(function (it) { return isDir(it); });
        var direct = items.filter(function (it) { return !isDir(it) && _isAudio(it); });
        if (!subs.length) return null;              // 父目录无子文件夹，维持单曲
        if (subs.length > 40) subs = subs.slice(0, 40);
        return Promise.all(subs.map(function (sd) {
          return _fetchDirItems(itemAbs(sd))
            .then(function (list) {
              return list.filter(function (it) { return !isDir(it) && _isAudio(it); });
            })
            .catch(function () { return []; });
        })).then(function (arrs) {
          var all = direct.slice();
          arrs.forEach(function (a) { all = all.concat(a); });
          return all;
        });
      })
      .then(function (all) {
        if (!all || all.length <= 1) return;
        // 已切歌/播放列表已变化则放弃
        if (_plIndex < 0 || !_plItems[_plIndex] || itemAbs(_plItems[_plIndex]) !== curAbs) return;
        var idx = 0;
        for (var i = 0; i < all.length; i++) {
          if (itemAbs(all[i]) === curAbs) { idx = i; break; }
        }
        _plItems = all;
        _ctxItems = all;
        _ctxDir = null;                             // 各曲目目录不同，按曲目所在目录拉取封面/歌词
        _plFolder = parent;
        _plIndex = idx;
        _renderTab();
      })
      .catch(function () {});
  }

  function playIndex(i, autoplay) {
    if (i < 0 || i >= _plItems.length) return;
    _plIndex = i;
    var it = _plItems[i];
    var abs = itemAbs(it);
    var tr = _parseTrack(it.name);
    _audio.src = "/api/stream?path=" + encodeURIComponent(abs);
    _audio.load();
    document.getElementById("mpName").textContent = tr.artist ? (tr.title + " · " + tr.artist) : tr.title;
    document.getElementById("ppName").textContent = tr.title;
    document.getElementById("ppArtist").textContent = tr.artist || "未知艺术家";
    document.getElementById("playerPage").style.background = _coverColor(it.name);
    var sk0 = document.getElementById("ppSeek");   // 换曲后进度归零，填充比例同步重置
    sk0.value = 0; sk0.style.setProperty("--p", "0");
    _lrcIdx = -1;
    _loadExtras(abs);          // 匹配同名封面 + .lrc 歌词
    _highlightPlaylist();
    _pushHistory(it);          // 写入最近播放
    _syncFavBtn();
    if (typeof MediaMetadata !== "undefined" && navigator.mediaSession) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: tr.title, artist: tr.artist || "", album: "文件管理"
        });
      } catch (e) {}
    }
    if (autoplay) _audio.play().catch(function () {});
    _syncPlayIcon(_audio.paused);
  }

  var _svgPlay = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  var _svgPause = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';

  function _syncPlayIcon(paused) {

    document.getElementById("mpToggle").innerHTML = ico;
    document.getElementById("ppPlayBig").innerHTML = ico;
    document.getElementById("mpDisc").classList.toggle("paused", paused);

  function _showMini(show) {

  }

  function _renderPlaylist() {
    _dedupePlaylist();                     // 渲染前兜底去重
    var wrap = document.getElementById("ppPlItems");
    wrap.innerHTML = "";
    document.getElementById("cntPl").textContent = _plItems.length ? "(" + _plItems.length + ")" : "";
    // 预统计每个分组的歌曲数，用于判断是否隐藏冗余标题
    var grpCount = {};
    _plItems.forEach(function (it) {
      var g = _grpNameOf(itemAbs(it));
      grpCount[g] = (grpCount[g] || 0) + 1;
    });
    var lastDir = null;
    _plItems.forEach(function (it, i) {
      // 按「添加时的根文件夹」分组，变化时插入分隔标题
      var gname = _grpNameOf(itemAbs(it));
      if (gname !== lastDir) {
        lastDir = gname;
        // 分组里只有一首、且歌名与分组名一致/以其开头（歌独占同名文件夹）：标题与歌名重复，隐藏
        var norm = function (s) { return String(s).toLowerCase().replace(/\s+/g, ""); };
        var soloRedundant = grpCount[gname] === 1 &&
          norm(_baseOf(it.name)).indexOf(norm(gname)) === 0;
        if (!soloRedundant) {
          var g = document.createElement("div");
          g.className = "pl-group";
          g.textContent = "📁 " + gname;
          wrap.appendChild(g);
        }
      }
      var tr = _parseTrack(it.name);
      var d = document.createElement("div");
      d.className = "pl-item" + (i === _plIndex ? " cur" : "");
      d.innerHTML = '<span class="pl-ico">🎵</span><span class="pl-name">' + esc(tr.title) + '</span><button class="pl-fav' + (_isFav(it) ? " on" : "") + '" title="喜欢">' + _svgHeart + '</button>';
      d.addEventListener("click", function () { playIndex(i, true); _showMini(true); });
      d.querySelector(".pl-fav").addEventListener("click", function (e) {
        e.stopPropagation(); _toggleFav(it); _renderTab(); _syncFavBtn();
      });
      wrap.appendChild(d);
    });
    _highlightPlaylist();
  }

  // ===== 播放历史 / 喜欢列表（localStorage 持久化）=====
  var _plTab = "pl";
  var _svgHeart = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';

  function _plStore(key) {
    try { return JSON.parse(localStorage.getItem(key) || "[]"); } catch (e) { return []; }
  }
  function _plSave(key, arr) { try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {} }
  function _recItem(rec) { return { abs_path: rec.p, name: rec.n }; }
  function _isFav(it) {
    var k = itemAbs(it);
    return _plStore("ff_music_favs").some(function (r) { return r.p === k; });
  }
  function _toggleFav(it) {
    var k = itemAbs(it);
    var had = _isFav(it);
    var arr = _plStore("ff_music_favs").filter(function (r) { return r.p !== k; });
    if (!had) arr.unshift({ p: k, n: it.name, d: _dirOf(k) });
    _plSave("ff_music_favs", arr);
  }
  function _pushHistory(it) {
    var k = itemAbs(it);
    var arr = _plStore("ff_music_history").filter(function (r) { return r.p !== k; });
    arr.unshift({ p: k, n: it.name, d: _dirOf(k) });
    if (arr.length > 50) arr.length = 50;
    _plSave("ff_music_history", arr);
  }
  function _dirOf(abs) {
    var i = abs.lastIndexOf("/");
    return i > 0 ? abs.slice(0, i) : "/";
  }

  // ===== 播放列表分组：按「添加进列表时的根文件夹」分组 =====
  var _grpStore = (function () {
    try { return JSON.parse(localStorage.getItem("ff_music_groups") || "{}"); } catch (e) { return {}; }
  })();
  function _grpSave() { try { localStorage.setItem("ff_music_groups", JSON.stringify(_grpStore)); } catch (e) {} }
  function _grpNameOf(abs) {
    if (_grpStore[abs]) return _grpStore[abs];               // 优先用添加时的根文件夹名
    var d = _dirOf(abs);
    return d === "/" ? "/" : (d.split("/").pop() || d);      // 兜底：直接所在目录名
  }
  function _grpSet(items, rootDir) {
    var name = !rootDir || rootDir === "/" ? "/" : (rootDir.split("/").pop() || rootDir);
    items.forEach(function (it) { _grpStore[itemAbs(it)] = name; });
    _grpSave();
  }
  // 歌曲唯一键：解析后的歌名（忽略大小写/空格/连接符），文件改名也能识别为同一首
  function _songKey(name) {
    return _parseTrack(String(name || "")).title.toLowerCase().replace(/[\s\-_.]+/g, "");
  }
  // 播放列表整体去重：同歌名只保留最先出现的一条
  function _dedupePlaylist() {
    var seen = {};
    for (var i = _plItems.length - 1; i >= 0; i--) {
      var k = _songKey(_plItems[i].name);
      if (seen[k]) {
        var staleAbs = itemAbs(_plItems[i]);
        _plItems.splice(i, 1);
        if (_plIndex >= i) _plIndex--;
        for (var j = _ctxItems.length - 1; j >= 0; j--) {
          try { if (itemAbs(_ctxItems[j]) === staleAbs) _ctxItems.splice(j, 1); } catch (e) {}
        }
      } else seen[k] = 1;
    }
  }
  // 「添加到音乐播放列表」积累的歌曲持久化：点开其它目录播放重建队列时不会丢失
  function _saveUserPlaylist() {
    _plSave("ff_music_user_pl", _plItems.map(function (it) { return { p: itemAbs(it), n: it.name }; }));
  }
  function _mergeSavedPlaylist() {
    var saved = _plStore("ff_music_user_pl");
    if (!saved.length) return;
    var have = {};
    _plItems.forEach(function (it) { have[itemAbs(it)] = 1; });
    saved.forEach(function (r) {
      if (r && r.p && !have[r.p]) { _plItems.push(_recItem(r)); have[r.p] = 1; }
    });
    _dedupePlaylist();
  }
  // 页面加载/项目重启后恢复上次保存的播放列表（不自动播放，点列表行即播）
  (function _restorePlaylist() {
    var saved = _plStore("ff_music_user_pl");
    if (!saved.length) return;
    _plItems = saved.filter(function (r) { return r && r.p && r.n; }).map(_recItem);

  // 点历史/喜欢列表：拉取文件所在目录列表，恢复整个文件夹播放队列后定位到该曲。
  // 文件在原目录找不到（被移动/改名）时，用搜索按文件名找回新位置并修正记录。
  function _healRecord(rec) {
    var kw = rec.n.replace(/\.[^.]+$/, "");
    return fetchTimeout("/api/search?keyword=" + encodeURIComponent(kw) + "&use_index=1&timeout=15", 20000)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var items = (d && d.items) || [];
        if (!items.length) return null;
        for (var i = 0; i < items.length; i++) {
          var ap = items[i].abs_path || "";
          if (!isDir(items[i]) && _isAudio(items[i]) &&
              (ap === rec.p || ap.split("/").pop() === rec.n)) {
            return { p: ap, n: rec.n, d: _dirOf(ap) };
          }
        }
        return null;
      })
      .catch(function () { return null; });
  }
  function _updateStoredRec(oldP, fixed) {
    ["ff_music_history", "ff_music_favs"].forEach(function (key) {
      var arr = _plStore(key);
      var changed = false;
      arr.forEach(function (r) {
        if (r.p === oldP) { r.p = fixed.p; r.d = fixed.d; changed = true; }
      });
      if (changed) _plSave(key, arr);
    });
  }
  function _playFromRecord(rec) {
    var dir = rec.d || _dirOf(rec.p);
    var fallback = function () {
      _closePlaylist();
      openAudioPlayer(_recItem(rec), [_recItem(rec)], dir);   // 彻底找不到：按旧路径单曲兜底
    };
    _fetchDirItems(dir)
      .then(function (items) {
        var hit = null;
        for (var i = 0; i < items.length; i++) {
          if (!isDir(items[i]) && _isAudio(items[i]) && itemAbs(items[i]) === rec.p) { hit = items[i]; break; }
        }
        if (hit) {
          _closePlaylist();
          openAudioPlayer(hit, items, dir);      // 恢复文件夹队列
          return null;
        }
        // 原目录没有该文件：尝试按文件名搜索新位置（文件被移动/改名的情况）
        return _healRecord(rec).then(function (fixed) {
          if (!fixed) { fallback(); return null; }
          _updateStoredRec(rec.p, fixed);        // 修正历史/喜欢里的旧路径
          return _fetchDirItems(fixed.d).then(function (items2) {
            var hit2 = null;
            for (var j = 0; j < items2.length; j++) {
              if (!isDir(items2[j]) && _isAudio(items2[j]) && itemAbs(items2[j]) === fixed.p) { hit2 = items2[j]; break; }
            }
            _closePlaylist();
            if (hit2) openAudioPlayer(hit2, items2, fixed.d);   // 新位置恢复文件夹队列
            else openAudioPlayer(_recItem(fixed), [_recItem(fixed)], fixed.d);

        });

      .catch(fallback);

  function _scanDirSongs(dir) {

      var songs = items.filter(function (it) { return !isDir(it) && _isAudio(it); });
      var subs = items.filter(function (it) { return isDir(it); }).slice(0, 40);
      return Promise.all(subs.map(function (sd) {

          .then(function (l) { return l.filter(function (it) { return !isDir(it) && _isAudio(it); }); })

            if (_songKey(_plItems[i].name) === sk) { first = i; break; }

                if (_songKey(_ctxItems[j].name) === sk) { _ctxItems[j] = s; break; }
              }

            return;

          if (!have[itemAbs(s)]) { _plItems.push(s); _ctxItems.push(s); added.push(s); addedCount++; }
        });
        _dedupePlaylist();                     // 兜底：清掉残余的重复条目
        _saveUserPlaylist();                   // 持久化当前播放列表
        if (addedCount) _grpSet(added, dir);   // 分组名 = 添加时的根文件夹
        if (_plIndex < 0 && _plItems.length) { playIndex(0, true); _showMini(true); }

    range.style.setProperty("--v", v.toFixed(3));
    document.getElementById("vpVolVal").textContent = Math.round(v * 100) + "%";
    document.getElementById("vpVolBtn").innerHTML = v > 0 ? _svgVolOn : _svgVolOff;
    if (save) { try { localStorage.setItem("ff_music_vol", String(Math.round(v * 100))); } catch (e) {} }
  }
  function vpRestoreVolume() {
    try {
      var lv = parseInt(localStorage.getItem("ff_music_vol"), 10);
      if (isFinite(lv)) vpVideo.volume = Math.max(0, Math.min(1, lv / 100));
    } catch (e) {}
    vpApplyVolume(false);
  }
  // items: [{name, abs}]，idx 为当前播放项
  function openVPlayer(items, idx) {
    if (!items || !items.length) return;
    vpList = items.map(function (x) { return { name: x.name, abs: x.abs || x.abs_path }; });
    vpIndex = Math.max(0, Math.min(idx || 0, vpList.length - 1));
    vpPage.classList.add("show");
    vpRestoreVolume();
    vpRestoreRate();
    vpPlayIndex(vpIndex, true);
  }
  function closeVPlayer() {
    vpVideo.pause();
    try { vpVideo.removeAttribute("src"); vpVideo.load(); } catch (e) {}
    vpPage.classList.remove("show");
    document.getElementById("vpVolBar").classList.remove("show");
    vpCloseRatePop();
    vpClosePlaylist();
    if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
  }

  document.getElementById("vpCollapse").addEventListener("click", closeVPlayer);
  document.getElementById("vpPlay").addEventListener("click", vpToggle);
  document.getElementById("vpBig").addEventListener("click", vpToggle);
  vpVideo.addEventListener("click", vpToggle);        // 点画面也能播放/暂停
  document.getElementById("vpPrev").addEventListener("click", function () {
    if (vpIndex > 0) vpPlayIndex(vpIndex - 1, true);
    else { vpVideo.currentTime = 0; var pp = vpVideo.play(); if (pp && pp.catch) pp.catch(function () {}); }
  });
  document.getElementById("vpNext").addEventListener("click", function () {
    if (vpIndex < vpList.length - 1) vpPlayIndex(vpIndex + 1, true);
  });
  // 播放列表抽屉：☰ 打开/收起，按钮有高亮状态反馈
  // 缩略图：封面拉不到时露出 🎬 兜底，不出现裂图
  function vpThumbEl(abs) {
    var thumb = document.createElement("span");
    thumb.className = "vp-pl-thumb";
    thumb.textContent = "🎬";
    var img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.src = "/api/thumbnail?path=" + encodeURIComponent(abs);
    img.onerror = function () { img.remove(); };
    thumb.appendChild(img);
    return thumb;
  }
  function vpPlCounts() {
    document.getElementById("vpCntPl").textContent = vpList.length || "";
    document.getElementById("vpCntFav").textContent = vpFavList().length || "";
  }
  function vpSetTab(t) {
    vpPlTab = t;
    Array.prototype.forEach.call(document.querySelectorAll("#vpPl .pp-tab"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === t);
    });
    vpRenderPlaylist();
  }
  var vpPlTab = "pl";
  function vpRenderPlaylist() {
    var box = document.getElementById("vpPlList");
    box.innerHTML = "";
    vpPlCounts();
    if (vpPlTab === "fav") { vpRenderFavList(box); return; }
    // ---- 播放列表 tab：当前播放队列 ----
    vpList.forEach(function (it, i) {
      var row = document.createElement("div");
      row.className = "vp-pl-row" + (i === vpIndex ? " cur" : "");
      var meta = document.createElement("div");
      meta.className = "vp-pl-meta";
      var nm = document.createElement("div");
      nm.className = "vp-pl-name";
      nm.textContent = it.name;
      nm.title = it.name;
      var tag = document.createElement("div");
      tag.className = "vp-pl-tag";
      tag.textContent = (i === vpIndex) ? "正在播放" : ("第 " + (i + 1) + " 个");
      meta.append(nm, tag);
      row.append(vpThumbEl(it.abs), meta);
      if (vpIsFav(it.abs)) {
        var h = document.createElement("span");
        h.className = "vp-pl-fav";
        h.textContent = "♥";
        h.title = "已喜欢";
        row.appendChild(h);
      }
      row.addEventListener("click", function () {
        vpClosePlaylist();
        if (i !== vpIndex) vpPlayIndex(i, true);
      });
      box.appendChild(row);
    });
    var cur = box.querySelector(".vp-pl-row.cur");
    if (cur) try { cur.scrollIntoView({ block: "center" }); } catch (e) {}
  }
  // ---- 喜欢 tab：收藏的视频（点一行以「喜欢」为播放队列续播；右侧 ♥ 取消收藏）----
  function vpRenderFavList(box) {
    var favs = vpFavList();
    if (!favs.length) {
      var empty = document.createElement("div");
      empty.className = "vp-pl-empty";
      empty.textContent = "还没有喜欢的视频（播放页点 ♥ 收藏）";
      box.appendChild(empty);
      return;
    }
    var curAbs = (vpIndex >= 0 && vpList[vpIndex]) ? vpList[vpIndex].abs : "";
    favs.forEach(function (f, i) {
      var row = document.createElement("div");
      row.className = "vp-pl-row" + (f.p === curAbs ? " cur" : "");
      var meta = document.createElement("div");
      meta.className = "vp-pl-meta";
      var nm = document.createElement("div");
      nm.className = "vp-pl-name";
      nm.textContent = f.n || pathBaseName(f.p);
      nm.title = f.p;
      var tag = document.createElement("div");
      tag.className = "vp-pl-tag";
      tag.textContent = f.d ? (pathBaseName(f.d) || "/") : "/";
      meta.append(nm, tag);
      var rm = document.createElement("button");
      rm.type = "button";
      rm.className = "vp-pl-rm";
      rm.title = "取消喜欢";
      rm.textContent = "♥";
      rm.addEventListener("click", function (ev) {
        ev.stopPropagation();
        try {
          localStorage.setItem(VP_FAV_KEY, JSON.stringify(
            vpFavList().filter(function (x) { return x.p !== f.p; })));
        } catch (e2) {}
        vpSyncFavBtn();
        vpRenderPlaylist();
        toast("已取消喜欢");
      });
      row.append(vpThumbEl(f.p), meta, rm);
      row.addEventListener("click", function () {
        vpClosePlaylist();
        // 以「喜欢」作为播放队列，方便在收藏里上下切换
        vpList = favs.map(function (x) { return { name: x.n || pathBaseName(x.p), abs: x.p }; });
        vpPlayIndex(i, true);
      });
      box.appendChild(row);
    });
    var cur = box.querySelector(".vp-pl-row.cur");
    if (cur) try { cur.scrollIntoView({ block: "center" }); } catch (e) {}
  }
  function vpOpenPlaylist() {
    vpRenderPlaylist();
    document.getElementById("vpPlMask").classList.add("show");
    document.getElementById("vpPl").classList.add("show");
    document.getElementById("vpListBtn").classList.add("on");
  }
  function vpClosePlaylist() {
    document.getElementById("vpPlMask").classList.remove("show");
    document.getElementById("vpPl").classList.remove("show");
    document.getElementById("vpListBtn").classList.remove("on");
  }
  document.getElementById("vpListBtn").addEventListener("click", function () {
    if (document.getElementById("vpPl").classList.contains("show")) vpClosePlaylist();
    else vpOpenPlaylist();
  });
  document.getElementById("vpPlClose").addEventListener("click", vpClosePlaylist);
  document.getElementById("vpPlMask").addEventListener("click", vpClosePlaylist);
  // 两个 tab：播放列表 / 喜欢
  Array.prototype.forEach.call(document.querySelectorAll("#vpPl .pp-tab"), function (b) {
    b.addEventListener("click", function () { vpSetTab(b.getAttribute("data-tab")); });
  });

  // 喜欢：视频独立收藏列表（localStorage 持久化，键 ff_video_favs）
  var VP_FAV_KEY = "ff_video_favs";
  function vpFavList() {
    try { return JSON.parse(localStorage.getItem(VP_FAV_KEY) || "[]"); } catch (e) { return []; }
  }
  function vpIsFav(abs) {
    return vpFavList().some(function (r) { return r.p === abs; });
  }
  function vpSyncFavBtn() {
    var on = vpIndex >= 0 && vpList[vpIndex] && vpIsFav(vpList[vpIndex].abs);
    document.getElementById("vpFavBtn").classList.toggle("on", !!on);
  }
  document.getElementById("vpFavBtn").addEventListener("click", function () {
    if (vpIndex < 0 || !vpList[vpIndex]) return;
    var it = vpList[vpIndex], abs = it.abs;
    var hit = vpIsFav(abs);
    var list = vpFavList().filter(function (r) { return r.p !== abs; });
    if (!hit) list.unshift({ p: abs, n: it.name, d: abs.slice(0, abs.lastIndexOf("/")) || "/" });
    try { localStorage.setItem(VP_FAV_KEY, JSON.stringify(list)); } catch (e) {}
    vpSyncFavBtn();
    if (document.getElementById("vpPl").classList.contains("show")) vpRenderPlaylist();
    toast(hit ? "已取消喜欢" : "已加入喜欢");
  });
  document.getElementById("vpFs").addEventListener("click", function () {
    if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} return; }
    if (vpVideo.requestFullscreen) vpVideo.requestFullscreen().catch(function () {});
    else if (vpVideo.webkitEnterFullscreen) { try { vpVideo.webkitEnterFullscreen(); } catch (e) {} }  // iOS Safari
  });
  vpVideo.addEventListener("play", vpSyncPlayIcon);
  vpVideo.addEventListener("pause", vpSyncPlayIcon);
  vpVideo.addEventListener("loadedmetadata", function () {
    document.getElementById("vpDur").textContent = _fmtTime(vpVideo.duration);
  });
  var vpSeeking = false;      // 手指按在进度条上时不回写滑块，避免和播放进度"抢"
  vpVideo.addEventListener("timeupdate", function () {
    if (vpSeeking) return;
    var d = vpVideo.duration, c = vpVideo.currentTime;
    document.getElementById("vpCur").textContent = _fmtTime(c);
    if (isFinite(d) && d > 0) {
      var sk = document.getElementById("vpSeek");
      sk.value = Math.round(c / d * 1000);
      sk.style.setProperty("--p", (c / d).toFixed(4));
    }
  });
  vpVideo.addEventListener("ended", function () {       // 播完接下一个
    if (vpIndex >= 0 && vpIndex < vpList.length - 1) vpPlayIndex(vpIndex + 1, true);
    else vpSyncPlayIcon();
  });
  var vpSeekEl = document.getElementById("vpSeek");
  vpSeekEl.addEventListener("input", function () {
    vpSeeking = true;
    var d = vpVideo.duration;
    vpSeekEl.style.setProperty("--p", (vpSeekEl.value / 1000).toFixed(4));
    if (isFinite(d) && d > 0) document.getElementById("vpCur").textContent = _fmtTime(d * vpSeekEl.value / 1000);
  });
  vpSeekEl.addEventListener("change", function () {
    var d = vpVideo.duration;
    if (isFinite(d) && d > 0) {
      var t = d * vpSeekEl.value / 1000;
      vpVideo.currentTime = t;
      document.getElementById("vpCur").textContent = _fmtTime(t);
      vpSeekEl.style.setProperty("--p", (vpSeekEl.value / 1000).toFixed(4));
    }
    vpSeeking = false;
  });
  // 兜底：某些浏览器松手不一定触发 change，抬起手指后解除保护
  ["pointerup", "touchend", "mouseup"].forEach(function (ev) {
    vpSeekEl.addEventListener(ev, function () {
      setTimeout(function () { vpSeeking = false; }, 0);
    });
  });
  // 倍速（快进播放）：点按钮向上弹出竖向菜单选择；换视频后重新套用；取值持久化
  var VP_RATES = [0.25, 0.5, 0.75, 1, 1.5, 2, 3, 4, 8];
  var vpRate = 1;
  function vpRateLabel(r) { return (Number.isInteger(r) ? r.toFixed(1) : String(r)) + "×"; }
  function vpApplyRate() {
    try { vpVideo.playbackRate = vpRate; } catch (e) {}
    var btn = document.getElementById("vpRate");
    btn.textContent = vpRateLabel(vpRate);
    btn.classList.toggle("fast", vpRate !== 1);
  }
  function vpRenderRatePop() {
    var box = document.getElementById("vpRateList");
    box.innerHTML = "";
    VP_RATES.forEach(function (r) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "vp-rate-item" + (r === vpRate ? " cur" : "");
      var t = document.createElement("span");
      t.textContent = vpRateLabel(r);
      var tick = document.createElement("span");
      tick.className = "rp-tick";
      tick.textContent = "✓";
      b.append(t, tick);
      b.addEventListener("click", function () {
        vpRate = r;
        vpApplyRate();
        try { localStorage.setItem("ff_video_rate", String(r)); } catch (e) {}
        vpCloseRatePop();
      });
      box.appendChild(b);
    });
    var cur = box.querySelector(".vp-rate-item.cur");
    if (cur) try { cur.scrollIntoView({ block: "nearest" }); } catch (e) {}
  }
  function vpOpenRatePop() {
    vpRenderRatePop();
    document.getElementById("vpRatePop").classList.add("show");
    document.getElementById("vpRate").classList.add("on");
  }
  function vpCloseRatePop() {
    document.getElementById("vpRatePop").classList.remove("show");
    document.getElementById("vpRate").classList.remove("on");
  }
  function vpRestoreRate() {
    try {
      var r = parseFloat(localStorage.getItem("ff_video_rate"));
      if (isFinite(r) && r > 0) vpRate = r;
    } catch (e) {}
    vpApplyRate();
  }
  document.getElementById("vpRate").addEventListener("click", function () {
    var pop = document.getElementById("vpRatePop");
    if (pop.classList.contains("show")) vpCloseRatePop();
    else vpOpenRatePop();
  });
  document.addEventListener("click", function (e) {   // 点别处收起菜单
    var pop = document.getElementById("vpRatePop");
    if (!pop.classList.contains("show")) return;
    if (e.target.closest("#vpRatePop") || e.target.closest("#vpRate")) return;
    vpCloseRatePop();
  });
  var vpVolBar = document.getElementById("vpVolBar");
  var vpVolRange = document.getElementById("vpVol");
  document.getElementById("vpVolBtn").addEventListener("click", function () {
    vpVolBar.classList.toggle("show");
  });
  vpVolRange.addEventListener("input", function () {
    vpVideo.volume = Math.max(0, Math.min(1, vpVolRange.value / 100));
    vpApplyVolume(true);
  });
  document.addEventListener("click", function (e) {
    if (!vpVolBar.classList.contains("show")) return;
    if (e.target.closest("#vpVolBar") || e.target.closest("#vpVolBtn")) return;
    vpVolBar.classList.remove("show");
  });
  vpSyncPlayIcon();

  var initPath = readHashPath();
  updateViewBtn();
  load(initPath === null ? "" : initPath, true);
})();
</script>
</body>
</html>
