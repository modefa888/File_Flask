<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谈赤色 · Red Match</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background:
      radial-gradient(1200px 600px at 20% 10%, rgba(220, 40, 40, .18), transparent 60%),
      radial-gradient(900px 500px at 90% 90%, rgba(160, 20, 30, .22), transparent 60%),
      linear-gradient(135deg, #160406 0%, #2a0808 55%, #3a0a0a 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #ffd8c9;
  }
  body { display: flex; justify-content: center; align-items: center; padding: 20px; }

  .wrap {
    display: flex;
    gap: 22px;
    align-items: stretch;
  }

  .board-card {
    background: linear-gradient(180deg, #2b0a0c 0%, #1a0507 100%);
    border: 1px solid rgba(220, 80, 60, .35);
    border-radius: 18px;
    padding: 18px;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, .55),
      0 0 0 1px rgba(255, 180, 140, .05) inset,
      0 0 60px rgba(220, 40, 40, .12);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #ffd9c2;
    text-shadow: 0 0 14px rgba(255, 80, 60, .5);
  }
  .title small {
    display: block;
    font-size: 10px;
    letter-spacing: 3px;
    color: #b45a4a;
    font-weight: 400;
    margin-top: 2px;
  }
  .combo {
    font-size: 13px;
    color: #ffb89a;
    min-width: 80px;
    text-align: right;
    opacity: 0;
    transition: opacity .3s;
  }
  .combo.on { opacity: 1; }

  #board {
    display: grid;
    grid-template-columns: repeat(8, 44px);
    grid-template-rows:   repeat(8, 44px);
    gap: 4px;
    padding: 6px;
    background: #0d0304;
    border-radius: 12px;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, .8);
    position: relative;
  }

  .cell {
    position: relative;
    border-radius: 9px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    transition: transform .12s ease;
  }
  .cell svg { width: 78%; height: 78%; display: block; pointer-events: none; }
  .cell:hover { transform: translateY(-1px); filter: brightness(1.15); }
  .cell.sel {
    outline: 2px solid #ffe6cf;
    outline-offset: -2px;
    box-shadow: 0 0 18px rgba(255, 210, 170, .8);
    z-index: 2;
  }
  .cell.empty { visibility: hidden; }

  /* 5 种"红"度渐变（浅粉 -> 深血红），全部只以红色深浅区分 */
  .r1 { background: linear-gradient(145deg, #ffe3d6, #ffb39b); box-shadow: 0 3px 0 #c97a68, 0 0 10px rgba(255, 180, 150, .25); }
  .r2 { background: linear-gradient(145deg, #ff9c7a, #f0663f); box-shadow: 0 3px 0 #a83a20, 0 0 12px rgba(255, 110, 70, .35); }
  .r3 { background: linear-gradient(145deg, #e24236, #b01710); box-shadow: 0 3px 0 #6c0a08, 0 0 14px rgba(220, 40, 40, .45); }
  .r4 { background: linear-gradient(145deg, #a5121a, #6c0508); box-shadow: 0 3px 0 #3c0102, 0 0 14px rgba(160, 10, 20, .5); }
  .r5 { background: linear-gradient(145deg, #5c060c, #26010a); box-shadow: 0 3px 0 #12000a, 0 0 10px rgba(90, 6, 12, .6); }

  /* 消除动画 */
  .cell.pop { animation: pop .28s ease-out forwards; }
  @keyframes pop {
    0%   { transform: scale(1);   filter: brightness(1.4); }
    60%  { transform: scale(1.35); filter: brightness(2.4); }
    100% { transform: scale(0);   filter: brightness(0); opacity: 0; }
  }
  .cell.drop { animation: drop .3s cubic-bezier(.5, 1.4, .5, 1); }
  @keyframes drop {
    from { transform: translateY(-120%); opacity: .2; }
    to   { transform: translateY(0);     opacity: 1; }
  }

  .side {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 210px;
  }
  .stat {
    background: linear-gradient(180deg, rgba(60, 10, 12, .9), rgba(30, 4, 6, .9));
    border: 1px solid rgba(220, 80, 60, .25);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: inset 0 0 20px rgba(120, 20, 20, .2);
  }
  .stat .label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #b86a5a;
  }
  .stat .value {
    font-size: 30px;
    font-weight: 700;
    color: #ffe0cc;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px rgba(255, 100, 80, .45);
    line-height: 1.2;
    margin-top: 4px;
  }
  .stat .value.gold { color: #ffd48a; text-shadow: 0 0 14px rgba(255, 190, 100, .55); }

  .btn {
    height: 44px;
    border: 1px solid rgba(255, 200, 170, .25);
    background: linear-gradient(180deg, #8a1414, #4c060a);
    color: #ffe6d4;
    border-radius: 10px;
    font-size: 14px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: transform .1s, filter .15s;
    box-shadow: 0 4px 0 #260103, 0 0 18px rgba(180, 20, 20, .35);
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #260103; }

  .hint {
    font-size: 11px;
    line-height: 1.7;
    color: #a4685a;
    padding: 4px 6px 0;
  }
  .hint b { color: #e0988a; }

  .overlay {
    position: absolute;
    inset: 6px;
    border-radius: 12px;
    background: rgba(10, 2, 3, .82);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .overlay.on { opacity: 1; pointer-events: auto; }
  .overlay h2 {
    margin: 0;
    color: #ffd9c2;
    letter-spacing: 8px;
    text-shadow: 0 0 20px rgba(255, 90, 70, .7);
  }
  .overlay p {
    margin: 0;
    color: #ffb89a;
    font-size: 13px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="board-card">
      <div class="header">
        <div class="title">谈赤色<small>RED · MATCH</small></div>
        <div class="combo" id="combo"></div>
      </div>
      <div id="board">
        <div class="overlay" id="overlay">
          <h2 id="ovTitle">步数已尽</h2>
          <p id="ovScore">最终得分 0</p>
          <button class="btn" id="againBtn" style="width:160px">再来一局</button>
        </div>
      </div>
    </div>

    <div class="side">
      <div class="stat">
        <div class="label">得分 SCORE</div>
        <div class="value gold" id="score">0</div>
      </div>
      <div class="stat">
        <div class="label">剩余步数 MOVES</div>
        <div class="value" id="moves">25</div>
      </div>
      <div class="stat">
        <div class="label">最高连击 COMBO</div>
        <div class="value" id="bestCombo">0</div>
      </div>
      <button class="btn" id="resetBtn">重 开</button>
      <div class="hint">
        <b>玩法：</b>点击相邻两个方块交换位置，<br>
        凑齐 3 个及以上同色红色即消除。<br>
        <b>提示：</b>越靠下的颜色越"沉"，越靠上越"淡"。
      </div>
    </div>
  </div>

<script>
(function () {
  const ROWS = 8, COLS = 8, TOTAL = ROWS * COLS;
  const START_MOVES = 25;

  // 5 种红色的 SVG 内芯（形状不同、颜色只用红色系），避免纯色方块太单调
  const ICONS = {
    r1: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="rgba(255,255,255,.55)"/></svg>`,
    r2: `<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="rgba(255,255,255,.5)"/></svg>`,
    r3: `<svg viewBox="0 0 24 24"><polygon points="12,4 20,12 12,20 4,12" fill="rgba(255,255,255,.5)"/></svg>`,
    r4: `<svg viewBox="0 0 24 24"><polygon points="12,4 21,18 3,18" fill="rgba(255,255,255,.5)"/></svg>`,
    r5: `<svg viewBox="0 0 24 24"><path d="M12 3 L15 10 L22 10.6 L17 15.5 L18.6 22.5 L12 18.8 L5.4 22.5 L7 15.5 L2 10.6 L9 10 Z" fill="rgba(255,255,255,.5)"/></svg>`
  };
  const TYPES = ['r1','r2','r3','r4','r5'];

  const boardEl   = document.getElementById('board');
  const scoreEl   = document.getElementById('score');
  const movesEl   = document.getElementById('moves');
  const comboEl   = document.getElementById('combo');
  const bestEl    = document.getElementById('bestCombo');
  const overlay   = document.getElementById('overlay');
  const ovTitle   = document.getElementById('ovTitle');
  const ovScore   = document.getElementById('ovScore');

  let grid = [];        // grid[r][c] = type 或 null
  let cells = [];       // DOM 引用
  let score = 0;
  let moves = START_MOVES;
  let bestCombo = 0;
  let selected = null;  // [r, c]
  let busy = false;
  let gameEnded = false;

  const sleep = ms => new Promise(res => setTimeout(res, ms));
  const rand  = n  => Math.floor(Math.random() * n);

  function buildDOM() {
    cells = [];
    for (let r = 0; r < ROWS; r++) {
      cells.push([]);
      for (let c = 0; c < COLS; c++) {
        const d = document.createElement('div');
        d.className = 'cell';
        d.addEventListener('click', () => onCell(r, c));
        boardEl.appendChild(d);
        cells[r].push(d);
      }
    }
  }

  function randomType() { return TYPES[rand(TYPES.length)]; }

  function paint(r, c, anim) {
    const t = grid[r][c];
    const d = cells[r][c];
    d.classList.remove('pop', 'drop');
    if (!t) {
      d.className = 'cell empty';
      d.innerHTML = '';
      return;
    }
    d.className = 'cell ' + t + (anim ? ' drop' : '');
    d.innerHTML = ICONS[t];
  }

  function fillAll() {
    do {
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          grid[r][c] = randomType();
    } while (findMatches().length); // 保证开局没有已经 3 连
  }

  function renderAll() {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) paint(r, c, false);
  }

  function findMatches() {
    const out = new Set();
    // 横
    for (let r = 0; r < ROWS; r++) {
      let run = 1;
      for (let c = 1; c <= COLS; c++) {
        if (c < COLS && grid[r][c] && grid[r][c] === grid[r][c-1]) run++;
        else {
          if (run >= 3) for (let k = c - run; k < c; k++) out.add(r + ',' + k);
          run = 1;
        }
      }
    }
    // 竖
    for (let c = 0; c < COLS; c++) {
      let run = 1;
      for (let r = 1; r <= ROWS; r++) {
        if (r < ROWS && grid[r][c] && grid[r][c] === grid[r-1][c]) run++;
        else {
          if (run >= 3) for (let k = r - run; k < r; k++) out.add(k + ',' + c);
          run = 1;
        }
      }
    }
    return [...out].map(s => s.split(',').map(Number));
  }

  function popMatch(list) {
    return new Promise(resolve => {
      list.forEach(([r, c]) => cells[r][c].classList.add('pop'));
      setTimeout(async () => {
        list.forEach(([r, c]) => { grid[r][c] = null; paint(r, c, false); });
        await sleep(60);
        resolve();
      }, 260);
    });
  }

  function collapseAndRefill() {
    // 每列从上往下压，空位顶部补新的
    for (let c = 0; c < COLS; c++) {
      const stack = [];
      for (let r = 0; r < ROWS; r++) if (grid[r][c]) stack.push(grid[r][c]);
      while (stack.length < ROWS) stack.unshift(randomType());
      for (let r = 0; r < ROWS; r++) {
        grid[r][c] = stack[r];
        paint(r, c, true);
      }
    }
  }

  function showCombo(n) {
    if (n < 2) { comboEl.classList.remove('on'); return; }
    comboEl.textContent = `COMBO ×${n}`;
    comboEl.classList.add('on');
    if (n > bestCombo) { bestCombo = n; bestEl.textContent = bestCombo; }
  }

  async function resolveMatches(initialCombo = 1) {
    let combo = initialCombo;
    let matches = findMatches();
    while (matches.length) {
      showCombo(combo);
      const gained = matches.length * 10 * combo;
      score += gained;
      scoreEl.textContent = score;
      await popMatch(matches);
      collapseAndRefill();
      await sleep(280);
      matches = findMatches();
      combo++;
    }
    // combo 淡出
    setTimeout(() => comboEl.classList.remove('on'), 600);
  }

  function areAdjacent(a, b) {
    const [r1, c1] = a, [r2, c2] = b;
    return (Math.abs(r1 - r2) + Math.abs(c1 - c2)) === 1;
  }

  async function onCell(r, c) {
    if (busy || gameEnded) return;
    if (!selected) {
      selected = [r, c];
      cells[r][c].classList.add('sel');
      return;
    }
    const [r0, c0] = selected;
    cells[r0][c0].classList.remove('sel');

    if (r === r0 && c === c0) { selected = null; return; }
    if (!areAdjacent(selected, [r, c])) {
      // 换选
      selected = [r, c];
      cells[r][c].classList.add('sel');
      return;
    }

    // 交换
    busy = true;
    const tmp = grid[r0][c0]; grid[r0][c0] = grid[r][c]; grid[r][c] = tmp;
    paint(r0, c0, false); paint(r, c, false);
    await sleep(180);

    if (findMatches().length === 0) {
      // 无效交换：换回来
      const t2 = grid[r0][c0]; grid[r0][c0] = grid[r][c]; grid[r][c] = t2;
      paint(r0, c0, false); paint(r, c, false);
      busy = false; selected = null;
      return;
    }

    selected = null;
    moves--;
    movesEl.textContent = moves;
    await resolveMatches(1);

    if (moves <= 0) endGame();
    busy = false;
  }

  function endGame() {
    gameEnded = true;
    ovTitle.textContent = '步数已尽';
    ovScore.textContent = `最终得分 ${score} · 最高连击 ×${bestCombo}`;
    overlay.classList.add('on');
  }

  function reset() {
    score = 0; moves = START_MOVES; bestCombo = 0;
    selected = null; busy = false; gameEnded = false;
    scoreEl.textContent = 0;
    movesEl.textContent = START_MOVES;
    bestEl.textContent = 0;
    overlay.classList.remove('on');
    fillAll();
    renderAll();
  }

  document.getElementById('resetBtn').addEventListener('click', reset);
  document.getElementById('againBtn').addEventListener('click', reset);

  buildDOM();
  reset();
})();
</script>
</body>
</html>
